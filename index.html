  if (want < 0.995) {
    keepFrame();                       /* the frame to dissolve from */
    renderScale = want;
    if (!resize()) { fadeShot = null; fadeCtx = null; }   /* nothing re-tiled after all */
  }
}

/* ---------- idle shutdown ----------
   Hidden or unfocused: the loop stops rescheduling, so nothing runs at all —
   no donut, no sampling, no draws. t0 absorbs the paused span so the tumble
   picks up where it left off instead of jumping. */
let paused = false, pausedAt = 0;
const idle = () => document.hidden || !document.hasFocus();
function setPaused(p) {
  if (!P.pauseWhenIdle || p === paused) return;
  paused = p;
  if (p) {
    pausedAt = performance.now();
    ctx.setTransform(1,0,0,1,0,0);
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over"; ctx.filter = "none";
    ctx.fillStyle = "rgba(0,0,0,0.62)";          /* one draw, then silence */
    ctx.fillRect(0, 0, W, H);          /* the contact line dims with everything else */
    stopFlicker();
  } else {
    startFlicker();
    t0 += performance.now() - pausedAt;
    lastFrameAt = 0;                             /* the paused span is not a frame */
    requestAnimationFrame(loop);
  }
}
document.addEventListener("visibilitychange", () => setPaused(idle()));
addEventListener("blur",  () => setPaused(true));
addEventListener("focus", () => setPaused(false));

function loop(now) {
  if (paused) return;
  const t = (now - t0) / 1000;
  const a = performance.now();
  frame(t);
  const script = performance.now() - a;
  /* the rAF timestamp is wall clock, and the only honest measure of a frame */
  const gap = lastFrameAt ? now - lastFrameAt : 0;
  lastFrameAt = now;
  autoQuality(gap);
  if (SHOW_FPS) {
    acc += script; wall += gap;
    if (++fcount >= 20) {
      const ms = wall / fcount;
      hud.textContent = ms.toFixed(1) + " ms/frame  " + (1000 / ms).toFixed(0) + " fps  " +
                        (acc / fcount).toFixed(1) + " ms script  " + cols + "x" + rows +
                        " cells @" + cellPx + "px  scale " + renderScale.toFixed(2);
      acc = 0; wall = 0; fcount = 0;
    }
  }
  requestAnimationFrame(loop);
}

/* ============================================================
   SELF-TEST — ?selftest
   ============================================================ */
const ALL_MODES = ["characters","dither","mosaic","pixel","dots","cross","diamond","voxel","lego","mixed",
  "lines","diagonal","braille","disco","hexdump","matrix","rings","hearts","stars","hexagons",
  "triangles","bubbles","hatch","contour","halfblocks"];
const ALL_BLUR = ["off","gaussian","directional","tilt","lens","progressive"];
const ALL_ANIM = ["wave","pulse","shimmer","ripple","flicker"];

function selftest() {
  let pass = 0, fail = 0;
  const ok = (c, m) => { if (c) pass++; else { fail++; console.error("FAIL:", m); } };

  const lut = buildTone();
  let mono = true;
  for (let i = 1; i < 256; i++) if (lut[i] < lut[i-1] - 1e-6) mono = false;
  ok(mono, "tone LUT monotonic");
  ok(lut[0] >= 0 && lut[255] <= 1, "tone LUT in [0,1]");

  for (const L of [0, 0.5, 1, 1.0000001]) ok((L * 15.999 | 0) < 16 && (L * 15.999 | 0) >= 0, "hex glyph index at L=" + L);
  ok(BRAILLE.length === 256, "braille atlas covers all 256 patterns");

  /* donut must never project outside its buffer over a full rotation */
  const n = 64, R1 = 1, R2 = 2, K2 = 5, K1 = n * K2 * 3 / (8 * (R1 + R2));
  let oob = 0, hits = 0;
  for (let A = 0; A < TAU; A += 0.4) for (let B = 0; B < TAU; B += 0.4) {
    const cA = Math.cos(A), sA = Math.sin(A), cB = Math.cos(B), sB = Math.sin(B);
    for (let th = 0; th < TAU; th += 0.3) for (let ph = 0; ph < TAU; ph += 0.3) {
      const ct = Math.cos(th), st = Math.sin(th), cp = Math.cos(ph), sp = Math.sin(ph);
      const cx = R2 + R1*ct, cy = R1*st;
      const z = K2 + cA*cx*sp + cy*sA;
      if (z <= 0) { oob++; continue; }
      const ooz = 1/z;
      const xp = (n/2 + K1*ooz*(cx*(cB*cp + sA*sB*sp) - cy*cA*sB)) | 0;
      const yp = (n/2 - K1*ooz*(cx*(sB*cp - sA*cB*sp) + cy*cA*cB)) | 0;
      hits++;
      if (xp < 0 || xp >= n || yp < 0 || yp >= n) oob++;
    }
  }
  ok(oob === 0 && hits > 0, "donut projects inside the buffer (" + oob + " strays of " + hits + ")");

  /* ---- the composition has to land inside the *visible* viewport ----
     100vh on a phone is the large viewport: the height you get once the browser
     toolbars have collapsed. The piece is bottom-anchored — drawSource puts the
     reflection tail marginY from the bottom — so laying it out at that height put
     the wordmark and its whole reflection behind the toolbars on load, and the top
     sliver of the donut was all you got. The canvas is 100svh now and every number
     comes off the canvas box, so "the viewport" is the height that is always
     visible. Asserted both ways: it fits the small viewport, and it demonstrably
     did not fit when it was laid out at the large one.

     Device emulation over CDP has no browser chrome, so innerHeight there is the
     whole screen and the bug is invisible. These numbers are real device metrics
     with the real visible height, which is why they are a table and not a probe. */
  {
    const PHONES = [
      { at: "iPhone 15",    vw: 393, vh: 852, svh: 746, dpr: 3 },
      { at: "iPhone 13/14", vw: 390, vh: 844, svh: 739, dpr: 3 },
      { at: "iPhone SE",    vw: 375, vh: 667, svh: 553, dpr: 2 },
      { at: "Pixel 7",      vw: 412, vh: 915, svh: 801, dpr: 2.625 },
      { at: "Galaxy S20",   vw: 360, vh: 800, svh: 700, dpr: 3 }
    ];
    for (const d of PHONES) {
      const fit = compositionAt(d.vw, d.svh, d.dpr);
      ok(fit.tail <= d.svh, "the whole reflection is on screen at " + d.at +
         " (tail " + fit.tail.toFixed(0) + " of " + d.svh + " visible)");
      ok(fit.top >= 0, "and the wordmark's top edge is too at " + d.at +
         " (" + fit.top.toFixed(0) + ")");
      /* the bug this exists for: the same composition laid out at innerHeight */
      const was = compositionAt(d.vw, d.vh, d.dpr);
      ok(was.tail > d.svh, "laying out at innerHeight really did hide it at " + d.at +
         " (tail " + was.tail.toFixed(0) + ", " + (was.tail - d.svh).toFixed(0) + "px below the fold)");
      /* auto-quality may coarsen the grid; it must not move the composition off screen */
      ok(compositionAt(d.vw, d.svh, d.dpr, P.minScale).tail <= d.svh,
         "...and it stays on screen at minScale at " + d.at);
    }
    /* the layout reads the canvas box, so CSS and JS cannot disagree about the height */
    ok(vpW() === cv.clientWidth && vpH() === cv.clientHeight,
       "the layout is keyed to the canvas box, not to innerWidth/innerHeight");
    ok(Math.abs((vpW() / vpH()) / (W / H) - 1) < 0.02,
       "the backing store keeps the canvas box's aspect, so the grid and the hit boxes agree");
    ok(compositionAt(vpW(), vpH(), devicePixelRatio || 1, renderScale).tail <= vpH() + 1,
       "the live composition is inside the live canvas box");
    /* a phone fires resize on every toolbar slide, and every resize() re-tiles */
    const W0 = W, H0 = H, c0 = cellPx;
    ok(resize() === false, "an unchanged viewport does not re-tile the mosaic");
    ok(W === W0 && H === H0 && cellPx === c0, "...and leaves the grid exactly as it was");
    /* dpr 3 phones render at maxDpr, which is the cap doing its job, not a shortfall */
    ok(backing(393, 746, 3, 1).w === backing(393, 746, 2, 1).w,
       "maxDpr caps a 3x phone at the same backing store a 2x one gets");
  }

  /* ---- legibility: how many cells carry each letter, at every window size ----
     The whole piece is glyphs on a grid, so a letter is readable exactly when
     enough cells fall inside it. Floor is 6 x-height cells: measured when the
     contact line was sized, ~3.5 was unreadable mush and ~6 read cleanly.
     Asserted against the real font metrics and the real pitch law, not a copy. */
  const XCELL_FLOOR = 6;
  const SIZES = [[3440,1440],[2560,1440],[1920,1200],[1920,1080],[1680,1050],[1600,900],
                 [1440,900],[1366,768],[1280,1024],[1280,800],[1280,720],[1152,864],
                 [1024,768],[1024,600],[960,540],[800,600],[720,1280],[640,480]];
  const xHeight = (() => {                 /* x-height of the wordmark face, per em */
    tctx.save();
    tctx.font = '200px ' + (FONT_OK ? '"Instrument Serif", ' : '') + 'Georgia, "Times New Roman", serif';
    const m = tctx.measureText("x");
    tctx.restore();
    return (m.actualBoundingBoxAscent || 104) / 200;
  })();
  ok(xHeight > 0.2 && xHeight < 0.9, "wordmark x-height measured sanely (" + xHeight.toFixed(3) + " em)");

  const xcells = (b, pitch) => lockupFs(b.w, b.h) * xHeight / pitch;
  const fixedCells = b => Math.ceil(b.w / P.cellSize) * Math.ceil(b.h / P.cellSize);
  for (const [vw, vh] of SIZES) {
    for (const dpr of [1, 2]) {
      const at = vw + "x" + vh + "@" + dpr + "x";
      const pitch = cellPitchFor(vw, vh, dpr);
      ok(pitch === (pitch | 0) && pitch >= P.cellMin && pitch <= P.cellSize,
         "pitch " + pitch + " is a whole number inside [cellMin,cellSize] at " + at);
      const b = backing(vw, vh, dpr, 1);
      const x = xcells(b, pitch);
      ok(x >= XCELL_FLOOR, "wordmark keeps " + XCELL_FLOOR + " x-cells at " + at + " (" + x.toFixed(1) + ")");
      /* Auto-quality is allowed to coarsen the grid, but not past legibility. That
         used to be a rule the code never enforced and the test only asserted where
         it happened to hold: below 800x600 it did not — at 640x480, minScale reaches
         ~5.4 x-cells and no pitch saves it, cellMin being already the smallest a hex
         digit draws at — so the assertion simply skipped those windows. scaleFloor
         raises the floor on exactly those viewports instead, and the check is now
         unconditional: every window, at the coarsest scale it can actually reach. */
      const floor = scaleFloor(vw, vh, dpr, pitch);
      const worst = xcells(backing(vw, vh, dpr, floor), pitch);
      ok(worst >= XCELL_FLOOR, "wordmark survives the coarsest scale allowed at " + at +
         " (" + worst.toFixed(1) + " cells at scale " + floor.toFixed(2) + ")");
      /* cost: a finer pitch may not cost more than cellBudget, and no window may
         cost more than the fixed pitch already cost it — pixelBudget owns that end */
      const cells = Math.ceil(b.w / pitch) * Math.ceil(b.h / pitch);
      const ceiling = Math.max(P.cellBudget, fixedCells(b));
      ok(cells <= ceiling, "grid stays inside its ceiling at " + at +
         " (" + cells + " vs " + ceiling + ")");
    }
  }
  /* Every window, not just the table: the pitch law has to hold across the whole
     space, and the two properties that matter are cheap to check exhaustively. */
  {
    let minX = null, minLink = null, over = null, minFloor = null, costly = null;
    for (let vw = 640; vw <= 3840; vw += 32) {
      for (let vh = 480; vh <= 2160; vh += 32) {
        for (const dpr of [1, 2]) {
          const b = backing(vw, vh, dpr, 1), pitch = cellPitchFor(vw, vh, dpr);
          const at = vw + "x" + vh + "@" + dpr + "x";
          const cells = Math.ceil(b.w / pitch) * Math.ceil(b.h / pitch);
          const ratio = cells / Math.max(P.cellBudget, fixedCells(b));
          if (!over || ratio > over.ratio) over = { ratio, at, cells };
          const x = xcells(b, pitch);
          if (!minX || x < minX.x) minX = { x, at };
          const l = linkFit(b.w, pitch, linkEls.map(el => el.dataset.label || "")).fs * MONO_XH / pitch;
          if (!minLink || l < minLink.x) minLink = { x: l, at };
          /* and at the coarsest scale auto-quality is allowed to reach here */
          const floor = scaleFloor(vw, vh, dpr, pitch);
          const xf = xcells(backing(vw, vh, dpr, floor), pitch);
          if (!minFloor || xf < minFloor.x) minFloor = { x: xf, at, floor };
          /* the floor must only rise where it has to: past 800 CSS px wide there is
             room to spend and the regulator keeps every bit of minScale's relief */
          if (vw >= 800 && floor > P.minScale && (!costly || floor > costly.floor))
            costly = { floor, at };
        }
      }
    }
    ok(minX.x >= XCELL_FLOOR, "every window from 640x480 up, any shape, clears " + XCELL_FLOOR +
       " x-cells of wordmark (worst " + minX.x.toFixed(1) + " at " + minX.at + ")");
    ok(minFloor.x >= XCELL_FLOOR, "...and still clears it at the coarsest scale allowed there (worst " +
       minFloor.x.toFixed(1) + " at " + minFloor.at + ", scale " + minFloor.floor.toFixed(2) + ")");
    ok(!costly, "no window 800 CSS px or wider pays for that floor" +
       (costly ? " (" + costly.at + " held at " + costly.floor.toFixed(2) + ")" : ""));
    ok(minLink.x >= XCELL_FLOOR, "...and " + XCELL_FLOOR + " of contact line (worst " +
       minLink.x.toFixed(1) + " at " + minLink.at + ")");
    ok(over.ratio <= 1, "grid never exceeds cellBudget or what a fixed pitch already cost (" +
       over.cells + " at " + over.at + ", ratio " + over.ratio.toFixed(2) + ")");
  }

  /* The sweep above starts at 640 CSS px wide, which no phone is. Portrait phones
     are their own shape — around 1:2 — and they all run at dpr 2 or more, so sweep
     that space too rather than assuming the desktop result carries over. (At dpr 1
     a 320px-wide window genuinely cannot hold 6 x-cells; cellMin is already the
     smallest a hex digit draws at. No phone is dpr 1.) */
  {
    let minX = null, minLink = null, over = null, minFloor = null, n = 0;
    for (let vw = 320; vw <= 500; vw += 4) {
      for (let vh = 480; vh <= 1100; vh += 4) {
        /* portrait phones, from a squarish 3:2 to a tall 21:9 — and, because the
           canvas is the small viewport, the same shapes minus the toolbars. A 1:3
           sliver is a shape no phone has and the desktop sweep above owns the rest. */
        const ar = vh / vw;
        if (ar < 1.45 || ar > 2.45) continue;
        for (const dpr of [2, 3]) {
          n++;
          const b = backing(vw, vh, dpr, 1), pitch = cellPitchFor(vw, vh, dpr);
          const at = vw + "x" + vh + "@" + dpr + "x";
          const cells = Math.ceil(b.w / pitch) * Math.ceil(b.h / pitch);
          const ratio = cells / Math.max(P.cellBudget, Math.ceil(b.w / P.cellSize) * Math.ceil(b.h / P.cellSize));
          if (!over || ratio > over.ratio) over = { ratio, at, cells };
          const x = xcells(b, pitch);
          if (!minX || x < minX.x) minX = { x, at };
          const l = linkFit(b.w, pitch, linkEls.map(el => el.dataset.label || "")).fs * MONO_XH / pitch;
          if (!minLink || l < minLink.x) minLink = { x: l, at };
          /* The sweep #2 added only ever checked renderScale 1, and phones were
             exempt from the minScale case above, so the one place the two gaps
             overlapped went unchecked — and it was not empty: at minScale a
             320x568 iPhone 5 / SE-1 fell to 5.99 x-cells and a 383x938 sliver to
             5.71. scaleFloor holds those viewports shallower; this is the check. */
          const floor = scaleFloor(vw, vh, dpr, pitch);
          const xf = xcells(backing(vw, vh, dpr, floor), pitch);
          if (!minFloor || xf < minFloor.x) minFloor = { x: xf, at, floor };
        }
      }
    }
    ok(minX.x >= XCELL_FLOOR, "every one of " + n + " portrait phone shapes clears " + XCELL_FLOOR +
       " x-cells of wordmark (worst " + minX.x.toFixed(1) + " at " + minX.at + ")");
    ok(minFloor.x >= XCELL_FLOOR, "...and clears it at the coarsest scale allowed there too (worst " +
       minFloor.x.toFixed(1) + " at " + minFloor.at + ", scale " + minFloor.floor.toFixed(2) + ")");
    ok(xcells(backing(320, 568, 2, P.minScale), cellPitchFor(320, 568, 2)) < XCELL_FLOOR,
       "and minScale really would have gone under it on a 320x568 phone (" +
       xcells(backing(320, 568, 2, P.minScale), cellPitchFor(320, 568, 2)).toFixed(2) + ")");
    ok(minLink.x >= XCELL_FLOOR, "...and " + XCELL_FLOOR + " of contact line (worst " +
       minLink.x.toFixed(1) + " at " + minLink.at + ")");
    ok(over.ratio <= 1, "the grid stays inside its ceiling on a phone too (" +
       over.cells + " at " + over.at + ", ratio " + over.ratio.toFixed(2) + ")");
  }

  /* ---- the contact line's arrangement is a property of the window ----
     linkFit sizes the type off the grid pitch, and cellPitchFor measures that on the
     full-resolution backing store — but the row's width used to be tested against
     the *live* store, which auto-quality shrinks to minScale about 1.6s after load.
     The type size therefore held and the stacking decision did not: the same window
     put the line on one row on a fast machine and two on a slow one, and the slow
     one watched it re-arrange. The cross-dissolve added in #2 softens a re-tiled
     mosaic; it was never meant to cover a changed layout.

     Both halves are asserted. The arrangement and the type size must not move with
     the scale — and the old basis must be shown to have moved them, or the first
     assertion is testing nothing. */
  {
    const labels = linkEls.map(el => el.dataset.label || "");
    const SCALES = [P.minScale, 0.8, 0.85, 0.9, 0.95, 1];
    let flip = null, size = null, wouldFlip = 0, wouldAt = "", n = 0;
    const sweep = (vw, vh, dpr) => {
      const pitch = cellPitchFor(vw, vh, dpr), full = backing(vw, vh, dpr, 1).w;
      const base = linkFit(full, pitch, labels, full);
      for (const sc of SCALES) {
        n++;
        const live = backing(vw, vh, dpr, sc).w;
        const got = linkFit(full, pitch, labels, live);
        if (!flip && got.stacked !== base.stacked) flip = vw + "x" + vh + "@" + dpr + " at " + sc;
        if (!size && got.fs !== base.fs) size = vw + "x" + vh + "@" + dpr + " at " + sc;
        /* the bug: the same row decided against the shrunken store instead */
        if (linkFit(live, pitch, labels, live).stacked !== base.stacked) {
          wouldFlip++; if (!wouldAt) wouldAt = vw + "x" + vh + "@" + dpr + " at " + sc;
        }
      }
    };
    for (let vw = 640; vw <= 3840; vw += 10)
      for (const dpr of [1, 2]) sweep(vw, Math.round(vw * 9 / 16), dpr);
    for (let vw = 320; vw <= 500; vw += 2)
      for (let vh = 480; vh <= 1100; vh += 8) {
        const ar = vh / vw;
        if (ar >= 1.45 && ar <= 2.45) for (const dpr of [2, 3]) sweep(vw, vh, dpr);
      }
    ok(!flip, "the same viewport stacks the contact line the same way at every scale from " +
       P.minScale + " to 1, over " + n + " of them" + (flip ? " (" + flip + ")" : ""));
    ok(!size, "...and gives it the same type size" + (size ? " (" + size + ")" : ""));
    ok(wouldFlip > 0, "and deciding it on the live store really did re-arrange the row (" +
       wouldFlip + " cases, e.g. " + wouldAt + ")");
    /* the last-resort clamp is the one thing that still reads the live store, because
       overrunning the canvas is about real pixels — it must never be what fires */
    const rowChars2 = r => r.reduce((a, t) => a + t.length, 0) + r.length - 1;
    const widest = labels.map(l => "x".repeat(Math.max(l.length, COPIED.length)));
    let worstRoom = null;
    for (let vw = 320; vw <= 3840; vw += 8) {
      for (const ar of [9 / 16, 3 / 4, 1, 16 / 9, 2, 2.4]) {
        const vh = Math.round(vw * ar);
        if (vh < 240 || vh > 2400) continue;
        for (const dpr of [1, 2, 3]) {
          const pitch = cellPitchFor(vw, vh, dpr), full = backing(vw, vh, dpr, 1).w;
          const f = linkFit(full, pitch, labels, backing(vw, vh, dpr, P.minScale).w);
          const chars = f.stacked ? Math.max.apply(null, widest.map(l => rowChars2(["[", l, "]"])))
                                  : rowChars2(["[", widest[0], "|", widest[1], "]"]);
          const room = chars * f.fs * MONO_ADV /
                       (backing(vw, vh, dpr, P.minScale).w * (1 - 2 * P.marginX));
          if (!worstRoom || room > worstRoom.room) worstRoom = { room, at: vw + "x" + vh + "@" + dpr };
        }
      }
    }
    ok(worstRoom.room <= 1, "the widened row still fits the margins on a minScale canvas (worst " +
       worstRoom.room.toFixed(2) + " of it at " + worstRoom.at + ")");
  }

  /* a big window must keep the grid it has today — the fix is for the small end */
  for (const [vw, vh] of [[1920,1080],[2560,1440],[3440,1440],[1920,1200]])
    ok(cellPitchFor(vw, vh, 1) === P.cellSize, "pitch untouched at " + vw + "x" + vh);
  /* Dragging a window bigger must never hand back a finer grid: at a fixed shape
     the pitch only ever rises. (Across shapes it does not — a tall sliver gets a
     coarser pitch than its area suggests, which is cellBudget doing its job.) */
  for (const [aw, ah] of [[16,9],[16,10],[4,3],[3,4],[21,9],[9,16]]) {
    let mono = true, prev = 0, worst = "";
    for (let k = 60; k <= 240; k += 4) {
      const p2 = cellPitchFor(aw * k, ah * k, 1);
      if (p2 < prev) { mono = false; worst = aw + ":" + ah + " at " + (aw*k) + "x" + (ah*k); }
      prev = p2;
    }
    ok(mono, "pitch never coarsens as a " + aw + ":" + ah + " window grows" + (worst ? " (" + worst + ")" : ""));
  }

  /* ---- auto-quality decides once, on the clock, from real intervals ----
     Two bugs hid in the version before this: a warm-up counted in frames, which
     took a minute on the slow machines it exists for, and a regulator that kept
     trimming, re-tiling the whole mosaic every time. Drive it with synthetic
     frame intervals and hold it to: never during warm-up, at most once ever,
     never on a lone stall, and always for a genuinely slow stream. */
  {
    const saveScale = renderScale, saveAuto = P.autoQuality;
    P.autoQuality = true;
    /* run `ms` of clock at `gap` intervals; `stall` injects one long frame */
    const drive = (gap, ms, stall) => {
      requality();
      renderScale = 1;
      let elapsed = 0, corrections = 0, at = -1, was = 1, n = 0;
      while (elapsed < ms) {
        const g = (stall && n === stall.after) ? stall.ms : gap;
        elapsed += g; n++;
        autoQuality(g);
        if (renderScale !== was) { corrections++; at = elapsed; was = renderScale; }
      }
      return { corrections, at, scale: renderScale, frames: n };
    };

    const fast = drive(8, 8000);                        /* 125fps, target 24 */
    ok(fast.corrections === 0 && fast.scale === 1, "a machine that keeps up is left alone");

    const slow = drive(50, 8000);                       /* 20fps */
    ok(slow.corrections === 1, "a slow machine is corrected exactly once (" + slow.corrections + ")");
    /* the floor is minScale on every window wider than 800 CSS px, and shallower on
       the few narrow ones where minScale would cost the wordmark its sixth cell —
       read it rather than assuming, so this passes on a phone too */
    const FLOOR = scaleFloor(vpW(), vpH(), devicePixelRatio || 1, cellPx);
    ok(slow.scale < 1 && slow.scale >= FLOOR, "the correction lands inside the floor (" +
       slow.scale.toFixed(2) + " >= " + FLOOR.toFixed(2) + ")");
    ok(slow.at >= P.warmupMs && slow.at <= P.warmupMs + P.sampleMs + 4 * 50,
       "it waits out the warm-up before deciding (" + slow.at + "ms)");

    /* the frame-counted warm-up bug: at 5fps, 60 frames is twelve seconds */
    const crawl = drive(200, 30000);
    ok(crawl.corrections === 1, "a crawling machine is corrected once (" + crawl.corrections + ")");
    ok(crawl.at <= 4000, "and within seconds, not frames (" + crawl.at + "ms, " +
       Math.round(crawl.at / 200) + " frames)");

    /* the stall-guard bug, from both sides */
    const blip = drive(8, 8000, { after: 140, ms: 2000 });
    ok(blip.corrections === 0, "one stalled frame does not re-tile the mosaic");
    const heavy = drive(150, 12000);                    /* every frame over 100ms */
    ok(heavy.corrections === 1 && heavy.scale === FLOOR,
       "frames past any stall threshold are the signal, not outliers (" + heavy.scale.toFixed(2) + ")");

    /* and a window change re-arms it, because the cost changed with the window */
    requality();
    ok(!qDone && qSamples.length === 0, "a viewport change re-arms the one correction");

    /* ---- ...and the one correction it does make dissolves instead of cutting ----
       The decision is untouched. What changed is that resize() re-tiles the whole
       mosaic in one frame, which reads as the art jumping about 1.6s after load.
       The frame before the correction is kept and faded out over it. */
    requality(); renderScale = 1; resize(); frame(1.7);
    fadeShot = null;
    drive(150, 12000);
    ok(renderScale < 1, "the correction still fires with the fade in place");
    ok(fadeShot !== null, "and it keeps the frame it is dissolving from");
    ok(fadeShot.width !== W || fadeShot.height !== H,
       "the kept frame is the pre-correction grid (" + fadeShot.width + "x" + fadeShot.height +
       " over " + W + "x" + H + ")");
    ok(Math.abs(fadeAlpha(fadeFrom) - 1) < 1e-9, "the dissolve starts fully on the old frame");
    ok(Math.abs(fadeAlpha(fadeFrom + P.qualityFadeMs / 2) - 0.5) < 1e-9, "and is half way, half way");
    ok(fadeAlpha(fadeFrom + P.qualityFadeMs) === 0, "and is over when qualityFadeMs is up");
    fadeFrom = performance.now() - P.qualityFadeMs - 1;
    compose();
    ok(fadeShot === null, "a finished dissolve releases the frame it was holding");

    P.autoQuality = saveAuto;
    renderScale = saveScale;
    resize(true);
  }

  /* ---- boot waits for the wordmark's own face ----
     FONT_OK started false, so the first frames drew in the Georgia fallback and the
     swap re-measured the lockup: 735px wide to 672 at 1440x900, measured. LOCK.cx and
     LOCK.cy move with GW, and the contact line moves too because it clamps itself
     above the lockup's top edge. Nothing is drawn now until the question is answered
     or the grace runs out. */
  {
    ok(FONT_GATE, "the font gate is open by the time anything renders");
    ok(framesBeforeGate === 0, "not one frame was drawn before it (" + framesBeforeGate + ")");
    const due = Math.min(FONT_SETTLED_AT < 0 ? Infinity : FONT_SETTLED_AT, P.fontGraceMs);
    ok(FONT_GATE_AT + 2 >= due, "it opened on the face or on the grace, whichever came first (gate " +
       FONT_GATE_AT.toFixed(0) + "ms, face " + (FONT_SETTLED_AT < 0 ? "pending" : FONT_SETTLED_AT.toFixed(0) + "ms") +
       ", grace " + P.fontGraceMs + "ms)");
    ok(P.fontGraceMs > 0 && P.fontGraceMs <= 5000,
       "the wait is bounded, so an unreachable stylesheet still paints (" + P.fontGraceMs + "ms)");
    /* why the gate is needed at all: the two faces do not measure the same */
    if (FONT_OK) {
      const withIt = groupSize(W, H).gw;
      FONT_OK = false;
      const without = groupSize(W, H).gw;
      FONT_OK = true;
      ok(withIt !== without, "the fallback and Instrument Serif measure differently (" +
         without + " vs " + withIt + ") — hence the gate");
    } else ok(true, "Instrument Serif unavailable here; the fallback is what draws");
  }

  /* ---- a tap must not slide the row ----
     setLabel swaps a 4-character label for a 7-character one. layoutLinks built the
     row from the live text, so the row's character count changed, x = (W - n*adv)/2
     re-centred it, and every token in the row slid sideways — 58px at 1440x900,
     measured. Slots are sized off the widest label a word can ever show. */
  {
    frame(1.7);
    const snap = () => LINKS.segs.map(g => g.x.toFixed(2) + "," + g.y + "," + g.w.toFixed(2)).join("|");
    const rects = () => LINKS.segs.filter(g => g.el).map(g => {
      const r = g.el.getBoundingClientRect();
      return [r.left, r.top, r.width, r.height].map(v => v.toFixed(1)).join(",");
    }).join("|");
    const was = snap(), wasR = rects();
    for (const el of linkEls) setLabel(el, COPIED);
    frame(1.7);
    ok(snap() === was, "a copied! label moves nothing in the row");
    ok(rects() === wasR, "...and the invisible click targets stay where they were");
    for (const el of linkEls) setLabel(el, NOCOPY);
    frame(1.7);
    ok(snap() === was, "nor does the failure label");
    for (const el of linkEls) setLabel(el, el._chars.map(() => "F").join(""));
    frame(1.7);
    ok(snap() === was, "nor does a decode burst");
    for (const el of linkEls) setLabel(el, el.dataset.label);
    frame(1.7);
    ok(NOCOPY.length === COPIED.length, "the failure label is the width of the success one");
    ok(LINKS.segs.every(g => !g.el || g.w >= COPIED.length * LINKS.adv - 1e-9),
       "every word's slot is at least as wide as the longest label it can show");
    /* the slot is what the type size was computed against, so nothing overruns */
    const line = LINKS.segs[LINKS.segs.length - 1];
    ok(line.x + line.w <= W - W * P.marginX + LINKS.adv,
       "the widened row still sits inside the margins");
  }

  /* ---- a touch has to be able to light a word, and must not leave it stuck ----
     Hover was mouseenter/mouseleave only: on a touch screen that is either no hover
     at all or a synthetic one whose mouseleave never comes. */
  {
    const el = linkEls[0], fire = (type, pointerType) =>
      el.dispatchEvent(new PointerEvent(type, { pointerType, bubbles: false }));
    el._hot = false;
    fire("pointerenter", "touch");
    ok(el._hot === true, "a touch pointer lights the word");
    fire("pointerup", "touch");
    ok(el._hot === false, "and lifting it puts the word out again");
    fire("pointerenter", "touch"); fire("pointercancel", "touch");
    ok(el._hot === false, "a cancelled touch does not leave it stuck bright");
    fire("pointerenter", "mouse");
    ok(el._hot === true, "a mouse still lights it");
    fire("pointerup", "mouse");
    ok(el._hot === true, "...and clicking with a mouse does not put it out");
    fire("pointerleave", "mouse");
    ok(el._hot === false, "leaving with a mouse does");
    el._burst = 0;
  }

  /* ---- background stars fade on their own phases ----
     The whole field used to be re-rolled from one time-quantised seed, so every
     star changed at the same instant six times a second: measured across a frame
     boundary, the field replaced itself (churn 2.09 of its own brightness). Fading
     independently, no single frame may move more than a fraction of it. */
  {
    const SW = 80, SH = 60, dt = 1 / 60, FRAMES = 180;
    let worst = 0, worstAt = 0, litSum = 0, brightSum = 0;
    for (const t0 of [0, 7.25]) {
      let prev = null;
      for (let f = 0; f < FRAMES; f++) {
        const t = t0 + f * dt;
        const now = new Float64Array(SW * SH);
        let bright = 0, lit = 0;
        for (let cy = 0; cy < SH; cy++) for (let cx = 0; cx < SW; cx++) {
          const v = starAt(cx, cy, t);
          now[cy * SW + cx] = v;
          if (v > 0) { lit++; bright += v; }
        }
        if (prev) {
          let d = 0;
          for (let j = 0; j < now.length; j++) d += Math.abs(now[j] - prev[j]);
          if (d / bright > worst) { worst = d / bright; worstAt = t; }
        }
        prev = now; litSum += lit; brightSum += bright;
      }
    }
    ok(worst <= 0.25, "no frame jump-cuts the star field (worst " + worst.toFixed(3) +
       " of its brightness at t=" + worstAt.toFixed(2) + ")");
    /* ...and they are not simply frozen: a static field would pass the above */
    const lit = t => { const a = []; for (let cy = 0; cy < SH; cy++) for (let cx = 0; cx < SW; cx++) a.push(starAt(cx, cy, t) > 0); return a; };
    const a = lit(3), b = lit(4.5);
    let on = 0, changed = 0;
    for (let j = 0; j < a.length; j++) { if (a[j]) on++; if (a[j] !== b[j]) changed++; }
    ok(changed / on >= 0.4, "stars still come and go (" + (changed / on * 100).toFixed(0) + "% turnover in 1.5s)");
    const density = litSum / (FRAMES * 2 * SW * SH);
    ok(density > 0.015 && density < 0.045, "star density stays a speckle (" + (density * 100).toFixed(2) + "% of cells)");
    ok(brightSum / litSum < 0.08, "stars stay faint (mean " + (brightSum / litSum).toFixed(4) + ")");
  }

  /* ---- the copy targets have to sit on the glyphs ----
     They are invisible, so if the layout and the boxes ever drift apart the page
     looks perfect and the links are dead. Hit-test the drawn slots. */
  for (const seg of LINKS.segs) {
    if (!seg.el) continue;
    const k = innerWidth / W;
    const r = seg.el.getBoundingClientRect();
    const cx = (seg.x + seg.w / 2) * k, cy = (seg.y - LINKS.fs * MONO_XH / 2) * k;
    ok(document.elementFromPoint(cx, cy) === seg.el,
       "the centre of '" + seg.text + "' hits its own copy target");
    ok(r.left <= seg.x * k + 1 && r.right >= (seg.x + seg.w) * k - 1,
       "'" + seg.text + "' target spans the drawn word (" + r.left.toFixed(0) + ".." +
       r.right.toFixed(0) + " vs " + (seg.x * k).toFixed(0) + ".." + ((seg.x + seg.w) * k).toFixed(0) + ")");
    ok(r.width > 8 && r.height > 8, "'" + seg.text + "' target is big enough to click");
  }
  ok(LINKS.segs.filter(g => g.el).length === linkEls.length, "every copy target got a slot");

  const save = JSON.parse(JSON.stringify({ renderMode: P.renderMode, blurType: P.blurType, animStyle: P.animStyle, pfx: P.pfx }));
  /* every pixel, not every hundredth: matrix draws a thin moving band over the
     speckle cells only, and a strided sampler misses it as the grid gets finer */
  const inked = () => {
    const d = gctx.getImageData(0, 0, W, H).data;
    for (let i = 3; i < d.length; i += 4) if (d[i] > 0) return true;
    return false;
  };
  for (const m of ALL_MODES) {
    P.renderMode = m;
    try { frame(1.7); ok(inked(), "mode " + m + " draws ink"); }
    catch (e) { ok(false, "mode " + m + " threw: " + e.message); }
  }
  P.renderMode = save.renderMode;
  for (const b of ALL_BLUR) {
    P.blurType = b;
    try { frame(1.7); pass++; } catch (e) { ok(false, "blur " + b + " threw: " + e.message); }
  }
  P.blurType = save.blurType;
  for (const a of ALL_ANIM) {
    P.animStyle = a;
    try { frame(1.7); pass++; } catch (e) { ok(false, "anim " + a + " threw: " + e.message); }
  }
  P.animStyle = save.animStyle;
  for (const k of PFX_ORDER) {
    for (const kk of PFX_ORDER) P.pfx[kk].enabled = (kk === k);
    try { frame(1.7); pass++; } catch (e) { ok(false, "pfx " + k + " threw: " + e.message); }
  }
  P.pfx = save.pfx;

  console.log((fail ? "%cSELFTEST FAIL" : "%cSELFTEST PASS") + " — " + pass + " passed, " + fail + " failed",
              "font-weight:bold;color:" + (fail ? "#f55" : "#5f5"));
  return { pass, fail };
}

/* ---------- link labels ----------
   Each character can scintillate into a hex digit, the same trick the glyph field
   plays. Hover fires a short decode burst, then the word locks so it stays readable
   while you aim at it. The text lives here rather than in the DOM — the elements
   are click targets now, and the canvas draws what these say, so the draw path
   never touches the DOM. */
const HEXD = "0123456789ABCDEF";
function setLabel(el, text) { el._chars = text.split(""); el._text = text; }

/* navigator.clipboard does not exist at all on file:// and other non-secure
   contexts, and mobile Safari rejects the write often enough to matter. Try the
   modern API, fall back to the old selection trick, and only then claim success.
   NOCOPY is the same width as COPIED so the slot it sits in never changes. */
const NOCOPY = "failed!";
function legacyCopy(text) {
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.setAttribute("readonly", "");
  ta.style.cssText = "position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;padding:0;border:0";
  document.body.appendChild(ta);
  let ok = false;
  try { ta.select(); ta.setSelectionRange(0, text.length); ok = document.execCommand("copy"); }
  catch (e) { ok = false; }
  ta.remove();
  return ok;
}
function copyText(text) {
  if (navigator.clipboard && navigator.clipboard.writeText)
    return navigator.clipboard.writeText(text).then(() => true, () => legacyCopy(text));
  return Promise.resolve(legacyCopy(text));
}
linkEls.forEach(el => {
  el.dataset.label = el.textContent.trim();
  el.textContent = "";
  setLabel(el, el.dataset.label);
  el._burst = 0; el._hot = false;
  /* Hover was mouseenter/mouseleave only, so a touch screen got either no hover at
     all — the word never brightens, the decode burst never fires — or a synthetic
     one whose mouseleave never arrives, leaving the word stuck bright. Pointer
     events cover both, and a touch pointer is cooled explicitly when it lifts
     rather than trusting every browser to fire pointerleave for a pointer that has
     ceased to exist. */
  el.addEventListener("pointerenter", () => { if (!el._hot) { el._hot = true; el._burst = 5; } });
  el.addEventListener("pointerleave",  () => { el._hot = false; });
  el.addEventListener("pointercancel", () => { el._hot = false; });
  el.addEventListener("pointerup", e => { if (e.pointerType !== "mouse") el._hot = false; });
  el.addEventListener("click", () => {
    /* the label used to say "copied!" whether or not anything reached the clipboard:
       the rejection was swallowed. Mobile Safari is where that lies most often. */
    const say = ok => {
      setLabel(el, ok ? COPIED : NOCOPY);
      clearTimeout(el._t);
      el._t = setTimeout(() => setLabel(el, el.dataset.label), 1000);
    };
    copyText(el.dataset.copy).then(say, () => say(false));
  });
});

let flicker = null;
function flickerTick() {
  for (const el of linkEls) {
    const p = el._burst > 0 ? 0.55 : el._hot ? 0 : 0.018;
    if (el._burst > 0) el._burst--;
    el._text = el._chars.map(ch => Math.random() < p ? HEXD[(Math.random() * 16) | 0] : ch).join("");
  }
}
const startFlicker = () => { if (!flicker) flicker = setInterval(flickerTick, 110); };
const stopFlicker  = () => { clearInterval(flicker); flicker = null; };

/* ---------- boot ----------
   Nothing is drawn until the wordmark's face is settled: the first frames used to
   render in the Georgia fallback, and the swap to Instrument Serif re-measured the
   lockup and moved it, and the contact line with it. fontGraceMs bounds the wait, so
   a stylesheet that never arrives (file://, no network, a blocked CDN) still paints —
   at which point grp = null in fontReady still picks up a late face, one jump instead
   of one on every load. The stylesheet is render-blocking, so the page was already
   waiting on it before this ever ran. */
const SHOW_FPS = Q.has("fps");
(async () => {
  startFlicker();
  if (SHOW_FPS) hud.style.display = "block";
  TINT = parseTint(P.tint);
  TONE = buildTone();
  await Promise.race([fontReady, new Promise(r => setTimeout(r, P.fontGraceMs))]);
  FONT_GATE = true;
  FONT_GATE_AT = performance.now() - BOOT_AT;
  resize(true);
  monoMetrics();
  if (Q.has("selftest")) { frame(0); selftest(); }
  if (P.pauseWhenIdle && idle()) { frame(0); setPaused(true); stopFlicker(); }   /* loaded in the background */
  else requestAnimationFrame(loop);
})();
</script>
</body>
</html>
