<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>addicted</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:wght@400&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  /* 100vh on a phone is the *large* viewport: the height you get once the browser
     toolbars have collapsed. The composition is bottom-anchored, so laying it out
     at that height puts the wordmark and its whole reflection behind the toolbars
     on load. svh is the small viewport — the height that is visible while the
     toolbars are up — and unlike dvh it is a fixed number that does not slide as
     they retract, so the piece is laid out once and never drifts. The 100vh line
     stays as the fallback for browsers without svh. */
  canvas{display:block;width:100vw;height:100vh;height:100svh}
  #hud{position:fixed;left:10px;top:8px;color:#5f8;font:11px ui-monospace,Consolas,monospace;opacity:.7;display:none}
  /* The contact line is drawn into the source canvas so it becomes glyphs like
     everything else — these are just its click targets, placed from the same
     layout and invisible. Nothing here decides where the words appear. */
  #links{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;
         color:transparent;-webkit-user-select:none;user-select:none;white-space:nowrap}
  /* touch-action kills the 300ms double-tap-zoom wait on the invisible boxes, and
     the tap highlight would flash a grey rectangle over a piece that is all black */
  #links .copy{position:absolute;pointer-events:auto;cursor:pointer;
               touch-action:manipulation;-webkit-tap-highlight-color:transparent}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<div id="links">
  <span class="copy" data-copy="superphoenix26">discord</span>
  <span class="copy" data-copy="addicted@ewho.re">mail</span>
</div>
<script>
"use strict";
/* ============================================================
   "addicted" — 21st.dev-style ASCII/hexdump effect, Canvas2D.
   Source is generated, not a photo: spinning donut.c torus +
   wordmark on a tilted reflective floor. Edit PARAMS and reload.
   ?fps -> frame time readout   ?selftest -> console assert sweep
   ============================================================ */

const PARAMS = {
  renderMode: "hexdump",
  bgMode: "blur", bgBlur: 40, bgOpacity: 13,
  cellSize: 6, coverage: 100, invert: false, styleBlend: "source-over",   /* was 8 — finer grid */
  /* Legibility is decided by how many cells fall inside each letter, so the pitch
     follows the lockup: cellSize is the pitch at cellRef, and a window that draws
     the lockup half that size gets half the pitch. cellMin is the hard floor — a
     hex digit under ~4 device px is a smudge, not a glyph — and cellBudget is the
     ceiling on what the finer grid may cost, in cells. */
  cellMin: 4, cellBudget: 90000,   /* caps the grid only where the pitch goes finer than
                                      cellSize; at cellSize pixelBudget governs the cost */
  cellRef: { w: 1920, h: 1080 },   /* backing store the pitch is calibrated for */
  charSet: "standard", customChars: "",
  brightness: 12, contrast: 115, edgeEmphasis: 25, density: 0,
  toneCurve: [{x:0,y:0},{x:0.35,y:0.20},{x:0.75,y:0.88},{x:1,y:1}],
  tint: "#3ca6ff", tintOpacity: 12, overlayBlend: "multiply",   /* screen would lift pure black */
  saturation: 100, grayscale: 0,
  blurType: "off", blurAmount: 35, blurAngle: 0, directionalBothSides: false,
  tiltFocus: 35, tiltPosition: 50, tiltFeather: 15,
  lensFocus: 40, blurCenterX: 50, blurCenterY: 50,
  progressivePosition: 55, progressiveReverse: false,
  pfx: {
    vignette:  { enabled: true,  intensity: 38 },
    scanLines: { enabled: false, intensity: 40 },
    chromatic: { enabled: false, intensity: 15 },
    bloom:     { enabled: true,  intensity: 25 },
    filmGrain: { enabled: true,  intensity: 10 },
    glitch:    { enabled: false, intensity: 20 },
    pixelate:  { enabled: false, intensity: 15 },
    halftone:  { enabled: false, intensity: 20 },
    filmDust:  { enabled: false, intensity: 20 }
  },
  animated: true, animStyle: "shimmer",
  animSpeed:     { enabled: true, intensity: 90 },
  animIntensity: { enabled: true, intensity: 54 },
  /* followLockup: x/y are offsets from the lockup centre in lockup-widths,
     so the glow stays put when the window resizes. Plain normalized x/y otherwise. */
  lights: { enabled: false, followLockup: true, points: [
    { x: -0.10, y:  0.10, radius: 0.42, intensity: 16 },
    { x:  0.34, y:  0.02, radius: 0.28, intensity: 9 }
  ]},
  mask: { enabled: false, tool:"freehand", brushSize:30, showOverlay:false, invert:false, dataUrl:null, shapes:[] },
  /* not in the 21st.dev set — the lockup this build draws instead of a photo */
  word: "addicted", tilt: -3,
  /* The contact line is measured in cells, not pixels: linkSize is its x-height in
     cells, the unit legibility is actually made of here. Sizing it to fit whatever
     width was left over is what made it illegible on a small window. minXCells is
     the floor the self-test holds every piece of text to — below about 6 cells of
     x-height, glyph text stops being readable and becomes mush. */
  linkSize: 7, minXCells: 6,
  linkRoom: 0.5,      /* wider than this fraction of the window and it stacks instead */
  pauseWhenIdle: true,   /* stop every calculation when the tab is hidden or unfocused */
  marginX: 0.06,      /* lockup right edge, fraction of width */
  marginY: 0.03,      /* reflection tail to bottom edge       */
  maxDpr: 2,          /* render at device pixels: finer grid, crisp glyphs */
  pixelBudget: 9e6,   /* backing-store cap; past this the grid costs more than it shows */
  autoQuality: true,  /* drop resolution until frames fit the budget, then climb back */
  targetMs: 24,       /* ~42fps. Higher = holds full resolution longer */
  warmupMs: 800,      /* ignore the first frames: font, atlases and JIT are settling */
  sampleMs: 800,      /* then watch real frame intervals this long, and decide once */
  minScale: 0.75,     /* never go coarser than this, however slow the machine */
  qualityFadeMs: 320, /* the one correction re-tiles the mosaic: dissolve, don't cut */
  fontGraceMs: 1500   /* boot waits this long for the wordmark's own face, no longer */
};

const P = PARAMS;
const Q = new URLSearchParams(location.search);
const TAU = Math.PI * 2;
const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
const mk = (w,h) => { const c = document.createElement("canvas"); c.width = Math.max(1,w|0); c.height = Math.max(1,h|0); return c; };

/* deterministic per-cell noise — Math.random() would strobe every frame */
function hash(x, y, z) {
  let n = (x|0)*374761393 + (y|0)*668265263 + (z|0)*1274126177;
  n = (n ^ (n >>> 13)) * 1274126177;
  return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
}

/* ---------- surfaces ---------- */
const cv = document.getElementById("c");
const ctx = cv.getContext("2d", { alpha: false });
const hud = document.getElementById("hud");
let W = 0, H = 0, cols = 0, rows = 0, cellPx = 6;   /* cellPx: the live grid pitch, see cellPitchFor */
let src, sctx, glyph, gctx, tmp, tctx, bloomC, bctx, small, smctx;
let LUM = null, COL = null;

let renderScale = 1;          /* driven by the auto-quality loop below */
let lastFrameAt = 0, qSamples = [], qElapsed = 0, qDone = false;
const Q_MIN_SAMPLES = 5;      /* so a very slow machine still gets a median */

/* the viewport changed: measure this one too, and allow it its one correction */
function requality() { qDone = false; qSamples.length = 0; qElapsed = 0; lastFrameAt = 0; }

/* type size of the lockup on a given backing store — the tilt, the floor and the
   grid pitch all key off it (declared, not assigned: cellPitchFor runs at boot) */
function lockupFs(w, h) { return Math.round(Math.min(h * 0.165, w * 0.098)); }

/* backing store for a viewport, before the grid is laid over it */
function backing(vw, vh, dpr, scale) {
  let d = Math.min(P.maxDpr || 1, dpr || 1) * scale;
  const px = vw * vh * d * d;
  if (px > P.pixelBudget) d *= Math.sqrt(P.pixelBudget / px);
  return { w: Math.max(320, (vw * d) | 0), h: Math.max(240, (vh * d) | 0) };
}

/* Grid pitch. Every text size is a fraction of the viewport while the pitch was
   fixed, so on a small window the letters shrank and the grid did not: the cells
   per letter — the whole of legibility here — collapsed. Scale the pitch with the
   lockup instead and that ratio holds, so the piece reads the same at 800x600 as
   at 1920x1080. Clamped at both ends: never finer than a hex digit can draw, never
   coarser than cellSize, so a big window keeps exactly the grid it has today.
   Measured at renderScale 1, so auto-quality still buys back real work. */
function cellPitchFor(vw, vh, dpr) {
  const b = backing(vw, vh, dpr, 1);
  let pitch = clamp(Math.round(P.cellSize * lockupFs(b.w, b.h) / lockupFs(P.cellRef.w, P.cellRef.h)),
                    P.cellMin, P.cellSize);
  /* A window can be shaped so the lockup is tiny on a large canvas — a tall sliver,
     an ultra-wide letterbox. Legibility asks for a fine pitch there and the cell
     count would run away with it, so cellBudget caps the grid whatever the shape. */
  while (pitch < P.cellSize && Math.ceil(b.w / pitch) * Math.ceil(b.h / pitch) > P.cellBudget) pitch++;
  return pitch;
}
/* The viewport is the canvas box, not innerHeight. On a phone innerHeight is the
   *large* viewport — the height once the toolbars have collapsed — while the canvas
   is 100svh, the height that is visible while they are up. Reading the element keeps
   the backing store, the glyph grid and the invisible hit boxes on one number by
   construction, so they cannot disagree about what "the viewport" means. */
const vpW = () => cv.clientWidth  || innerWidth;
const vpH = () => cv.clientHeight || innerHeight;
const cellPitch = () => cellPitchFor(vpW(), vpH(), devicePixelRatio || 1);
/* The backing store this viewport gets at full resolution, whatever renderScale the
   auto-quality regulator has settled on. The grid pitch is already measured here
   (cellPitchFor calls backing(..., 1)); so is the contact line's arrangement, below.
   Both are properties of the window, and neither may depend on how fast the machine
   turned out to be. */
const fullBacking = () => backing(vpW(), vpH(), devicePixelRatio || 1, 1);

/* svh landed in Safari 15.4 and Chrome 108. Older browsers keep the 100vh fallback,
   so measure the visual viewport for them instead — once, and again only when the
   width changes, which is an orientation change. Following it on every toolbar slide
   is the drift svh exists to avoid. */
const HAS_SVH = !!(window.CSS && CSS.supports && CSS.supports("height", "100svh"));
let svhAt = -1;
function viewportFallback() {
  if (HAS_SVH || innerWidth === svhAt) return;
  svhAt = innerWidth;
  cv.style.height = Math.round((window.visualViewport && visualViewport.height) || innerHeight) + "px";
}

/* Returns whether anything actually changed. A phone fires "resize" on every toolbar
   slide, and every resize() re-tiles the whole mosaic — the jump in bug 2. With the
   layout keyed to the small viewport the numbers do not move, so there is nothing to
   rebuild and the piece holds still. */
function resize(force) {
  viewportFallback();
  watchDpr();                        /* before any early return: the listener is once-only */
  const b = backing(vpW(), vpH(), devicePixelRatio || 1, renderScale);
  const pitch = cellPitch();
  if (!force && src && b.w === W && b.h === H && pitch === cellPx) return false;
  W = b.w; H = b.h;
  cellPx = pitch;
  cv.width = W; cv.height = H;
  src = mk(W,H);  sctx = src.getContext("2d", { willReadFrequently: true });
  glyph = mk(W,H); gctx = glyph.getContext("2d", { willReadFrequently: true });
  tmp = mk(W,H);  tctx = tmp.getContext("2d", { willReadFrequently: true });
  bloomC = mk(W >> 2, H >> 2); bctx = bloomC.getContext("2d");
  cols = Math.ceil(W / cellPx); rows = Math.ceil(H / cellPx);
  small = mk(cols, rows); smctx = small.getContext("2d", { willReadFrequently: true });
  LUM = new Float32Array(cols * rows);
  COL = new Uint8ClampedArray(cols * rows * 3);
  atlases.clear();
  lastAtlas = null; lastBucket = -1;
  grp = null;
  return true;
}
addEventListener("resize", () => { if (resize()) requality(); });

/* Dragging the window to a monitor with different scaling changes
   devicePixelRatio without reliably firing "resize", which leaves the canvas
   rendering at the old density — it looks soft until you nudge the window. */
let dprQuery = null;
function onDprChange() { if (resize()) requality(); }
function watchDpr() {
  if (dprQuery) dprQuery.removeEventListener("change", onDprChange);
  dprQuery = matchMedia("(resolution: " + (devicePixelRatio || 1) + "dppx)");
  dprQuery.addEventListener("change", onDprChange, { once: true });
}

/* ---------- tone curve ---------- */
let TONE = null;
function buildTone() {
  const pts = (P.toneCurve || []).slice().sort((a,b) => a.x - b.x);
  const lut = new Float32Array(256);
  for (let i = 0; i < 256; i++) {
    const x = i / 255;
    let y = x;
    if (pts.length >= 2) {
      let j = 0;
      while (j < pts.length - 2 && x > pts[j+1].x) j++;
      const a = pts[j], b = pts[j+1];
      // ponytail: piecewise linear, not monotone cubic. Swap in a spline if a curve editor ever lands.
      const s = b.x === a.x ? 0 : (x - a.x) / (b.x - a.x);
      y = a.y + (b.y - a.y) * clamp(s, 0, 1);
    }
    lut[i] = clamp(y, 0, 1);
  }
  return lut;
}

/* ---------- character ramps + glyph atlas ---------- */
const RAMPS = {
  standard: " .:-=+*#%@",
  blocks:   " \u2591\u2592\u2593\u2588",
  shades:   " .\u00b7:;+=xX$&@",
  binary:   " 01",
  dots:     " .\u00b7\u2022\u25cf",
  hex:      "0123456789ABCDEF"
};
const HEX = RAMPS.hex;
const MATRIX_CHARS = "\uff71\uff72\uff73\uff74\uff75\uff76\uff77\uff78\uff79\uff7a0123456789";
const rampChars = () => (P.charSet === "custom" && P.customChars) ? P.customChars : (RAMPS[P.charSet] || RAMPS.standard);

const atlases = new Map();
function atlas(chars, size, r, g, b) {
  const key = chars.length + "|" + chars[0] + chars[chars.length-1] + "|" + size + "|" + r + "," + g + "," + b;
  let a = atlases.get(key);
  if (a) return a;
  const c = mk(size * chars.length, size), x = c.getContext("2d");
  x.font = Math.round(size * 1.08) + 'px ui-monospace, "SF Mono", Menlo, Consolas, monospace';
  x.textAlign = "center"; x.textBaseline = "middle";
  x.fillStyle = "rgb(" + r + "," + g + "," + b + ")";
  for (let i = 0; i < chars.length; i++) x.fillText(chars[i], i * size + size / 2, size / 2 + size * 0.04);
  a = { c, size, n: chars.length };
  atlases.set(key, a);
  return a;
}
/* colour is bucketed by *normalised* chroma, brightness rides on globalAlpha,
   so a greyscale source only ever builds one atlas. The last bucket is memoised:
   building the Map key string per cell costs more than the draw itself. */
let lastBucket = -1, lastChars = null, lastSize = -1, lastAtlas = null;
function glyphDraw(g, chars, idx, x, y, size, alpha, rgb) {
  const m = Math.max(rgb[0], rgb[1], rgb[2]) || 1;
  const qr = (rgb[0] / m * 3 + 0.5) | 0, qg = (rgb[1] / m * 3 + 0.5) | 0, qb = (rgb[2] / m * 3 + 0.5) | 0;
  const bucket = (qr * 4 + qg) * 4 + qb;
  let a = lastAtlas;
  if (bucket !== lastBucket || chars !== lastChars || size !== lastSize) {
    a = atlas(chars, size, (qr / 3 * 255) | 0, (qg / 3 * 255) | 0, (qb / 3 * 255) | 0);
    lastBucket = bucket; lastChars = chars; lastSize = size; lastAtlas = a;
  }
  const i = idx < 0 ? 0 : idx >= a.n ? a.n - 1 : idx | 0;
  g.globalAlpha = alpha < 0 ? 0 : alpha > 1 ? 1 : alpha;
  g.drawImage(a.c, i * a.size, 0, a.size, a.size, x, y, size, size);
}

/* ============================================================
   SOURCE — what gets ASCII-ified. Stands in for the photo/video.
   ============================================================ */

/* donut.c, shaded into a pixel buffer instead of a terminal.
   Rendered at half size and upscaled: 4x cheaper and it fills the
   sampling gaps for free. */
let dbuf = null, dctx = null, DN = 0;
function drawDonut(box, A, B) {
  const n = Math.max(32, box >> 1);
  if (!dbuf || DN !== n) { DN = n; dbuf = mk(n,n); dctx = dbuf.getContext("2d"); }
  const img = dctx.createImageData(n, n), d = img.data;
  const zb = new Float32Array(n * n);
  const R1 = 1, R2 = 2, K2 = 5, K1 = n * K2 * 3 / (8 * (R1 + R2));
  const cA = Math.cos(A), sA = Math.sin(A), cB = Math.cos(B), sB = Math.sin(B);
  for (let th = 0; th < TAU; th += 0.04) {
    const ct = Math.cos(th), st = Math.sin(th);
    const cx = R2 + R1 * ct, cy = R1 * st;
    for (let ph = 0; ph < TAU; ph += 0.016) {
      const cp = Math.cos(ph), sp = Math.sin(ph);
      const x = cx * (cB * cp + sA * sB * sp) - cy * cA * sB;
      const y = cx * (sB * cp - sA * cB * sp) + cy * cA * cB;
      const ooz = 1 / (K2 + cA * cx * sp + cy * sA);
      const xp = (n / 2 + K1 * ooz * x) | 0;
      const yp = (n / 2 - K1 * ooz * y) | 0;
      if (xp < 0 || xp >= n || yp < 0 || yp >= n) continue;
      const L = cp * ct * sB - cA * ct * sp - sA * st + cB * (cA * st - ct * sA * sp);
      if (L <= 0) continue;
      const i = yp * n + xp;
      if (ooz > zb[i]) {
        zb[i] = ooz;
        const o = i * 4;
        d[o] = d[o+1] = d[o+2] = 255;
        d[o+3] = (Math.pow(L / 1.41421356, 0.7) * 255) | 0;
      }
    }
  }
  dctx.putImageData(img, 0, 0);
  return dbuf;
}

/* The wordmark is measured, and the two faces do not measure the same: at 1440x900
   the lockup is 735px wide in the Georgia fallback and 672 in Instrument Serif. Draw
   the first frames in the fallback and the swap moves the lockup, and with it the
   contact line, which clamps itself above the lockup's top edge. So boot waits —
   see fontReady at the bottom. FONT_SETTLED says the question has been answered;
   grp = null covers a face that arrives after the grace ran out. */
let FONT_OK = false, FONT_SETTLED = false, FONT_GATE = false, framesBeforeGate = 0;
let FONT_SETTLED_AT = -1, FONT_GATE_AT = -1;
const BOOT_AT = performance.now();
/* document.fonts.check() answers "is everything this string would use loaded?", and
   when the family is absent the string falls through to a system serif that always
   is — so it returns true offline, which is the opposite of what it is being asked.
   Ask the set directly instead. */
const haveSerif = () => {
  let got = false;
  document.fonts.forEach(f => { if (f.family === "Instrument Serif" && f.status === "loaded") got = true; });
  return got;
};
const fontReady = (async () => {
  try {
    await document.fonts.load('64px "Instrument Serif"');
    await document.fonts.ready;
    FONT_OK = haveSerif();
  } catch (e) { /* offline: the serif fallback still reads right */ }
  FONT_SETTLED = true;
  FONT_SETTLED_AT = performance.now() - BOOT_AT;
  grp = null;
})();

/* [donut] addicted, transparent background */
let grp = null, gpx = null, GW = 0, GH = 0;
const LOCK = { cx: 0.5, cy: 0.5, w: 1, h: 1 };
/* The lockup's box on a given backing store, measured without drawing it, so the
   self-test can ask where the composition lands on a phone the browser is not. */
function groupSize(w, h) {
  const fs  = lockupFs(w, h);
  const box = Math.round(fs * 1.45);
  const gap = Math.round(fs * 0.28);
  const font = fs + 'px ' + (FONT_OK ? '"Instrument Serif", ' : '') + 'Georgia, "Times New Roman", serif';
  tctx.save();
  tctx.font = font;
  if ("letterSpacing" in tctx) tctx.letterSpacing = (fs * 0.012).toFixed(2) + "px";
  const tw = Math.ceil(tctx.measureText(P.word).width);
  tctx.restore();
  return { fs, box, gap, font, gw: box + gap + tw, gh: Math.max(box, Math.round(fs * 1.35)) };
}

/* ---------- the legibility floor, and what auto-quality may spend against it ----
   x-height of the wordmark's face, per em — the unit minXCells is counted in.
   Measured off the real face, and re-measured if the face settles later, because
   the fallback and Instrument Serif do not measure the same. */
let WORD_XH = 0.51, WORD_XH_FOR = null;
function wordXH() {
  if (WORD_XH_FOR !== FONT_OK && tctx) {
    tctx.save();
    tctx.font = '200px ' + (FONT_OK ? '"Instrument Serif", ' : '') + 'Georgia, "Times New Roman", serif';
    const m = tctx.measureText("x");
    tctx.restore();
    if (m.actualBoundingBoxAscent > 0) WORD_XH = m.actualBoundingBoxAscent / 200;
    WORD_XH_FOR = FONT_OK;
  }
  return WORD_XH;
}

/* Cells of x-height carrying the wordmark on a viewport at a given renderScale —
   the whole of legibility here, since a letter reads exactly when enough cells fall
   inside it. */
function xCellsAt(vw, vh, dpr, scale, pitch) {
  const b = backing(vw, vh, dpr, scale);
  return lockupFs(b.w, b.h) * wordXH() / pitch;
}

/* How coarse auto-quality is allowed to go on this viewport. minScale is the global
   floor, but it was never the whole story: the pitch is measured at full resolution
   and stays put, while the lockup shrinks with renderScale, so dropping to minScale
   spends a quarter of the cells the letters are made of. On most windows there is
   plenty to spend — an iPhone 15 goes 9.8 x-cells to 7.4 — but on a few narrow or
   very tall phones it spends past the floor: 5.99 at 320x568 (iPhone 5 / SE-1) and
   5.71 at 383x938, measured. Legibility outranks the frame rate, and the rule was
   already written down beside the assertion that only happened to hold; this is it
   in code. Everywhere else it returns minScale unchanged and costs nothing. */
function scaleFloor(vw, vh, dpr, pitch) {
  let s = P.minScale || 0.5;
  while (s < 1 && xCellsAt(vw, vh, dpr, s, pitch) < P.minXCells) s = Math.min(1, s + 0.005);
  return s;
}

/* Where the composition sits on a viewport, in CSS pixels down from the top of the
   canvas — the same arithmetic drawSource does below, hoisted so it can be asserted
   for a viewport the window is not currently at. */
function compositionAt(vw, vh, dpr, scale) {
  const b = backing(vw, vh, dpr, scale === undefined ? 1 : scale);
  const g = groupSize(b.w, b.h);
  const gapY = Math.round(g.gh * 0.01), rh = g.gh * 0.78;
  const cy = b.h * (1 - P.marginY) - (g.gh / 2 + gapY + rh);
  const k = vh / b.h;                                  /* backing px -> CSS px */
  return { top: (cy - g.gh / 2) * k, bottom: (cy + g.gh / 2) * k,
           tail: (cy + g.gh / 2 + gapY + rh) * k, gh: g.gh, k };
}

function buildGroup(t) {
  const g = groupSize(W, H);
  const fs = g.fs, box = g.box, gap = g.gap, font = g.font, gw = g.gw, gh = g.gh;
  if (!grp || GW !== gw || GH !== gh) { grp = mk(gw, gh); gpx = grp.getContext("2d"); GW = gw; GH = gh; }
  gpx.setTransform(1,0,0,1,0,0);
  gpx.globalAlpha = 1; gpx.globalCompositeOperation = "source-over"; gpx.filter = "none";
  gpx.clearRect(0, 0, gw, gh);

  const spin = (P.animSpeed.enabled ? P.animSpeed.intensity : 50) / 100;
  gpx.imageSmoothingEnabled = true;
  /* True donut.c tumble: both axes monotonic at donut.c's own 2:1 rate (A += 0.04,
     B += 0.02). Goes edge-on twice a cycle, same as the original.
     For a hole-forward nod instead: A = Math.PI / 2 + 0.9 * Math.sin(t * 0.55 * spin). */
  const A = 1.2 + t * 0.95 * spin;   /* phase offset: t=0 is dead edge-on in donut.c */
  gpx.drawImage(drawDonut(box, A, 0.6 + t * 0.48 * spin), 0, (gh - box) / 2, box, box);

  gpx.font = font;
  if ("letterSpacing" in gpx) gpx.letterSpacing = (fs * 0.012).toFixed(2) + "px";
  gpx.textBaseline = "alphabetic";
  gpx.fillStyle = "#fff";
  gpx.strokeStyle = "#fff";
  gpx.lineJoin = "round";
  gpx.lineWidth = fs * 0.016;
  gpx.fillText(P.word, box + gap, gh - fs * 0.10);
  gpx.strokeText(P.word, box + gap, gh - fs * 0.10);
  return grp;
}

/* ---------- contact line ----------
   Drawn into the source like the lockup, so it becomes glyphs too. Sized from the
   grid rather than from the width left beside the lockup: linkSize is an x-height
   in cells, so the line reads the same on every window instead of being squeezed
   under reading size by whatever room happened to be left. It gets its own row,
   and when the row will not fit it stacks rather than shrinking. */
const MONO = 'ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';
let MONO_XH = 0.55, MONO_ADV = 0.6;      /* measured off the real face at boot */
function monoMetrics() {
  tctx.save();
  tctx.font = "100px " + MONO;
  const m = tctx.measureText("x"), a = tctx.measureText("0").width;
  tctx.restore();
  if (m.actualBoundingBoxAscent > 0) MONO_XH = m.actualBoundingBoxAscent / 100;
  if (a > 0) MONO_ADV = a / 100;
}

const linkEls = [].slice.call(document.getElementById("links").querySelectorAll(".copy"));
const COPIED = "copied!";
/* one row of tokens, single-spaced: "[ discord | mail ]" or, stacked, "[ mail ]" */
const rowChars = r => r.reduce((n, t) => n + t.length, 0) + r.length - 1;

/* Type size for the line, and whether it stacks. The size comes from the grid and
   is not negotiable; the layout is what gives. Past linkRoom of the window the line
   would out-shout the lockup, so it goes to two rows instead of thinning down.
   Widths are checked against the labels at their longest — a click swaps in a
   longer word for a second — so the line never resizes under the reader.

   Two widths, deliberately. `w` is the backing store at full resolution — the same
   basis cellPitchFor measures the pitch on, and therefore the same basis the type
   size is already a multiple of. The arrangement is decided against it so that it is
   a property of the window: auto-quality drops renderScale ~1.6s after load, and
   testing against the shrunken live store instead re-arranged the line under the
   reader on 133 of the 16:9 windows between 900 and 2220 CSS px, measured — one row
   on a fast machine, two on a slow one. The line is sized in cells and the cell
   count does not move with renderScale, so on a down-scaled canvas the row does take
   proportionally more of the visible width — up to linkRoom / minScale, 0.67 rather
   than 0.50. That is the cost of the arrangement holding still, and it is the same
   trade the pitch already makes. `live` is the store the row is actually drawn on,
   and only the last-resort clamp uses it, because overrunning the canvas is about
   real pixels. Over the whole space the piece targets that clamp never fires at
   either width (worst row is 0.84 of the margin box at minScale), so the type size
   comes out identical at every scale — asserted. */
function linkFit(w, pitch, labels, live) {
  let fs = Math.max(4, Math.ceil(pitch * P.linkSize / MONO_XH));
  const wide = labels.map(l => "x".repeat(Math.max(l.length, COPIED.length)));
  const row = (ls, join) => join ? rowChars(["[", ls[0], "|", ls[1], "]"])
                                 : Math.max.apply(null, ls.map(l => rowChars(["[", l, "]"])));
  /* linkRoom is a guard on how much of the window the line's *ink* takes, and the
     slots below change only the whitespace, never a word's own width — so this is
     measured on the labels, exactly as before, and the stacking threshold does not
     move. The hard clamp under it is the one that has to see the widened row. */
  const stacked = row(labels, true) * fs * MONO_ADV > w * P.linkRoom;
  /* last resort: even stacked it overruns the margins, so it does shrink — a window
     this narrow has no reading size left to protect */
  const n = row(wide, !stacked);
  const hard = (live === undefined ? w : live) * (1 - 2 * P.marginX);
  if (n * fs * MONO_ADV > hard) fs = Math.max(4, Math.floor(hard / (n * MONO_ADV)));
  return { fs, stacked };
}

/* A word's slot is as wide as the longest thing that word can ever show — its label,
   or "copied!" after a tap. The row is built from the slots, never from the live text,
   so a tap (or the decode flicker) cannot change the row's character count, re-centre
   it and slide every other token sideways. linkFit already sizes the type off exactly
   these widths, so the two agree. */
const slotChars = (text, el) => el ? Math.max(text.length, COPIED.length) : text.length;

const LINKS = { segs: [], fs: 16, adv: 10, sig: "" };
function layoutLinks(lockTop) {
  const labels = linkEls.map(el => el.dataset.label || "");
  const fit = linkFit(fullBacking().w, cellPx, labels, W);
  const fs = fit.fs, adv = fs * MONO_ADV, lh = Math.round(fs * 1.6);
  const lines = fit.stacked
    ? linkEls.map((el, i) => [["["], [labels[i], el], ["]"]])
    : [[["["], [labels[0], linkEls[0]], ["|"], [labels[1], linkEls[1]], ["]"]]];

  /* Its own row, where it has always sat — the middle of the window — but never
     inside the lockup: a bigger line lifts clear of it instead of overlapping. */
  const blockH = lines.length * lh;
  let cy = H / 2;
  const gap = fs * 0.9;
  if (cy + blockH / 2 + gap > lockTop) cy = lockTop - gap - blockH / 2;
  const top = cy - blockH / 2;

  const segs = [];
  let sig = W + "," + H + "," + fs;
  lines.forEach((line, li) => {
    const slots = line.map(t => slotChars(t[0], t[1]));
    const n = slots.reduce((a, b) => a + b, 0) + line.length - 1;
    let x = Math.round((W - n * adv) / 2);
    const base = Math.round(top + li * lh + lh / 2 + fs * MONO_XH / 2);
    line.forEach((t, i) => {
      segs.push({ x, y: base, text: t[0], el: t[1] || null, w: slots[i] * adv });
      if (t[1]) sig += "|" + Math.round(x) + "," + base + "," + slots[i];
      x += (slots[i] + 1) * adv;
    });
  });
  LINKS.segs = segs; LINKS.fs = fs; LINKS.adv = adv;
  if (sig !== LINKS.sig) { LINKS.sig = sig; placeLinkTargets(); }
}

/* the click targets, straight off the layout above: same rects, so they cannot
   drift from the glyphs and leave the page looking right with dead links */
function placeLinkTargets() {
  const k = vpW() / W, pad = LINKS.fs * 0.35, xh = LINKS.fs * MONO_XH;
  for (const seg of LINKS.segs) {
    if (!seg.el) continue;
    const st = seg.el.style;
    st.left   = ((seg.x - pad) * k).toFixed(1) + "px";
    st.top    = ((seg.y - xh - pad) * k).toFixed(1) + "px";
    st.width  = ((seg.w + pad * 2) * k).toFixed(1) + "px";
    st.height = ((xh + pad * 2) * k).toFixed(1) + "px";
  }
}

function drawLinks(s, t) {
  if (!LINKS.segs.length) return;
  s.save();
  s.font = LINKS.fs + "px " + MONO;
  s.textAlign = "left"; s.textBaseline = "alphabetic";
  const fade = clamp(t / 0.5, 0, 1);             /* the fade-in the CSS used to do */
  for (const seg of LINKS.segs) {
    const hot = seg.el && seg.el._hot;
    const txt = seg.el ? seg.el._text : seg.text;
    /* the brackets and the bar sit back on colour alone — dimming them as well
       drops them under the ink threshold in half the render modes */
    s.globalAlpha = fade;
    s.fillStyle = hot ? "#fff" : seg.el ? "#c8c8c8" : "#8c8c8c";
    s.shadowColor = "rgba(255,255,255,0.9)";
    s.shadowBlur = hot ? LINKS.fs * 0.4 : 0;
    /* centred in its slot, so a longer label grows about its own middle */
    s.fillText(txt, seg.x + (seg.w - txt.length * LINKS.adv) / 2, seg.y);
  }
  s.restore();
}

/* flipped, faded copy for the floor */
let refl = null, rfx = null;
function reflection(g) {
  if (!refl || refl.width !== GW || refl.height !== GH) { refl = mk(GW, GH); rfx = refl.getContext("2d"); }
  rfx.setTransform(1,0,0,1,0,0);
  rfx.globalCompositeOperation = "source-over";
  rfx.clearRect(0, 0, GW, GH);
  rfx.save(); rfx.translate(0, GH); rfx.scale(1, -1); rfx.drawImage(g, 0, 0); rfx.restore();
  rfx.globalCompositeOperation = "destination-in";
  const gr = rfx.createLinearGradient(0, 0, 0, GH);
  gr.addColorStop(0,    "rgba(0,0,0,0.30)");
  gr.addColorStop(0.40, "rgba(0,0,0,0.08)");
  gr.addColorStop(1,    "rgba(0,0,0,0)");
  rfx.fillStyle = gr; rfx.fillRect(0, 0, GW, GH);
  rfx.globalCompositeOperation = "source-over";
  return refl;
}

function drawSource(t) {
  const s = sctx;
  s.setTransform(1,0,0,1,0,0);
  s.globalAlpha = 1; s.globalCompositeOperation = "source-over"; s.filter = "none";
  s.fillStyle = "#000"; s.fillRect(0, 0, W, H);

  const g = buildGroup(t);
  const rc = reflection(g);
  const gapY = Math.round(GH * 0.01), rh = GH * 0.78;
  LOCK.cx = (W * (1 - P.marginX) - GW / 2) / W;
  LOCK.cy = (H * (1 - P.marginY) - (GH / 2 + gapY + rh)) / H;
  LOCK.w = GW / W; LOCK.h = GH / H;
  s.save();
  s.translate(LOCK.cx * W, LOCK.cy * H);
  s.rotate(P.tilt * Math.PI / 180);
  s.drawImage(g, -GW / 2, -GH / 2);

  /* ground plane: foreshortened, blur ramping with distance from the contact line.
     ponytail: 5 bands instead of a per-pixel gradient blur — invisible under the glyph grid. */
  const bands = 5;
  for (let i = 0; i < bands; i++) {
    s.filter = "blur(" + (0.8 + i * 2.2).toFixed(1) + "px)";
    s.drawImage(rc, 0, GH * i / bands, GW, GH / bands,
                -GW / 2 * 1.03, GH / 2 + gapY + rh * i / bands, GW * 1.03, rh / bands + 1);
  }
  s.filter = "none";
  s.restore();

  layoutLinks(LOCK.cy * H - GH / 2);
  drawLinks(s, t);
}

/* ============================================================
   COLOUR CHAIN — brightness, contrast, saturation, grayscale, tint
   Applied to the sampled cell values; identical result to a
   full-canvas pass, a few hundred times cheaper.
   ============================================================ */
const BLEND = {
  "source-over": (a,b) => b,
  "normal":      (a,b) => b,
  "multiply":    (a,b) => a * b / 255,
  "screen":      (a,b) => 255 - (255-a) * (255-b) / 255,
  "overlay":     (a,b) => a < 128 ? 2*a*b/255 : 255 - 2*(255-a)*(255-b)/255,
  "soft-light":  (a,b) => { const A=a/255, B=b/255; return 255 * (B < 0.5 ? A - (1-2*B)*A*(1-A) : A + (2*B-1)*((A<0.25 ? ((16*A-12)*A+4)*A : Math.sqrt(A)) - A)); },
  "lighten":     (a,b) => Math.max(a,b),
  "darken":      (a,b) => Math.min(a,b),
  "difference":  (a,b) => Math.abs(a-b),
  "color-dodge": (a,b) => b >= 255 ? 255 : Math.min(255, a*255/(255-b))
};
let TINT = [60,166,255];
function parseTint(hex) {
  const h = (hex || "#ffffff").replace("#","");
  const v = h.length === 3 ? h.split("").map(c => c+c).join("") : h;
  return [parseInt(v.slice(0,2),16)||0, parseInt(v.slice(2,4),16)||0, parseInt(v.slice(4,6),16)||0];
}

const out3 = [0,0,0];
function adjust(r, g, b) {
  const br = P.brightness / 100 * 128;
  r += br; g += br; b += br;
  const ct = P.contrast / 100;
  r = (r-128)*ct + 128; g = (g-128)*ct + 128; b = (b-128)*ct + 128;
  const l0 = 0.2126*r + 0.7152*g + 0.0722*b;
  const sa = P.saturation / 100;
  r = l0 + (r-l0)*sa; g = l0 + (g-l0)*sa; b = l0 + (b-l0)*sa;
  const gs = P.grayscale / 100;
  if (gs > 0) { const l1 = 0.2126*r + 0.7152*g + 0.0722*b; r += (l1-r)*gs; g += (l1-g)*gs; b += (l1-b)*gs; }
  r = TONE[clamp(r,0,255)|0] * 255; g = TONE[clamp(g,0,255)|0] * 255; b = TONE[clamp(b,0,255)|0] * 255;
  const to = P.tintOpacity / 100;
  if (to > 0) {
    const f = BLEND[P.overlayBlend] || BLEND["source-over"];
    r += (clamp(f(r, TINT[0]),0,255) - r) * to;
    g += (clamp(f(g, TINT[1]),0,255) - g) * to;
    b += (clamp(f(b, TINT[2]),0,255) - b) * to;
  }
  out3[0] = clamp(r,0,255); out3[1] = clamp(g,0,255); out3[2] = clamp(b,0,255);
  return out3;
}

/* animation modulates cell luminance, so the glyphs themselves
   scintillate instead of the whole layer just pulsing */
function animMod(cx, cy, t) {
  if (!P.animated) return 0;
  const amp = (P.animIntensity.enabled ? P.animIntensity.intensity : 0) / 100 * 0.55;
  const sp  = (P.animSpeed.enabled ? P.animSpeed.intensity : 0) / 100 * 3;
  if (amp === 0 || sp === 0) return 0;
  const T = t * sp;
  switch (P.animStyle) {
    case "wave":    return amp * Math.sin(cx * 0.22 - T * 2);
    case "pulse":   return amp * Math.sin(T * 2);
    case "ripple": { const dx = cx - cols/2, dy = cy - rows/2; return amp * Math.sin(Math.sqrt(dx*dx+dy*dy) * 0.3 - T * 3); }
    case "flicker": return amp * (hash(cx, cy, T * 8) - 0.5) * 2;
    case "shimmer":
    default:        return amp * (0.62 * Math.sin(cx * 0.3 + cy * 0.2 + T * 2.4) + 0.38 * (hash(cx, cy, T * 7) - 0.5) * 2);
  }
}

/* ---------- background speckle ----------
   The faint scatter of digits across the dark parts of the frame. Every star has
   its own phase and period and fades through zero, so they come and go on their
   own time. The field used to be re-rolled from hash(x, y, (t * 6) | 0) — one
   seed, shared by every cell and quantised to sixths of a second — so the whole
   field changed at the same instant six times a second and jump-cut as a group. */
const STAR_CUT = 0.945;                /* the top 5.5% of cells are stars... */
function starAt(cx, cy, t) {           /* ...each lit for half of its own cycle */
  const s = hash(cx, cy, 13);
  if (s < STAR_CUT) return 0;
  const k = Math.sin((t * (0.35 + hash(cx, cy, 17) * 0.9) + hash(cx, cy, 19)) * TAU);
  return k < 0.02 ? 0 : (0.027 + 0.836 * (s - STAR_CUT)) * k;   /* peak 0.027..0.073 */
}

/* ============================================================
   CELL RENDERERS — 25 modes
   ============================================================ */
const BAYER = [0,8,2,10, 12,4,14,6, 3,11,1,9, 15,7,13,5];
let BRAILLE = "";
for (let i = 0; i < 256; i++) BRAILLE += String.fromCharCode(0x2800 + i);

function poly(g, cx, cy, r, n, rot) {
  g.beginPath();
  for (let i = 0; i < n; i++) {
    const a = rot + i * TAU / n, px = cx + Math.cos(a)*r, py = cy + Math.sin(a)*r;
    i ? g.lineTo(px, py) : g.moveTo(px, py);
  }
  g.closePath();
}
function star(g, cx, cy, r, n) {
  g.beginPath();
  for (let i = 0; i < n*2; i++) {
    const a = -Math.PI/2 + i * Math.PI / n, rr = i % 2 ? r * 0.42 : r;
    const px = cx + Math.cos(a)*rr, py = cy + Math.sin(a)*rr;
    i ? g.lineTo(px, py) : g.moveTo(px, py);
  }
  g.closePath();
}
function heart(g, cx, cy, r) {
  g.beginPath();
  g.moveTo(cx, cy + r*0.75);
  g.bezierCurveTo(cx - r*1.5, cy - r*0.3, cx - r*0.5, cy - r*1.1, cx, cy - r*0.35);
  g.bezierCurveTo(cx + r*0.5, cy - r*1.1, cx + r*1.5, cy - r*0.3, cx, cy + r*0.75);
  g.closePath();
}
const rgba = (c, a) => "rgba(" + (c[0]|0) + "," + (c[1]|0) + "," + (c[2]|0) + "," + clamp(a,0,1) + ")";

let SRC = null;
function pxLum(x, y) {
  x = clamp(x|0, 0, W-1); y = clamp(y|0, 0, H-1);
  if (!SRC) return gridLum((x / cellPx) | 0, (y / cellPx) | 0);
  const o = (y*W + x) * 4;
  return (0.2126*SRC[o] + 0.7152*SRC[o+1] + 0.0722*SRC[o+2]) / 255;
}
const gridLum = (cx, cy) => (cx < 0 || cy < 0 || cx >= cols || cy >= rows) ? 0 : LUM[cy*cols + cx];

function drawCell(g, mode, x, y, s, L, c, cx, cy, t, la) {
  if (la == null) la = L;
  const mx = x + s/2, my = y + s/2;
  const dm = 1 + P.density / 200;
  const r = s * 0.5 * L * dm;
  switch (mode) {
    case "characters": { const ch = rampChars(); glyphDraw(g, ch, L * (ch.length - 0.001), x, y, s, Math.min(1, 0.2 + la), c); break; }
    case "hexdump":    glyphDraw(g, HEX, L * 15.999, x, y, s, Math.min(1, la * 1.15), c); break;
    case "braille": {
      let m = 0;
      const map = [0,3,1,4,2,5,6,7];
      for (let sx = 0; sx < 2; sx++) for (let sy = 0; sy < 4; sy++)
        if (pxLum(x + sx*s/2 + s/4, y + sy*s/4 + s/8) > 0.42) m |= 1 << map[sx*4+sy];
      if (m) glyphDraw(g, BRAILLE, m, x, y, s, Math.min(1, 0.25 + la), c);
      break;
    }
    case "matrix": {
      const speed = 6 + hash(cx,0,3) * 10;
      const head = (t * speed + hash(cx,0,5) * rows) % (rows + 18);
      const d = head - cy;
      if (d < 0 || d > 16) break;
      const trail = 1 - d / 16;
      const a = Math.min(1, (0.12 + L * 1.4) * trail * (d < 1 ? 2.2 : 1));
      const gcol = d < 1 ? [190,255,205] : [40,235,105];
      glyphDraw(g, MATRIX_CHARS, hash(cx, cy, (t*9)|0) * MATRIX_CHARS.length, x, y, s, a, gcol);
      break;
    }
    case "dither":
      if (L * 1.06 > (BAYER[(cy&3)*4 + (cx&3)] + 0.5) / 16) { g.globalAlpha = 1; g.fillStyle = rgba(c, 1); g.fillRect(x, y, s, s); }
      break;
    case "mosaic":  g.globalAlpha = 1; g.fillStyle = rgba(c, Math.min(1, la*1.2)); g.fillRect(x+0.5, y+0.5, s-1, s-1); break;
    case "pixel":   g.globalAlpha = 1; g.fillStyle = rgba(c, Math.min(1, la*1.2)); g.fillRect(x, y, s, s); break;
    case "halfblocks": {
      const top = pxLum(mx, y + s*0.25), bot = pxLum(mx, y + s*0.75);
      g.globalAlpha = 1;
      g.fillStyle = rgba(c, Math.min(1, top*1.2)); g.fillRect(x, y, s, s/2);
      g.fillStyle = rgba(c, Math.min(1, bot*1.2)); g.fillRect(x, y + s/2, s, s/2);
      break;
    }
    case "dots":    g.globalAlpha = 1; g.fillStyle = rgba(c,1); g.beginPath(); g.arc(mx, my, Math.max(0.2,r), 0, TAU); g.fill(); break;
    case "bubbles":
      g.globalAlpha = 1; g.strokeStyle = rgba(c, 0.9); g.lineWidth = Math.max(0.6, s*0.08);
      g.beginPath(); g.arc(mx, my, Math.max(0.4, r*0.95), 0, TAU); g.stroke();
      if (L > 0.55) { g.fillStyle = rgba(c, 0.8); g.beginPath(); g.arc(mx - r*0.3, my - r*0.3, Math.max(0.2,r*0.16), 0, TAU); g.fill(); }
      break;
    case "rings":
      g.globalAlpha = 1; g.strokeStyle = rgba(c,1); g.lineWidth = Math.max(0.5, s*0.28*L);
      g.beginPath(); g.arc(mx, my, s*0.34, 0, TAU); g.stroke();
      break;
    case "disco": {
      const hue = (cx*9 + cy*13 + t*90) % 360;
      g.globalAlpha = 1; g.fillStyle = "hsl(" + hue + ",90%," + (28 + L*45) + "%)";
      g.beginPath(); g.arc(mx, my, Math.max(0.2,r), 0, TAU); g.fill();
      break;
    }
    case "cross":
      g.globalAlpha = 1; g.strokeStyle = rgba(c,1); g.lineWidth = Math.max(0.5, s*0.16);
      g.beginPath(); g.moveTo(mx-r, my); g.lineTo(mx+r, my); g.moveTo(mx, my-r); g.lineTo(mx, my+r); g.stroke();
      break;
    case "diamond": g.globalAlpha = 1; g.fillStyle = rgba(c,1); poly(g, mx, my, r*1.15, 4, 0); g.fill(); break;
    case "lines":
      g.globalAlpha = 1; g.fillStyle = rgba(c,1);
      g.fillRect(x, my - Math.max(0.4, s*0.45*L)/2, s, Math.max(0.4, s*0.45*L));
      break;
    case "diagonal":
      g.globalAlpha = 1; g.strokeStyle = rgba(c,1); g.lineWidth = Math.max(0.4, s*0.55*L);
      g.beginPath(); g.moveTo(x, y+s); g.lineTo(x+s, y); g.stroke();
      break;
    case "hatch": {
      const lv = Math.ceil(L * 3);
      g.globalAlpha = 1; g.strokeStyle = rgba(c, 0.85); g.lineWidth = Math.max(0.4, s*0.09);
      g.beginPath();
      if (lv >= 1) { g.moveTo(x, y+s); g.lineTo(x+s, y); }
      if (lv >= 2) { g.moveTo(x, y); g.lineTo(x+s, y+s); }
      if (lv >= 3) { g.moveTo(x, y+s/2); g.lineTo(x+s, y+s/2); }
      g.stroke();
      break;
    }
    case "contour": {
      const q = v => Math.floor(v * 7.99);
      const me = q(L);

/* ---------- sample the source grid, then draw every cell ---------- */
/* modes that need finer-than-a-cell detail read the source at full resolution */

  smctx.imageSmoothingEnabled = true;

      LUM[i] = blL; COL[i*3] = blR; COL[i*3+1] = blG; COL[i*3+2] = blB;
      continue;
    }
    const c = adjust(avg[o], avg[o+1], avg[o+2]);
    LUM[i] = (0.2126*c[0] + 0.7152*c[1] + 0.0722*c[2]) / 255;
    COL[i*3] = c[0]; COL[i*3+1] = c[1]; COL[i*3+2] = c[2];
  }

  const cell = [0,0,0];
  const thr = Math.max(0, 0.012 - P.density / 100 * 0.012);
  const ee = P.edgeEmphasis / 100;
  for (let ry = 0; ry < rows; ry++) {
    for (let rx = 0; rx < cols; rx++) {
      if (P.coverage < 100 && hash(rx, ry, 7) * 100 > P.coverage) continue;
      const i = ry * cols + rx;
      let L = LUM[i];
      if (L < 0.004) {                       /* pure background: sparse speckle or nothing */
        const f = starAt(rx, ry, t);
        if (f <= 0) continue;

        drawCell(g, P.renderMode, rx*cs, ry*cs, cs, hash(rx, ry, 11), cell, rx, ry, t, f);
        continue;
      }
      if (ee > 0) {

/* ============================================================
   BLUR — applied to the glyph layer on its way to the screen.
   All band-based; ctx.filter does the actual gaussian.
   ============================================================ */

  if (type === "gaussian") {
    dst.filter = "blur(" + amt.toFixed(1) + "px)";

  } else if (type === "directional") {

    dst.globalAlpha = 1 / n;
    for (let i = from; i <= steps; i++) dst.drawImage(layer, Math.cos(a)*amt*i/steps, Math.sin(a)*amt*i/steps);
    dst.globalAlpha = 1;

    const cy = P.tiltPosition / 100 * H, focus = P.tiltFocus / 100 * H / 2, feather = Math.max(1, P.tiltFeather / 100 * H / 2);
    for (let i = 0; i < H; i += 8) {

      dst.filter = k > 0.01 ? "blur(" + (k * amt).toFixed(1) + "px)" : "none";
      dst.drawImage(layer, 0, i, W, 8, 0, i, W, 8);
    }
  } else if (type === "lens") {
    const cx = P.blurCenterX / 100 * W, cy = P.blurCenterY / 100 * H;
    const focus = P.lensFocus / 100 * Math.max(W, H) / 2;
    const maxR = Math.hypot(W, H) / 2;
    for (let i = bands - 1; i >= 0; i--) {
      const r0 = focus + (maxR - focus) * i / bands;
      const k = i / bands;
      dst.save();
      dst.beginPath(); dst.arc(cx, cy, Math.max(1, r0 + (maxR - focus) / bands), 0, TAU);
      if (i < bands - 1) { dst.arc(cx, cy, Math.max(1, r0), 0, TAU, true); }
      dst.clip();
      dst.filter = k > 0.01 ? "blur(" + (k * amt).toFixed(1) + "px)" : "none";
      dst.drawImage(layer, 0, 0);
      dst.restore();

    const p = P.progressivePosition / 100;

      k = clamp(k, 0, 1);
      dst.filter = k > 0.01 ? "blur(" + (k * amt).toFixed(1) + "px)" : "none";
      dst.drawImage(layer, 0, i, W, 8, 0, i, W, 8);
    }

    dst.filter = "none"; dst.drawImage(layer, 0, 0);
  }
  dst.filter = "none";
}

/* ---------- lights ---------- */
function lightsPass() {
  if (!P.lights.enabled) return;
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  const fl = P.lights.followLockup;
  for (const pt of P.lights.points) {
    const x = fl ? (LOCK.cx + (pt.x || 0) * LOCK.w) * W : (pt.x || 0) * W;
    const y = fl ? (LOCK.cy + (pt.y || 0) * LOCK.h) * H : (pt.y || 0) * H;
    const r = Math.max(1, (pt.radius || 0.2) * (fl ? LOCK.w * W : Math.max(W, H)));
    const a = clamp((pt.intensity == null ? 50 : pt.intensity) / 100, 0, 1);
    const gr = ctx.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, "rgba(255,255,255," + (a * 0.6) + ")");
    gr.addColorStop(1, "rgba(255,255,255,0)");

/* ---------- mask: reveal back to the plain source ---------- */

  if (!maskImg || !maskImg.complete || !maskImg.naturalWidth) return;

  ctx.drawImage(maskImg, 0, 0, W, H);

/* ============================================================

    gr.addColorStop(0.6, "rgba(0,0,0," + (0.35 * I) + ")");
    gr.addColorStop(1, "rgba(0,0,0," + Math.min(1, 1.15 * I) + ")");

function postfx() {

    if (I <= 0) continue;

/* ============================================================
   COMPOSE + LOOP
   ============================================================ */
function compose() {
  ctx.setTransform(1,0,0,1,0,0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over"; ctx.filter = "none";
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);

  const bo = clamp(P.bgOpacity / 100, 0, 1);
  if (P.bgMode === "solid")      { ctx.globalAlpha = bo; ctx.fillStyle = "#060607"; ctx.fillRect(0, 0, W, H); }
  else if (P.bgMode === "photo") { ctx.globalAlpha = bo; ctx.drawImage(src, 0, 0); }
  else if (P.bgMode === "blur")  {
    /* quarter-res: a 40px gaussian over a full 2MP canvas costs ~10x the whole frame */
    const bw = bloomC.width, bh = bloomC.height;
    bctx.setTransform(1,0,0,1,0,0);
    bctx.globalAlpha = 1; bctx.globalCompositeOperation = "copy"; bctx.filter = "none";
    bctx.drawImage(src, 0, 0, bw, bh);
    bctx.globalCompositeOperation = "source-over";
    bctx.filter = "blur(" + (P.bgBlur / 4).toFixed(1) + "px)";
    bctx.drawImage(bloomC, 0, 0);

    ctx.globalAlpha = bo; ctx.drawImage(bloomC, 0, 0, W, H);

/* ---------- the one quality correction, dissolved ----------
   autoQuality still measures once and corrects once — that behaviour is deliberate
   and is not what this touches. But the correction calls resize(), a different
   backing store is a different grid, and every glyph on screen lands somewhere new
   in the same frame: a hard cut, about 1.6s after load. Keep the last frame at the
   old resolution and dissolve into the new one. The snapshot is at the old W/H and
   is drawn stretched to the new ones, which is the same rectangle on screen, so the
   two grids sit exactly on top of each other while one fades out. */

function frame(t) {

   wrong:

     around half the truth, so a regulator fed on it holds a resolution the
