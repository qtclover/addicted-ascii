<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>addicted</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:wght@400&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  /* svh, not vh: vh is the *large* viewport on mobile — the height you get once the
     toolbars have collapsed — and this composition is bottom-anchored, so on load the
     wordmark and its whole reflection sat behind the toolbars. svh rather than dvh
     because dvh tracks the toolbars as they slide, which re-lays the piece out under
     the reader. The vh line is the fallback for browsers without svh. */
  canvas{display:block;width:100vw;height:100vh;height:100svh}
  #links .copy{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  #hud{position:fixed;left:10px;top:8px;color:#5f8;font:11px ui-monospace,Consolas,monospace;
       opacity:.7;display:none;white-space:pre;line-height:1.5}
  /* buttons ported from addicted.md, monochrome to match the glyph field */
  /* Invisible hit layer. The contact line is drawn into the source canvas and comes
     out the far end as hex glyphs like everything else, so there is nothing here to
     paint — only something to click, tab to and read out. Boxes are positioned from
     the canvas layout each time it changes. */
  #links{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .5s ease}
  #links.on{opacity:1}
  #links .copy{position:absolute;pointer-events:auto;cursor:pointer;color:transparent;
               user-select:none;border-radius:3px}
  #links .copy:focus-visible{outline:2px solid rgba(255,255,255,.8);outline-offset:3px}

  /* The door is painted into the canvas with everything else, so this is only
     something to click, tab to and read out — the same trick the contact line uses.
     A black HTML panel over the top would have been a second, alien surface. */
  #gate{position:fixed;inset:0;z-index:2;margin:0;padding:0;border:0;
        background:transparent;color:transparent;cursor:pointer;
        -webkit-appearance:none;appearance:none}
  #gate.off{pointer-events:none}
  #gate:focus-visible{outline:2px solid rgba(255,255,255,.8);outline-offset:-8px}
  @media (prefers-reduced-motion:reduce){ #links{transition:none} }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<!-- the words themselves are drawn into the canvas; these are the hit boxes, placed
     from that same layout so clicks, focus and screen readers still land -->
<div id="links" role="group" aria-label="contact" inert>
  <span class="copy" data-copy="superphoenix26" data-label="discord"></span>
  <span class="copy" data-copy="addicted@ewho.re" data-label="mail"></span>
</div>
<button id="gate" type="button" aria-label="Enter the site. Plays sound."></button>
<!-- src is set on entry, not here: preload="none" still had Chrome fetching (and,
     with no file there yet, retrying) a soundtrack nobody had asked for -->
<audio id="snd" loop preload="none"></audio>
<script>
"use strict";
/* ============================================================
   "addicted" — 21st.dev-style ASCII/hexdump effect, Canvas2D.
   Source is generated, not a photo: spinning donut.c torus +
   wordmark on a tilted reflective floor. Edit PARAMS and reload.
   ?fps -> frame time readout   ?selftest -> console assert sweep
   ============================================================ */

const PARAMS = {
  renderMode: "hexdump",
  bgMode: "blur", bgBlur: 40, bgOpacity: 13,
  cellSize: 4, coverage: 100, invert: false, styleBlend: "source-over",
  /* cellSize is the grid pitch in device pixels, and the sharpness knob that actually
     matters — pixelBudget only feeds it. Most of a frame is fixed cost (the source
     draw, the mip chain, the composite), so halving the pitch is nowhere near four
     times the work: measured at 1920x945, 8px -> 10.9ms, 6px -> 11.4, 5px -> 13.3,
     4px -> 15.5, 3px -> 18.4. 4 buys most of the sharpness inside the 60fps ceiling;
     3 reads less like a glyph field and more like a photograph of one. */
  charSet: "standard", customChars: "",
  brightness: 12, contrast: 115, edgeEmphasis: 25, density: 0,
  toneCurve: [{x:0,y:0},{x:0.35,y:0.20},{x:0.75,y:0.88},{x:1,y:1}],
  tint: "#3ca6ff", tintOpacity: 12, overlayBlend: "multiply",   /* screen would lift pure black */
  saturation: 100, grayscale: 0,
  blurType: "off", blurAmount: 35, blurAngle: 0, directionalBothSides: false,
  tiltFocus: 35, tiltPosition: 50, tiltFeather: 15,
  lensFocus: 40, blurCenterX: 50, blurCenterY: 50,
  progressivePosition: 55, progressiveReverse: false,
  pfx: {
    vignette:  { enabled: true,  intensity: 38 },
    scanLines: { enabled: false, intensity: 40 },
    chromatic: { enabled: false, intensity: 15 },
    bloom:     { enabled: true,  intensity: 25 },
    filmGrain: { enabled: true,  intensity: 10 },
    glitch:    { enabled: false, intensity: 20 },
    pixelate:  { enabled: false, intensity: 15 },
    halftone:  { enabled: false, intensity: 20 },
    filmDust:  { enabled: false, intensity: 20 }
  },
  animated: true, animStyle: "shimmer",
  animSpeed:     { enabled: true, intensity: 90 },
  animIntensity: { enabled: true, intensity: 54 },
  /* followLockup: x/y are offsets from the lockup centre in lockup-widths,
     so the glow stays put when the window resizes. Plain normalized x/y otherwise. */
  lights: { enabled: false, followLockup: true, points: [
    { x: -0.10, y:  0.10, radius: 0.42, intensity: 16 },
    { x:  0.34, y:  0.02, radius: 0.28, intensity: 9 }
  ]},
  mask: { enabled: false, tool:"freehand", brushSize:30, showOverlay:false, invert:false, dataUrl:null, shapes:[] },
  /* not in the 21st.dev set — the lockup this build draws instead of a photo */
  word: "addicted", tilt: -3,
  pauseWhenIdle: true,   /* stop every calculation when the tab is hidden or unfocused */
  maxFps: 60,         /* ceiling once you are past the gate. The shimmer does not read
                         any faster and a 144Hz panel was doing 2.4x the work for it.
                         Uncapped behind the gate so auto-quality measures the real
                         cost of a frame and converges before anyone is looking */
  marginX: 0.06,      /* lockup right edge, fraction of width */
  linkSize: 0.095,    /* contact line height, fraction of frame height. Glyph cells are
                         coarse: below ~0.075 the grid eats the words. 0.115 collides
                         with the lockup at 16:9 */
  marginY: 0.03,      /* reflection tail to bottom edge       */
  maxDpr: 2,          /* render at device pixels: finer grid, crisp glyphs */
  pixelBudget: 9e6,   /* backing-store cap. This is the sharpness knob: at 9e6 a
                         3440x1440 or a 4K window renders 1:1 with no CSS upscaling,
                         which costs ~44fps on the big one. 2.4e6 was the old cap and
                         gave 8.6px cells at ~80fps there. Past ~9e6 the grid costs
                         far more than it shows */
  autoQuality: true,  /* drop resolution until frames fit the budget, then climb back */
  targetMs: 26,       /* frame budget in ms; the ceiling before auto-quality cuts
                         resolution. 26 lets a native-resolution 3440x1440 frame
                         (~22ms) stand; 8 would chase 120fps and cut it straight back */
  floorMs: 46,        /* the framerate this piece will trade sharpness for, and no
                         further. Coarsening the grid keeps every pixel native and
                         only costs detail; shrinking the backing store costs focus,
                         because the browser then stretches the result. Measured on
                         Gecko at 1.72Mpx: the coarsest native grid is 41ms (24fps)
                         and a half-size store is 14ms (60fps) — this piece is a slow
                         shimmer, so 24fps sharp beats 60fps soft. Lower this to
                         prefer smoothness instead */
  minScale: 0.5       /* never go coarser than this, however slow the machine. Lower
                         than it was, because pixelBudget now lets 8MP+ through and
                         auto-quality needs somewhere to go when that is too much */
};

const P = PARAMS;
const Q = new URLSearchParams(location.search);
const TAU = Math.PI * 2;
const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
const mk = (w,h) => { const c = document.createElement("canvas"); c.width = Math.max(1,w|0); c.height = Math.max(1,h|0); return c; };

/* deterministic per-cell noise — Math.random() would strobe every frame.
   imul keeps every product in int32; plain * overflows to a double and drops
   the low bits the mix depends on. */
function hash(x, y, z) {
  let n = (Math.imul(x|0, 374761393) + Math.imul(y|0, 668265263) + Math.imul(z|0, 1274126177)) | 0;
  n = Math.imul(n ^ (n >>> 13), 1274126177);
  return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
}

/* ---------- surfaces ---------- */
const cv = document.getElementById("c");
const ctx = cv.getContext("2d", { alpha: false });
const hud = document.getElementById("hud");
let W = 0, H = 0, cols = 0, rows = 0, DPX = 1;
let src, sctx, glyph, gctx, tmp, tctx, bloomC, bctx, small, smctx;
let LUM = null, COL = null;

/* Everything downstream measures the canvas element's own box rather than
   innerWidth/innerHeight, so the backing store, the glyph grid and the invisible copy
   targets cannot disagree about what the viewport is — they used to, by the height of
   a phone's toolbars. It also means a host that reports a zero-sized window (an
   unlaid-out preview pane) falls back instead of computing a DPX of 320. */
/* Portrait is a different composition, not the same one squeezed. The piece is laid
   out for a wide field: the lockup sits bottom right against its own margin and the
   contact line sits bottom left, with the empty middle carrying it. On a phone that
   arrangement collapses — the two ends meet, and everything above them is dead black.
   So a tall viewport gets its own arrangement instead, centred and stacked. */
let PORTRAIT = false;
const PORTRAIT_AT = 0.8;      /* width/height below this is treated as tall */
let vpW = 0, vpH = 0;
let measureViewport = function () {
  const r = cv.getBoundingClientRect();
  vpW = Math.max(1, Math.round(r.width) || innerWidth || 320);
  vpH = Math.max(1, Math.round(r.height) || innerHeight || 240);
}

let renderScale = 1;          /* driven by the auto-quality loop below */
let lastCell = -1;            /* the grid pitch the current buffers were built for */
/* Cap first, scale second. Capping the *product* pinned the backing store to the
   budget whatever renderScale said, so auto-quality walked the scale all the way
   to minScale with no effect on exactly the big windows it exists for. */
function backingDpr(iw, ih, devPr, scale) {
  let dpr = Math.min(P.maxDpr || 1, devPr || 1);
  const budget = P.pixelBudget || 2.4e6;
  const px = iw * ih * dpr * dpr;
  if (px > budget) dpr *= Math.sqrt(budget / px);
  return dpr * scale;
}
/* Only 1/k survives the snap below, so a scale of 0.75 is a lie: it asks for 25%
   fewer pixels and gets none, and auto-quality then has to jump straight to a half.
   Quantise here and the walk moves between the states that actually exist. */
const quantScale = (v) => 1 / Math.max(1, Math.round(1 / Math.max(0.05, v)));

/* When the backing store is smaller than the window the browser stretches it, and
   the ratio decides whether that reads as a coarse grid or as a smear. Nearest
   neighbour at 1.7x doubles some pixels and not others — irregular, and worse than
   the blur it replaced. At a whole number every cell is the same size and the field
   looks deliberately chunky, which is the right look for a grid of hex digits.
   So the store is snapped to an exact 1/k of the window rather than an arbitrary
   fraction of it: k is the only quantity the eye can see here. */
function snapDivisor(scale, devPr) { return Math.max(1, Math.round(1 / Math.max(0.05, scale * devPr))); }
function resize() {
  measureViewport();
  PORTRAIT = vpW / vpH < PORTRAIT_AT;
  const dpr = backingDpr(vpW, vpH, devicePixelRatio, renderScale);
  if (dpr < 1) {                       /* upscaling: land on an integer ratio */
    const k = snapDivisor(renderScale, Math.min(P.maxDpr || 1, devicePixelRatio || 1));
    W = Math.max(320, Math.round(vpW / k));
    H = Math.max(240, Math.round(vpH / k));
  } else {
    W = Math.max(320, (vpW * dpr) | 0);
    H = Math.max(240, (vpH * dpr) | 0);
  }
  /* smoothing is what turned hard-edged glyphs into grey mush; with the integer
     snap above, nearest neighbour gives clean whole-pixel cells instead */
  cv.style.imageRendering = W < vpW ? "pixelated" : "auto";
  /* Snapping means several render scales land on the same divisor, and re-tiling to
     the size you are already at is pure cost: six canvases, the atlas, the mosaic.
     Nothing has moved, so leave it alone — but "nothing" has to include the grid
     pitch. Checking only the canvas dimensions made cellSize changes silently do
     nothing, because cols and rows are rebuilt below this line. */
  if (src && cv.width === W && cv.height === H && lastCell === P.cellSize) { watchDpr(); return; }
  lastCell = P.cellSize;
  cv.width = W; cv.height = H;
  DPX = W / vpW;                       /* device px per CSS px — post-effects size themselves in CSS px */
  /* only `small` and `sub` are ever read back; willReadFrequently on the rest
     forces them off the GPU for draws that never need it */
  src = mk(W,H);  sctx = src.getContext("2d");
  glyph = mk(W,H); gctx = glyph.getContext("2d");
  tmp = mk(W,H);  tctx = tmp.getContext("2d");
  bloomC = mk(W >> 2, H >> 2); bctx = bloomC.getContext("2d");
  chAcc = null; hgrid = null;          /* lazily rebuilt by the effects that need them */
  mipA = null; mipB = null;            /* downscale ping-pong, rebuilt on first sample */
  cols = Math.ceil(W / P.cellSize); rows = Math.ceil(H / P.cellSize);
  small = mk(cols, rows); smctx = small.getContext("2d", { willReadFrequently: true });
  sub = null;
  LUM = new Float32Array(cols * rows);
  COL = new Uint8ClampedArray(cols * rows * 3);
  atlases.clear(); masks.clear();
  lastAtlas = null; lastBucket = -1;
  lastMask = null; lastMaskKey = ""; gimg = null; gbuf = null;
  grp = null; refl = null; refl2 = null;
  restartMeasure();                              /* a rebuild is not a fair sample */
  watchDpr();
  noteRetile();
}

/* A drag fires resize per pixel and every one of those reallocates six canvases
   and drops the glyph atlas. Coalesce to one per frame. */
let resizeRaf = 0;
/* Before the door opens, any resize reopens the auto-quality walk: nothing is on
   screen to see the corrections. After it, only a real change of surface does.
   Gecko fires resize events for chrome nobody touched — a toolbar appearing, a
   scrollbar, a zoom quantisation — and Chrome does not. Each one used to hand the
   visitor the exact re-tile the door exists to hide, about a second after entering,
   which is why this looked like a Firefox-only bug. It was a Firefox-only trigger
   for a hole that was always there. */
const reopensWalk = (before, after, isEntered) => !isEntered || Math.abs(after - before) > before * 0.25;
function scheduleResize() {
  if (resizeRaf) return;
  resizeRaf = requestAnimationFrame(() => {
    resizeRaf = 0;
    const was = W * H;
    retileWhy = "resize";
    resize();
    if (reopensWalk(was, W * H, entered)) {
      adapting = true; adjusts = 0; undoStep = null;
      rungBlocked.fx = rungBlocked.cell = rungBlocked.scale = false;
    }
    if (paused) { frame((pausedAt - t0) / 1000); dimPaused(); }   /* else it stays blank until focus returns */
  });
}
addEventListener("resize", scheduleResize);

/* Dragging the window to a monitor with different scaling changes
   devicePixelRatio without reliably firing "resize", which leaves the canvas
   rendering at the old density — it looks soft until you nudge the window. */
let dprQuery = null, lastDpr = devicePixelRatio || 1;
/* Only a real change counts. The query below is built by pasting devicePixelRatio
   into a string, and a fractional ratio can serialise to something that does not
   match the state it was built from — Gecko then fires `change` at once, for a
   display nobody touched, and the re-tile that followed was indistinguishable from
   the jump. Re-arm and say nothing when the number has not moved. */
function onDprChange() {
  const now = devicePixelRatio || 1;
  if (now === lastDpr) { watchDpr(); return; }
  lastDpr = now;
  retileWhy = "dpr " + lastDpr + " -> " + now;
  scheduleResize();
}
function watchDpr() {
  if (dprQuery) dprQuery.removeEventListener("change", onDprChange);
  dprQuery = matchMedia("(resolution: " + (devicePixelRatio || 1) + "dppx)");
  dprQuery.addEventListener("change", onDprChange, { once: true });
}

/* ---------- re-tile log ----------
   A jump the visitor can see is always a re-tile, and the only useful question is
   which one. Every call to resize() lands here with the reason that caused it, and
   ?diag puts the list on screen — a browser I cannot drive can still tell me what
   it did. */
const RETILES = [];
let retileWhy = "boot";
function noteRetile() {
  const line = retileWhy + "  @" + Math.round(performance.now()) + "ms  scale " +
               renderScale.toFixed(2) + "  " + cols + "x" + rows + (entered ? "  AFTER ENTRY" : "");
  RETILES.push(line);
  if (RETILES.length > 14) RETILES.shift();
  if (SHOW_DIAG) console.log("[retile]", line);
  retileWhy = "?";
}

/* ---------- tone curve ---------- */
let TONE = null;
function buildTone() {
  const pts = (P.toneCurve || []).slice().sort((a,b) => a.x - b.x);
  const lut = new Float32Array(256);
  for (let i = 0; i < 256; i++) {
    const x = i / 255;
    let y = x;
    if (pts.length >= 2) {
      let j = 0;
      while (j < pts.length - 2 && x > pts[j+1].x) j++;
      const a = pts[j], b = pts[j+1];
      // ponytail: piecewise linear, not monotone cubic. Swap in a spline if a curve editor ever lands.
      const s = b.x === a.x ? 0 : (x - a.x) / (b.x - a.x);
      y = a.y + (b.y - a.y) * clamp(s, 0, 1);
    }
    lut[i] = clamp(y, 0, 1);
  }
  return lut;
}

/* ---------- character ramps + glyph atlas ---------- */
const RAMPS = {
  standard: " .:-=+*#%@",
  blocks:   " \u2591\u2592\u2593\u2588",
  shades:   " .\u00b7:;+=xX$&@",
  binary:   " 01",
  dots:     " .\u00b7\u2022\u25cf",
  hex:      "0123456789ABCDEF"
};
const HEX = RAMPS.hex;
const MATRIX_CHARS = "\uff71\uff72\uff73\uff74\uff75\uff76\uff77\uff78\uff79\uff7a0123456789";
const rampChars = () => (P.charSet === "custom" && P.customChars) ? P.customChars : (RAMPS[P.charSet] || RAMPS.standard);

const atlases = new Map();
function atlas(chars, size, r, g, b) {
  /* the whole ramp is the key: two ramps of the same length that share a first and
     last character are a different set of glyphs, and used to collide */
  const key = chars + "|" + size + "|" + r + "," + g + "," + b;
  let a = atlases.get(key);
  if (a) return a;
  const c = mk(size * chars.length, size), x = c.getContext("2d");
  x.font = Math.round(size * 1.08) + 'px ui-monospace, "SF Mono", Menlo, Consolas, monospace';
  x.textAlign = "center"; x.textBaseline = "middle";
  x.fillStyle = "rgb(" + r + "," + g + "," + b + ")";
  for (let i = 0; i < chars.length; i++) x.fillText(chars[i], i * size + size / 2, size / 2 + size * 0.04);
  a = { c, size, n: chars.length };
  atlases.set(key, a);
  return a;
}
/* colour is bucketed by *normalised* chroma, brightness rides on globalAlpha,
   so a greyscale source only ever builds one atlas. The last bucket is memoised:
   building the Map key string per cell costs more than the draw itself. */
let lastBucket = -1, lastChars = null, lastSize = -1, lastAtlas = null;

/* ---------- glyph layer, composited in JS ----------
   A canvas-to-canvas drawImage costs ~2µs however small the blit is, and a frame
   is thousands of them: 4223 cells measured 9ms as drawImage and 3.3ms written
   straight into an ImageData. Live, that is 48fps -> 93fps at 1912x948. Every
   source was tried — ImageBitmap and OffscreenCanvas are both *slower* than a
   plain canvas — so the fix is to stop asking the canvas to do it.
   Only the modes whose whole output is glyph blits can use this; the ones that
   draw paths still go through the canvas, and both write the same layer.
   Which path wins is a browser property, not a fact: Chromium's drawImage is dear
   and its putImageData cheap, Gecko is the reverse and this costs it ~1.8ms of a
   33ms frame. This table is the switch — empty it to put every mode back on the
   canvas path. Chromium is what the piece is tuned for, so it stays on by default. */
const GLYPHONLY = { hexdump: 1, characters: 1, braille: 1, matrix: 1 };
/* Measured on both engines rather than assumed, and the assumption held — but only
   at the sizes the piece actually settles on. Which path is cheaper flips with cell
   count, so a benchmark taken at the wrong size picks the wrong path:
     Gecko,    423x254 cells (scale 1.00):  buffer 22.7ms  canvas 18.3ms  -> canvas
     Gecko,    211x127 cells (scale 0.50):  buffer 23.4ms  canvas 27.5ms  -> buffer
     Chromium, 480x237 cells (scale 1.00):  buffer 17.7ms  canvas 47.5ms  -> buffer
   Auto-quality converges Gecko to 211x127, so buffer is right there too, and a
   boot-time tuner that sampled scale 1.00 cost Firefox 6fps by switching away from
   it. Empty this table to put every mode back on the canvas path. */

let gimg = null, gbuf = null, GBUF_ON = false;
const masks = new Map();
let lastMask = null, lastMaskKey = "";
/* the glyph shapes as a plain coverage map — colour is the cell's own, applied per
   pixel, which is finer than the canvas path's 4x4x4 chroma buckets */
function maskAtlas(chars, size) {
  const key = chars + "|" + size;
  if (lastMaskKey === key) return lastMask;
  let a = masks.get(key);
  if (!a) {
    const c = mk(size * chars.length, size), x = c.getContext("2d", { willReadFrequently: true });
    x.font = Math.round(size * 1.08) + 'px ui-monospace, "SF Mono", Menlo, Consolas, monospace';
    x.textAlign = "center"; x.textBaseline = "middle"; x.fillStyle = "#fff";
    for (let i = 0; i < chars.length; i++) x.fillText(chars[i], i * size + size / 2, size / 2 + size * 0.04);
    const d = x.getImageData(0, 0, c.width, c.height).data;
    const m = new Uint8Array(c.width * c.height);
    for (let i = 0; i < m.length; i++) m[i] = d[i*4 + 3];
    /* tight ink bounds per glyph: a 6px cell is mostly empty margin, and a blank
       ramp character is entirely empty — no reason to walk those pixels */
    const n = chars.length;
    const bx0 = new Int32Array(n), bx1 = new Int32Array(n), by0 = new Int32Array(n), by1 = new Int32Array(n);
    for (let i = 0; i < n; i++) {
      let x0 = size, x1 = -1, y0 = size, y1 = -1;
      for (let yy = 0; yy < size; yy++) for (let xx = 0; xx < size; xx++) {
        if (m[yy * c.width + i * size + xx]) {
          if (xx < x0) x0 = xx; if (xx > x1) x1 = xx;
          if (yy < y0) y0 = yy; if (yy > y1) y1 = yy;
        }
      }
      bx0[i] = x0; bx1[i] = x1; by0[i] = y0; by1[i] = y1;   /* x1 < x0 => blank */
    }
    a = { m, w: c.width, n, bx0, bx1, by0, by1 };
    masks.set(key, a);
  }
  lastMaskKey = key; lastMask = a;
  return a;
}
function glyphBufBegin() {
  if (!gimg || gimg.width !== W || gimg.height !== H) {
    gimg = gctx.createImageData(W, H);           /* born zeroed */
    gbuf = new Uint32Array(gimg.data.buffer);
  } else gbuf.fill(0);
  GBUF_ON = true;
}
function glyphBufEnd() { GBUF_ON = false; gctx.putImageData(gimg, 0, 0); }

function glyphDraw(g, chars, idx, x, y, size, alpha, rgb) {
  if (GBUF_ON) {
    const a = maskAtlas(chars, size);
    const i = idx < 0 ? 0 : idx >= a.n ? a.n - 1 : idx | 0;
    const a255 = alpha <= 0 ? 0 : alpha >= 1 ? 255 : (alpha * 255) | 0;
    if (!a255) return;
    const y1 = a.by1[i];
    if (y1 < a.by0[i]) return;                  /* blank glyph, e.g. a ramp's space */
    /* putImageData takes unpremultiplied RGBA, little-endian: R,G,B,A */
    const packed = ((rgb[2]|0) << 16) | ((rgb[1]|0) << 8) | (rgb[0]|0);
    const m = a.m, mw = a.w, sx0 = i * size, px = x | 0, py = y | 0;
    const x0 = a.bx0[i];
    const xEnd = a.bx1[i] < W - 1 - px ? a.bx1[i] : W - 1 - px;
    const yEnd = y1 < H - 1 - py ? y1 : H - 1 - py;
    for (let ry = a.by0[i]; ry <= yEnd; ry++) {
      let s = ry * mw + sx0 + x0, d = (py + ry) * W + px + x0;
      for (let q = x0; q <= xEnd; q++, s++, d++) {
        const ma = m[s];

      }

  }
  const m = Math.max(rgb[0], rgb[1], rgb[2]) || 1;
  const qr = (rgb[0] / m * 3 + 0.5) | 0, qg = (rgb[1] / m * 3 + 0.5) | 0, qb = (rgb[2] / m * 3 + 0.5) | 0;
  const bucket = (qr * 4 + qg) * 4 + qb;
  let a = lastAtlas;
  if (bucket !== lastBucket || chars !== lastChars || size !== lastSize) {
    a = atlas(chars, size, (qr / 3 * 255) | 0, (qg / 3 * 255) | 0, (qb / 3 * 255) | 0);
    lastBucket = bucket; lastChars = chars; lastSize = size; lastAtlas = a;
  }
  const i = idx < 0 ? 0 : idx >= a.n ? a.n - 1 : idx | 0;
  g.globalAlpha = alpha < 0 ? 0 : alpha > 1 ? 1 : alpha;
  g.drawImage(a.c, i * a.size, 0, a.size, a.size, x, y, size, size);
}

/* ============================================================
   SOURCE — what gets ASCII-ified. Stands in for the photo/video.
   ============================================================ */

/* donut.c, shaded into a pixel buffer instead of a terminal.
   Rendered at half size and upscaled: 4x cheaper and it fills the
   sampling gaps for free. */
/* θ and φ are swept on a fixed grid that does not depend on the rotation, so their
   sines and cosines are the same every frame — and Math.pow on every surviving
   sample costs more than the projection that found it. Precomputing both takes the
   donut from 3.4ms a frame to 0.6ms, at a worst-case difference of 2/255 per pixel
   (the shade table's quantisation). Same step sizes, same geometry, same picture. */
const D_TH = 0.04, D_PH = 0.016;
const DNT = Math.ceil(TAU / D_TH), DNP = Math.ceil(TAU / D_PH);
const DCT = new Float64Array(DNT), DST = new Float64Array(DNT);
const DCP = new Float64Array(DNP), DSP = new Float64Array(DNP);
for (let i = 0; i < DNT; i++) { DCT[i] = Math.cos(i * D_TH); DST[i] = Math.sin(i * D_TH); }
for (let i = 0; i < DNP; i++) { DCP[i] = Math.cos(i * D_PH); DSP[i] = Math.sin(i * D_PH); }
const DSHADE = new Uint8Array(1024);          /* pow(L/√2, 0.7) -> 0..255 */
for (let i = 0; i < 1024; i++) DSHADE[i] = (Math.pow(i / 1023, 0.7) * 255) | 0;
const D_LSCALE = 1023 / Math.SQRT2;

let dbuf = null, dctx = null, DN = 0, dimg = null, dzb = null;
function drawDonut(box, A, B) {
  const n = Math.max(32, box >> 1);
  if (!dbuf || DN !== n) {
    DN = n; dbuf = mk(n,n); dctx = dbuf.getContext("2d");
    dimg = dctx.createImageData(n, n); dzb = new Float32Array(n * n);
  }
  /* reused across frames — a fresh ImageData + z-buffer every frame is a quarter
     of a megabyte of garbage per frame at full size */
  const img = dimg, d = img.data, zb = dzb;
  d.fill(0); zb.fill(0);
  const R1 = 1, R2 = 2, K2 = 5, K1 = n * K2 * 3 / (8 * (R1 + R2));
  const cA = Math.cos(A), sA = Math.sin(A), cB = Math.cos(B), sB = Math.sin(B);
  const half = n / 2;
  for (let ti = 0; ti < DNT; ti++) {
    const ct = DCT[ti], st = DST[ti];
    const cx = R2 + R1 * ct, cy = R1 * st;
    /* hoisted out of the inner loop: these vary with θ only */
    const cyCAsB = cy * cA * sB, cyCAcB = cy * cA * cB, cySA = cy * sA;
    const Lst = sA * st, LcBst = cB * cA * st, LctSA = cB * ct * sA;
    for (let pi = 0; pi < DNP; pi++) {
      const cp = DCP[pi], sp = DSP[pi];
      const x = cx * (cB * cp + sA * sB * sp) - cyCAsB;
      const y = cx * (sB * cp - sA * cB * sp) + cyCAcB;
      const ooz = 1 / (K2 + cA * cx * sp + cySA);
      const xp = (half + K1 * ooz * x) | 0;
      const yp = (half - K1 * ooz * y) | 0;
      if (xp < 0 || xp >= n || yp < 0 || yp >= n) continue;
      const L = cp * ct * sB - cA * ct * sp - Lst + LcBst - LctSA * sp;
      if (L <= 0) continue;
      const i = yp * n + xp;
      if (ooz > zb[i]) {
        zb[i] = ooz;
        const o = i * 4;
        d[o] = d[o+1] = d[o+2] = 255;
        const li = (L * D_LSCALE) | 0;
        d[o+3] = DSHADE[li > 1023 ? 1023 : li];
      }
    }
  }
  dctx.putImageData(img, 0, 0);
  return dbuf;
}

/* The fallback serif measures differently, so a frame drawn before the webfont
   lands and a frame drawn after are visibly different widths. Boot waits on this
   (with a timeout, so offline still starts) instead of letting it swap mid-run. */
let FONT_OK = false;
const FONT_READY = (async () => {
  try {
    await document.fonts.load('64px "Instrument Serif"');
    await document.fonts.ready;
    /* document.fonts.check() answers the wrong question: it returns true when the
       family is absent entirely, so offline it cheerfully claimed Instrument Serif
       and the piece laid itself out in Georgia. Measure instead — if the family is
       really there the width differs from the fallback's. */
    const width = (family) => {
      const c = mk(1, 1).getContext("2d");
      c.font = '64px ' + family;
      return c.measureText("addicted").width;
    };
    FONT_OK = width('"Instrument Serif", Georgia, serif') !== width('Georgia, serif');
  } catch (e) { /* offline: the serif fallback still reads right */ }
  grp = null;
})();

/* [donut] addicted, transparent background */
let grp = null, gpx = null, GW = 0, GH = 0, GPAD = 0;
const LOCK = { cx: 0.5, cy: 0.5, w: 1, h: 1 };
const linksEl = document.getElementById("links");
function buildGroup(t) {
  /* Landscape is height-bound and the width term only stops a short wide window
     running the lockup off the edge. Portrait is width-bound, and at 0.098 the
     wordmark came out at 48% of a phone's width with four fifths of the screen
     empty — so the width term opens up and the height term takes over the job of
     keeping it in proportion. */
  const fs  = PORTRAIT
    ? Math.round(Math.min(H * 0.085, W * 0.150))
    : Math.round(Math.min(H * 0.165, W * 0.098));
  const box = Math.round(fs * 1.45);
  const gap = Math.round(fs * 0.28);
  const font = fs + 'px ' + (FONT_OK ? '"Instrument Serif", ' : '') + 'Georgia, "Times New Roman", serif';
  tctx.save();
  tctx.font = font;
  if ("letterSpacing" in tctx) tctx.letterSpacing = (fs * 0.012).toFixed(2) + "px";
  const met = tctx.measureText(P.word);
  const tw = Math.ceil(met.width);
  const asc  = Math.ceil(met.actualBoundingBoxAscent  || fs * 0.75);
  const desc = Math.ceil(met.actualBoundingBoxDescent || fs * 0.25);
  tctx.restore();
  /* measureText's width excludes the stroke and the last glyph's right side
     bearing, so the final letter used to land within a pixel of the buffer edge —
     and the box was a flat multiple of the font size, so a word with a descender
     ("g", "addicted.") had its tail cut off. Size from the real ink box, pad it,
     then shift the lockup back so marginX still means the ink and not the padding. */
  const pad = Math.ceil(fs * 0.03) + 2;
  /* Sit the word on the donut's own centre line, not on the floor of the box. The
     donut is drawn centred in the group, so its middle is at gh/2; the baseline used
     to be pinned to the bottom margin instead, which put the word's ink centre about
     0.26 of the font size below it — with "addicted" carrying no descenders at all,
     that reads as the wordmark hanging low beside the mark. Clamped so the ink can
     never leave the padded box however the metrics come back. */
  const inkMid = gh => gh / 2 + (asc - desc) / 2;
  const gw = box + gap + tw + pad * 2;
  const gh = Math.max(box, Math.round(fs * 1.35), asc + desc + Math.round(fs * 0.10)) + pad * 2;
  GPAD = pad;
  if (!grp || GW !== gw || GH !== gh) { grp = mk(gw, gh); gpx = grp.getContext("2d"); GW = gw; GH = gh; }
  gpx.setTransform(1,0,0,1,0,0);
  gpx.globalAlpha = 1; gpx.globalCompositeOperation = "source-over"; gpx.filter = "none";
  gpx.clearRect(0, 0, gw, gh);

  const spin = (P.animSpeed.enabled ? P.animSpeed.intensity : 50) / 100;
  gpx.imageSmoothingEnabled = true;
  /* True donut.c tumble: both axes monotonic at donut.c's own 2:1 rate (A += 0.04,
     B += 0.02). Goes edge-on twice a cycle, same as the original.
     For a hole-forward nod instead: A = Math.PI / 2 + 0.9 * Math.sin(t * 0.55 * spin). */
  const A = 1.2 + t * 0.95 * spin;   /* phase offset: t=0 is dead edge-on in donut.c */
  gpx.drawImage(drawDonut(box, A, 0.6 + t * 0.48 * spin), pad, (gh - box) / 2, box, box);

  gpx.font = font;
  if ("letterSpacing" in gpx) gpx.letterSpacing = (fs * 0.012).toFixed(2) + "px";
  gpx.textBaseline = "alphabetic";
  gpx.fillStyle = "#fff";
  gpx.strokeStyle = "#fff";
  gpx.lineJoin = "round";
  gpx.lineWidth = fs * 0.016;
  const baseline = clamp(inkMid(gh), pad + asc, gh - pad - desc);
  gpx.fillText(P.word, pad + box + gap, baseline);
  gpx.strokeText(P.word, pad + box + gap, baseline);
  return grp;
}

/* flipped, faded copy for the floor */
let refl = null, rfx = null;
function reflection(g) {
  if (!refl || refl.width !== GW || refl.height !== GH) { refl = mk(GW, GH); rfx = refl.getContext("2d"); }
  rfx.setTransform(1,0,0,1,0,0);
  rfx.globalCompositeOperation = "source-over";
  rfx.clearRect(0, 0, GW, GH);
  rfx.save(); rfx.translate(0, GH); rfx.scale(1, -1); rfx.drawImage(g, 0, 0); rfx.restore();
  rfx.globalCompositeOperation = "destination-in";
  const gr = rfx.createLinearGradient(0, 0, 0, GH);
  gr.addColorStop(0,    "rgba(0,0,0,0.30)");
  gr.addColorStop(0.40, "rgba(0,0,0,0.08)");
  gr.addColorStop(1,    "rgba(0,0,0,0)");
  rfx.fillStyle = gr; rfx.fillRect(0, 0, GW, GH);
  rfx.globalCompositeOperation = "source-over";
  return refl;
}

/* Ground plane: the reflection with blur ramping by distance from the contact line.
   ponytail: 5 discrete bands, not a per-pixel gradient blur — but each band has to
   be a *clip* over the whole reflection, not a blurred slice. A blurred slice fades
   to nothing at its own top and bottom edge, which is a seam per band. Built here,
   square and on whole pixels, then drawn once through the tilt: clipping inside the
   rotation antialiases the band edges and seams them a second way. */
let refl2 = null, r2x = null, R2W = 0, R2H = 0;
function reflectionRamp(rc, w, h) {
  w = Math.max(1, Math.round(w)); h = Math.max(1, Math.round(h));
  if (!refl2 || R2W !== w || R2H !== h) { refl2 = mk(w, h); r2x = refl2.getContext("2d"); R2W = w; R2H = h; }
  r2x.setTransform(1,0,0,1,0,0);
  r2x.globalAlpha = 1; r2x.globalCompositeOperation = "source-over"; r2x.filter = "none";
  r2x.clearRect(0, 0, w, h);
  const bands = 5;
  for (let i = 0; i < bands; i++) {
    const y0 = Math.round(h * i / bands), y1 = Math.round(h * (i + 1) / bands);
    r2x.save();
    r2x.beginPath(); r2x.rect(0, y0, w, y1 - y0); r2x.clip();
    r2x.filter = "blur(" + (0.8 + i * 2.2).toFixed(1) + "px)";
    r2x.drawImage(rc, 0, 0, w, h);
    r2x.restore();
  }
  r2x.filter = "none";
  return refl2;
}

function drawSource(t) {
  const s = sctx;
  s.setTransform(1,0,0,1,0,0);
  s.globalAlpha = 1; s.globalCompositeOperation = "source-over"; s.filter = "none";
  s.fillStyle = "#000"; s.fillRect(0, 0, W, H);

  const g = buildGroup(t);
  const rc = reflection(g);
  const gapY = Math.round(GH * 0.01), rh = GH * 0.78;
  /* +GPAD/-GPAD: place the ink edges at the margins, not the padded buffer edges */
  if (PORTRAIT) {
    /* centred, and high enough that the reflection and the contact line below it
       land as one stack around the optical centre rather than on the floor */
    LOCK.cx = 0.5;
    LOCK.cy = 0.40;
  } else {
    LOCK.cx = (W * (1 - P.marginX) - GW / 2 + GPAD) / W;
    LOCK.cy = (H * (1 - P.marginY) - (GH / 2 + gapY + rh) + GPAD) / H;
  }
  LOCK.w = GW / W; LOCK.h = GH / H;
  /* where the reflection's tail lands, so the contact line can sit under it */
  LOCK.floor = (LOCK.cy * H + GH / 2 + gapY + rh) / H;
  /* Behind the door the piece is drawn in full — the donut still tumbles and the
     grid still costs exactly what it will cost afterwards, which is the only way
     auto-quality can settle on an honest resolution before anyone is looking — but
     held down near black. Entering raises it. It is the same frame throughout, so
     there is nothing to swap in and nothing to jump. */
  const mix = gateMix();
  s.save();
  s.globalAlpha = GATE_FLOOR + (1 - GATE_FLOOR) * mix;
  s.translate(LOCK.cx * W, LOCK.cy * H);
  s.rotate(P.tilt * Math.PI / 180);
  s.drawImage(g, -GW / 2, -GH / 2);

  const rw = GW * 1.03;   /* foreshortened */
  s.drawImage(reflectionRamp(rc, rw, rh), -rw / 2, GH / 2 + gapY, rw, rh);
  s.filter = "none";
  s.restore();

  if (mix > 0) {          /* outside the tilt: the contact line sits square */
    s.save(); s.globalAlpha = mix; drawLinks(s); s.restore();
  }
  if (mix < 1) drawGate(s, 1 - mix);
}

/* ---------- the door ----------
   Painted into the source like everything else, so it reaches the screen as hex
   glyphs through the same grid, colour chain and post-effects. The first thing you
   see is already the piece's own language rather than HTML sitting on top of it. */
/* Rendered once into its own canvas, then blitted.
   It used to lay the word out with fillText on every frame, which on Chromium is
   free and on Gecko is not: a gate frame cost 63ms where the same settings cost 46ms
   once the door was open. Auto-quality walks behind that door, so every measurement
   it took was of a frame ~17ms more expensive than the one the visitor ends up with,
   and it corrected for a cost that disappears the moment you click. Cache it and the
   two frames cost the same, which is the only way the walk's conclusions transfer. */
let gateArtC = null, gateArtKey = "";
function gateArt() {
  const hot = !!gateEl._hot;
  const key = W + "x" + H + "|" + P.cellSize + "|" + (hot ? 1 : 0);
  if (gateArtC && gateArtKey === key) return gateArtC;

  const face = 'px ui-monospace, "SF Mono", Menlo, Consolas, monospace';
  const m = mk(1, 1).getContext("2d");
  const set = (c, px, track) => {
    c.font = "700 " + px + face;
    if ("letterSpacing" in c) c.letterSpacing = (px * track).toFixed(2) + "px";
  };
  /* Big, because the grid is the constraint. At the size an HTML button would have
     used, the word came through the field at a third of the contact line's ink — a
     smudge in the middle of the screen. It has to own the viewport to survive being
     averaged into hex, and owning the viewport is what a door should do anyway. */
  let fs = Math.max(P.cellSize * LINK_MIN_CELLS, Math.round(Math.min(W * 0.115, H * 0.16)));
  set(m, fs, 0.12);
  const room = W * 0.86;
  const want = m.measureText("[ enter ]").width;
  if (want > room) { fs = Math.max(P.cellSize * LINK_MIN_CELLS, Math.floor(fs * room / want)); set(m, fs, 0.12); }
  const wide = m.measureText("[ enter ]").width;

  const glow = hot ? fs * 0.30 : 0;
  const pad = Math.ceil(glow * 2 + fs * 0.2);
  const cw = Math.ceil(wide) + pad * 2, ch = Math.ceil(fs * 1.6) + pad * 2;
  const c = mk(cw, ch), x = c.getContext("2d");
  set(x, fs, 0.12);
  x.textAlign = "center"; x.textBaseline = "middle";
  x.fillStyle = "#ffffff";
  x.shadowColor = hot ? "rgba(255,255,255,0.85)" : "transparent";
  x.shadowBlur = glow;
  /* the word alone. What it does to the volume is on the button's label, where a
     screen reader gets it and the field does not have to carry a second line */
  x.fillText("[ enter ]", cw / 2, ch / 2);

  gateArtC = { c, dx: Math.round(W / 2 - cw / 2), dy: Math.round(H / 2 - ch / 2) };
  gateArtKey = key;
  return gateArtC;
}
function drawGate(s, a) {
  const g = gateArt();
  s.save();
  s.globalAlpha = a;
  s.drawImage(g.c, g.dx, g.dy);
  s.restore();
}


/* ---------- contact line ----------
   Drawn into the source, so it reaches the screen through the same grid, colour
   chain, blur and post-effects as the wordmark — part of the piece rather than
   HTML sitting on top of it. The DOM keeps only invisible hit boxes, placed from
   this same layout, so clicking, tabbing and screen readers still work.
   Size is a PARAM: glyph cells are coarse, so this has to be far larger than the
   HTML text was to stay readable once the grid has had it. */
const LINK_HITS = [];
let hitKey = "";
/* Below this the grid has nothing left to work with: a letterform needs a run of
   cells to survive being averaged into hex digits, and eight is where "discord"
   stops reading and starts being texture. */
const LINK_MIN_CELLS = 8;
function drawLinks(s) {
  if (!copyEls.length) return;
  s.save();
  s.textBaseline = "alphabetic";
  const now = performance.now();
  const label = (el) => now - el._copied < 1000 ? "copied!" : el.dataset.label;

  const x0 = P.marginX * W;
  /* 700, not 400. A cell is six device pixels and a regular-weight stroke is barely
     one of them, so the average that picks the cell's glyph lands near black and the
     word arrives as a smudge — the point size was never what was wrong. Bold puts a
     whole cell's worth of ink under every stroke. Tracking comes down to 0.05em to
     buy back the width the heavier face costs, because the line is clamped by the
     room it has before the lockup starts. */
  const setFont = (px) => {
    s.font = '700 ' + px + 'px ui-monospace, "SF Mono", Menlo, Consolas, monospace';
    if ("letterSpacing" in s) s.letterSpacing = (px * 0.05).toFixed(2) + "px";
  };
  const wide = (t) => s.measureText(t).width;

  const inline = [{ t: "[ " }];
  copyEls.forEach((el, i) => {
    if (i) inline.push({ t: " | " });
    inline.push({ t: label(el), el });
  });
  inline.push({ t: " ]" });

  /* Width is linear in font size — the tracking scales with it too — so measure the
     two candidate layouts once at a reference size and divide, instead of guessing a
     size and re-measuring until it fits. */
  setFont(100);
  /* Each word occupies a slot as wide as the longest label it can ever show, so that
     swapping "mail" for "copied!" does not widen the row, re-centre it and slide every
     other token sideways. The word's own ink stays exactly where it was; the row is a
     few characters wider at rest, which also lines the brackets up when it stacks. */
  const slotOf = (el) => Math.max(wide(el.dataset.label), wide("copied!"));
  const perPxLine = inline.reduce((w, p) => w + (p.el ? slotOf(p.el) : wide(p.t)), 0) / 100;
  const perPxCol = Math.max(...copyEls.map(slotOf)) / 100;

  /* Landscape: the line shares the floor with the lockup and has to stop before it.
     Portrait: the lockup is above it and the whole width is its own. */
  const lineWant = Math.round(PORTRAIT ? Math.min(H * P.linkSize * 0.62, W * P.linkSize * 1.5)
                                       : Math.min(H * P.linkSize, W * P.linkSize * 0.6));
  const room = PORTRAIT
    ? Math.max(0, W - 2 * x0)
    : Math.max(0, (LOCK.cx - LOCK.w / 2) * W - x0 - lineWant * 0.8);
  const floorPx = P.cellSize * LINK_MIN_CELLS;
  const lineFs = Math.min(lineWant, Math.floor(room / perPxLine));

  /* Shrinking one line until it fits is what turned the words to mush on a phone —
     17px of type against a 6px cell is under three cells a glyph. A column needs
     only the width of the longest word, so when the line cannot stay legible the
     layout stacks instead of shrinking. */
  const stacked = lineFs < floorPx;
  let fs, rows;
  if (stacked) {
    rows = copyEls.map(el => [{ t: label(el), el }]);
    fs = Math.min(Math.round(H * P.linkSize),          /* the width cap is a one-line rule */
                  Math.floor(room / perPxCol),
                  Math.floor(H * 0.30 / (rows.length * 1.35)));   /* and the column still has to fit */
  } else {
    rows = [inline];
    fs = lineFs;
  }
  fs = Math.max(8, fs);
  setFont(fs);

  /* sit the ink on the floor line, not the baseline — the brackets hang below it
     and were being clipped by the bottom edge */
  const lead = fs * 1.35;
  /* Portrait hangs the line under the reflection rather than on the bottom margin,
     so the lockup and its contact words read as one centred group with the empty
     field around them, instead of two things sharing a floor. */
  const base = PORTRAIT
    ? Math.min(H * (1 - P.marginY) - fs * 0.14,
               LOCK.floor * H + fs * 1.5 + (rows.length - 1) * lead)
    : H * (1 - P.marginY) - fs * 0.14;
  LINK_HITS.length = 0;
  rows.forEach((row, r) => {
    const y = base - (rows.length - 1 - r) * lead;
    /* centred in portrait, against the left margin in landscape */
    const rowW = row.reduce((w, q) => w + (q.el ? slotOf(q.el) : wide(q.t)), 0);
    let x = PORTRAIT ? Math.round((W - rowW) / 2) : x0;
    for (const p of row) {
      const w = wide(p.t);                       /* the ink */
      const slot = p.el ? slotOf(p.el) : w;      /* the space it is allotted */
      /* Centred inside its slot, not flush left in it. The slot is as wide as the
         longest label the word can ever show, so a short one like "mail" left three
         characters of slack trailing it — which pushed the closing bracket out and
         made the whole row read as off-centre. Splitting the slack either side keeps
         the row a fixed width, so nothing moves when the label changes, and puts the
         ink where the eye expects it. */
      const ink = x + (slot - w) / 2;
      /* Hover lifts the word to white and adds a bloom the grid spreads into the
         surrounding cells — brightness alone is a weak signal once the field has
         quantised it. Base sits high because this corner is where the vignette bites
         hardest. */
      const hot = p.el && p.el._hot;
      s.fillStyle = p.el ? (hot ? "#ffffff" : "#f2f2f2") : "#6e6e6e";

/* ============================================================

const BLEND = {

/* animation modulates cell luminance, so the glyphs themselves
   scintillate instead of the whole layer just pulsing */
function animMod(cx, cy, t) {

  const sp  = (P.animSpeed.enabled ? P.animSpeed.intensity : 0) / 100 * 3;

/* ============================================================

const BAYER = [0,8,2,10, 12,4,14,6, 3,11,1,9, 15,7,13,5];

const rgba = (c, a) => "rgba(" + (c[0]|0) + "," + (c[1]|0) + "," + (c[2]|0) + "," + clamp(a,0,1) + ")";

/* Sub-cell detail for the modes that draw more than one value per cell.

/* Unicode braille dot numbering, by (column, row) of the 2x4 grid:

function drawCell(g, mode, x, y, s, L, c, cx, cy, t, la) {

/* ---------- sample the source grid, then draw every cell ---------- */

      const i = ry * cols + rx;
      let L = LUM[i];
      /* inverted, background is the densest part of the frame, so it has to go
         through the normal path rather than be speckled and skipped */
      if (!inv && L <= bgCut) {              /* background: slow twinkle or nothing */
        /* Each star keeps its own rate and phase and fades up and down across its
           own cycle. The old form gated on hash(rx, ry, (t*6)|0), so the entire
           field held perfectly still for 167ms and then jump-cut to an unrelated
           arrangement — measured 100% identical inside a tick and 3% shared across
           one. That reads as static dust that occasionally teleports, because that
           is what it was. Same density and same peak brightness as before. */
        const s = hash(rx, ry, 11);
        if (s < STAR_SHARE && !full) continue;          /* one cell in five is ever a star */
        const u = (at * (0.10 + s * 0.18) + hash(rx, ry, 12)) % 1;
        const k = u < STAR_DUTY ? Math.sin(u * (Math.PI / STAR_DUTY)) : 0;
        if (k < 0.03 && !full) continue;
        cell[0] = cell[1] = cell[2] = 255;
        const f = 0.018 + 0.031 * k;
        /* a full-field mode covers the background too, so hold it well under the
           lockup's own value or the image drowns in its own backdrop */
        drawCell(g, mode, rx*cs, ry*cs, cs, hash(rx, ry, 13) * (full ? 0.3 : 1), cell, rx, ry, at, f);
        continue;
      }
      if (ee > 0) {
        /* mean absolute neighbour difference (0..1), lifted toward white rather
           than added raw: the old sum-of-four could add 1.5 to a 0..1 luminance
           at ee=25 and 6 at ee=100, so the whole field clipped flat well before
           the top of the range. Same response as before at the default. */
        const e = (Math.abs(L - gridLum(rx+1,ry)) + Math.abs(L - gridLum(rx-1,ry))
                 + Math.abs(L - gridLum(rx,ry+1)) + Math.abs(L - gridLum(rx,ry-1))) * 0.25;
        L += (1 - L) * clamp(e * ee * 6, 0, 1);
      }
      /* multiplicative, so black stays black; the tiny additive term is the faint
         speckle of digits visible across the dark parts of the reference */
      const m = animMod(rx, ry, at);
      const h = hash(rx, ry, tk);
      const h4 = h * h * h * h;
      const floor = 0.012 * h4 * h4;
      let la = L * (1 + m * 0.3) + floor;   /* brightness: barely moves */
      L = L * (1 + m) + floor;              /* digit value: swings freely */
      if (inv) { L = 1 - L; la = 1 - la; }
      if (la < thr) continue;
      L = clamp(L, 0, 1); la = clamp(la, 0, 1);
      cell[0] = COL[i*3]; cell[1] = COL[i*3+1]; cell[2] = COL[i*3+2];
      if (cell[0] + cell[1] + cell[2] < 12) { cell[0] = cell[1] = cell[2] = 255; }
      drawCell(g, mode, rx*cs, ry*cs, cs, L, cell, rx, ry, at, la);
    }
  }
  if (cpuLayer) glyphBufEnd();
  g.globalAlpha = 1;
}

/* ============================================================
   BLUR — applied to the glyph layer on its way to the screen.
   All band-based; ctx.filter does the actual gaussian.
   ============================================================ */
/* Horizontal bands. Each band is a *clip* over a padded slice of the layer, never
   a blurred slice on its own: an isolated slice fades to nothing at its own top and
   bottom edge, so the old 8px strips both seamed and lost a third of their ink.
   16 bands instead of H/8 strips also drops a 2160px frame from 270 filter
   switches to 16. `radiusAt` takes 0..1 down the frame and returns blur px. */
function bandBlur(b, layer, radiusAt) {
  const bands = 16, bh = Math.ceil(H / bands);
  for (let i = 0; i < bands; i++) {
    const y = i * bh, h = Math.min(bh, H - y);
    if (h <= 0) break;
    const r = radiusAt((y + h / 2) / H);
    if (r <= 0.05) { b.filter = "none"; b.drawImage(layer, 0, y, W, h, 0, y, W, h); continue; }
    const pad = Math.ceil(r * 3) + 1;
    const sy = Math.max(0, y - pad), sh = Math.min(H, y + h + pad) - sy;
    b.save();
    b.beginPath(); b.rect(0, y, W, h); b.clip();
    b.filter = "blur(" + r.toFixed(1) + "px)";
    b.drawImage(layer, 0, sy, W, sh, 0, sy, W, sh);
    b.restore();
  }
  b.filter = "none";
}

function drawBlurred(dst, layer) {
  const type = P.blurType, amt = clamp(P.blurAmount, 0, 100) / 100 * 24;
  if (type === "off" || amt <= 0 || type === "gaussian") {
    dst.filter = (type === "gaussian" && amt > 0) ? "blur(" + amt.toFixed(1) + "px)" : "none";
    dst.drawImage(layer, 0, 0);
    dst.filter = "none";
    return;
  }
  /* Everything below paints overlapping pieces. Compose them on their own surface
     and hand `dst` a single image: drawing the pieces straight onto `dst` ran
     styleBlend once per piece, and double-composited every overlap. */
  const b = tctx;
  b.setTransform(1,0,0,1,0,0);
  b.globalAlpha = 1; b.filter = "none"; b.globalCompositeOperation = "source-over";
  b.clearRect(0, 0, W, H);

  if (type === "directional") {
    const a = P.blurAngle * Math.PI / 180, steps = 10;
    const from = P.directionalBothSides ? -steps : 0;
    const n = steps - from + 1;
    /* `lighter` at 1/n is the only one of these that actually averages: it sums
       premultiplied colour *and* alpha, so n copies at 1/n give the mean of both.
       Source-over cannot — where a shifted copy is transparent it leaves the
       destination untouched instead of pulling it toward zero, so the old constant
       1/n both weighted the last copy ~10x the first and tripled the total ink. */
    b.globalCompositeOperation = "lighter";
    b.globalAlpha = 1 / n;
    for (let i = from; i <= steps; i++) {
      b.drawImage(layer, Math.cos(a)*amt*i/steps, Math.sin(a)*amt*i/steps);
    }
    b.globalAlpha = 1;
    b.globalCompositeOperation = "source-over";
  } else if (type === "tilt") {
    const cy = P.tiltPosition / 100 * H;
    const focus = P.tiltFocus / 100 * H / 2;
    const feather = Math.max(1, P.tiltFeather / 100 * H / 2);
    bandBlur(b, layer, v => clamp((Math.abs(v * H - cy) - focus) / feather, 0, 1) * amt);
  } else if (type === "lens") {
    const cx = P.blurCenterX / 100 * W, cy = P.blurCenterY / 100 * H;
    const far = Math.hypot(W, H);                 /* reaches the corners from any centre */
    const maxR = far / 2;
    const focus = clamp(P.lensFocus / 100 * Math.max(W, H) / 2, 0, maxR);
    const rings = 5, span = Math.max(1, maxR - focus);
    /* Ring 0 is the focus disc and is sharp. The old loop drew the outermost band
       as a *full disc* at maximum blur and then ringed sharper bands on top of it,
       so the one region that never got overdrawn — the middle — was the blurriest
       part of the frame, and every ring composited twice. */
    for (let i = 0; i <= rings; i++) {
      const rIn  = i === 0 ? 0 : focus + span * (i - 1) / rings;
      const rOut = i === 0 ? focus : (i === rings ? far : focus + span * i / rings);
      if (rOut <= rIn) continue;
      const r = i / rings * amt;
      b.save();
      b.beginPath(); b.arc(cx, cy, Math.max(1, rOut), 0, TAU);
      if (rIn > 0) b.arc(cx, cy, rIn, 0, TAU, true);
      b.clip();
      b.filter = r > 0.05 ? "blur(" + r.toFixed(1) + "px)" : "none";
      b.drawImage(layer, 0, 0);
      b.restore();
    }
    b.filter = "none";
  } else if (type === "progressive") {
    const p = clamp(P.progressivePosition / 100, 0, 1);
    bandBlur(b, layer, v => clamp(P.progressiveReverse
      ? (p - v) / Math.max(0.05, p)              /* reverse ramps against p, not 1-p */
      : (v - p) / Math.max(0.05, 1 - p), 0, 1) * amt);
  } else {
    b.drawImage(layer, 0, 0);
  }
  b.filter = "none"; b.globalAlpha = 1;
  dst.filter = "none";
  dst.drawImage(tmp, 0, 0);
}

/* ---------- lights ---------- */
function lightsPass() {
  if (!P.lights.enabled) return;
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  const fl = P.lights.followLockup;
  for (const pt of P.lights.points) {
    const x = fl ? (LOCK.cx + (pt.x || 0) * LOCK.w) * W : (pt.x || 0) * W;
    const y = fl ? (LOCK.cy + (pt.y || 0) * LOCK.h) * H : (pt.y || 0) * H;
    const r = Math.max(1, (pt.radius || 0.2) * (fl ? LOCK.w * W : Math.max(W, H)));
    const a = clamp((pt.intensity == null ? 50 : pt.intensity) / 100, 0, 1);
    const gr = ctx.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, "rgba(255,255,255," + (a * 0.6) + ")");
    gr.addColorStop(1, "rgba(255,255,255,0)");
    ctx.fillStyle = gr; ctx.fillRect(x - r, y - r, r * 2, r * 2);
  }
  ctx.restore();
}

/* ---------- mask: reveal back to the plain source ---------- */
let maskImg = null, maskUrl = null;
function maskPass() {
  const m = P.mask;
  if (!m.enabled || !m.dataUrl) return;
  if (maskUrl !== m.dataUrl) { maskUrl = m.dataUrl; maskImg = new Image(); maskImg.src = m.dataUrl; return; }
  if (!maskImg || !maskImg.complete || !maskImg.naturalWidth) return;
  /* ctx is alpha:false, so destination-out on it paints black instead of punching
     a hole and destination-over then has nothing to show through. Cut the reveal
     out of the plain source on a surface that has an alpha channel, then lay it on. */
  tctx.setTransform(1,0,0,1,0,0);
  tctx.globalAlpha = 1; tctx.filter = "none";
  tctx.globalCompositeOperation = "copy";
  tctx.drawImage(src, 0, 0);
  tctx.globalCompositeOperation = m.invert ? "destination-out" : "destination-in";
  tctx.drawImage(maskImg, 0, 0, W, H);
  tctx.globalCompositeOperation = "source-over";
  ctx.drawImage(tmp, 0, 0);
}

/* ============================================================
   POST-EFFECTS — applied in pfx key order, gated on enabled
   ============================================================ */
let grainTile = null, grainPat = null;
let vigGrad = null, vigKey = "";
let hgrid = null, hgx = null;   /* halftone's sampling grid, sized to the dot pitch */
function noiseTile() {
  if (grainTile) return grainTile;
  const n = 256, c = mk(n, n), x = c.getContext("2d");
  const img = x.createImageData(n, n), d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const v = (Math.random() * 255) | 0;
    d[i] = d[i+1] = d[i+2] = v; d[i+3] = 255;
  }
  x.putImageData(img, 0, 0);
  return (grainTile = c);
}
/* Red pulled left, blue pulled right. Measured at ~14ms/frame on a 0.9MP canvas as
   a getImageData + JS loop + putImageData — more than the whole rest of the frame,
   and it scales with the backing store, so at the pixel budget it was ~40ms. Same
   result to the bit from four composited draws instead: shift a copy, mask it to
   one channel with multiply, sum the three with lighter. `cv` doubles as the
   per-channel scratch so this costs one extra surface, allocated on first use. */
let chAcc = null, chAccX = null;
function shiftChannels(dx) {
  const k = Math.round(dx);
  if (!k) return;
  if (!chAcc || chAcc.width !== W || chAcc.height !== H) {
    chAcc = mk(W, H); chAccX = chAcc.getContext("2d");
  }
  tctx.setTransform(1,0,0,1,0,0); tctx.globalAlpha = 1; tctx.filter = "none";
  tctx.globalCompositeOperation = "copy"; tctx.drawImage(cv, 0, 0);
  chAccX.setTransform(1,0,0,1,0,0); chAccX.globalAlpha = 1; chAccX.filter = "none";
  chAccX.globalCompositeOperation = "copy";
  chAccX.fillStyle = "#000"; chAccX.fillRect(0, 0, W, H);
  const CH = [["#f00", k], ["#0f0", 0], ["#00f", -k]];
  for (let i = 0; i < 3; i++) {
    ctx.globalCompositeOperation = "copy";     ctx.drawImage(tmp, CH[i][1], 0);
    ctx.globalCompositeOperation = "multiply"; ctx.fillStyle = CH[i][0]; ctx.fillRect(0, 0, W, H);
    chAccX.globalCompositeOperation = "lighter"; chAccX.drawImage(cv, 0, 0);
  }
  ctx.globalCompositeOperation = "copy"; ctx.drawImage(chAcc, 0, 0);
  ctx.globalCompositeOperation = "source-over";
  tctx.globalCompositeOperation = "source-over";
}

/* Every geometric post-effect sizes itself in CSS pixels. In device pixels the
   same numbers give half-height scan lines and a quarter of the halftone dot on a
   HiDPI screen, and the effect quietly disappears as the backing store grows. */
const PFX = {
  scanLines(I) {
    const step = Math.max(2, Math.round(3 * DPX));
    ctx.save(); ctx.fillStyle = "rgba(0,0,0," + (0.42 * I) + ")";
    for (let y = 0; y < H; y += step) ctx.fillRect(0, y, W, step / 2);
    ctx.restore();
  },
  vignette(I) {
    /* the gradient only depends on the canvas size and the intensity — rebuilding
       it every frame is pure allocation */
    if (!vigGrad || vigKey !== W + "x" + H + "|" + I) {
      vigGrad = ctx.createRadialGradient(W/2, H/2, Math.min(W,H) * 0.22, W/2, H/2, Math.hypot(W,H) * 0.62);
      vigGrad.addColorStop(0, "rgba(0,0,0,0)");
      vigGrad.addColorStop(0.6, "rgba(0,0,0," + (0.35 * I) + ")");
      vigGrad.addColorStop(1, "rgba(0,0,0," + Math.min(1, 1.15 * I) + ")");
      vigKey = W + "x" + H + "|" + I;
    }
    ctx.save(); ctx.fillStyle = vigGrad; ctx.fillRect(0, 0, W, H); ctx.restore();
  },
  bloom(I) {
    const bw = bloomC.width, bh = bloomC.height;
    bctx.setTransform(1,0,0,1,0,0);
    bctx.globalAlpha = 1;
    bctx.globalCompositeOperation = "copy";
    bctx.filter = "none";
    bctx.drawImage(cv, 0, 0, bw, bh);
    /* square the frame first: bloom is what highlights do, and adding a blurred
       copy of *everything* at intensity 100 was a flat white wash, not a glow */
    bctx.globalCompositeOperation = "multiply";
    bctx.drawImage(bloomC, 0, 0);
    bctx.globalCompositeOperation = "source-over";
    bctx.filter = "blur(" + (1.5 + 5 * I).toFixed(1) + "px)";
    bctx.drawImage(bloomC, 0, 0);
    bctx.filter = "none";
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    ctx.globalAlpha = clamp(2.4 * I, 0, 1);
    ctx.drawImage(bloomC, 0, 0, W, H);
    ctx.restore();
  },
  chromatic(I) { shiftChannels((1 + I * 7) * DPX); },
  filmGrain(I) {
    /* One tiled fill, not one drawImage per tile. At 1912x948 that was 45 separate
       overlay-blended draws costing 2.0ms a frame — the single dearest thing in the
       pipeline. A repeating pattern is the same picture in one pass: 95.6 -> 111.7fps.
       The blend stays `overlay`; that part is only ~0.5ms and it is the look. */
    if (!grainPat) grainPat = ctx.createPattern(noiseTile(), "repeat");
    ctx.save();
    ctx.globalCompositeOperation = "overlay";
    ctx.globalAlpha = 0.35 * I;
    grainPat.setTransform(new DOMMatrix().translate(-((Math.random() * 256) | 0), -((Math.random() * 256) | 0)));
    ctx.fillStyle = grainPat;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  },
  glitch(I) {
    const slices = Math.round(2 + I * 12);
    tctx.setTransform(1,0,0,1,0,0); tctx.globalAlpha = 1; tctx.filter = "none";
    tctx.globalCompositeOperation = "copy"; tctx.drawImage(cv, 0, 0);
    tctx.globalCompositeOperation = "source-over";
    for (let i = 0; i < slices; i++) {
      const y = (Math.random() * H) | 0;
      const h = 2 + ((Math.random() * 24 * I * DPX) | 0);
      const dx = ((Math.random() - 0.5) * 90 * I * DPX) | 0;
      ctx.clearRect(0, y, W, h);
      ctx.drawImage(tmp, 0, y, W, h, dx, y, W, h);
    }
    if (I > 0.3) shiftChannels(I * 5 * DPX);
  },
  halftone(I) {
    /* one dot per grid cell, so read the frame at grid resolution instead of
       pulling back the whole canvas — the full-frame getImageData was ~12ms/frame
       at 0.9MP and every pixel of it was thrown away but one in `step` squared */
    const step = Math.max(3, Math.round((4 + I * 8) * DPX));
    const gw = Math.max(1, Math.ceil(W / step)), gh = Math.max(1, Math.ceil(H / step));
    if (!hgrid || hgrid.width !== gw || hgrid.height !== gh) {
      hgrid = mk(gw, gh); hgx = hgrid.getContext("2d", { willReadFrequently: true });
    }
    hgx.globalAlpha = 1; hgx.filter = "none"; hgx.globalCompositeOperation = "copy";
    hgx.imageSmoothingEnabled = true; hgx.imageSmoothingQuality = "high";
    hgx.drawImage(cv, 0, 0, gw, gh);
    const img = hgx.getImageData(0, 0, gw, gh).data;
    tctx.setTransform(1,0,0,1,0,0); tctx.globalAlpha = 1; tctx.filter = "none";
    tctx.globalCompositeOperation = "source-over";
    tctx.fillStyle = "#000"; tctx.fillRect(0, 0, W, H);
    tctx.fillStyle = "#fff";
    for (let gy = 0; gy < gh; gy++) {
      for (let gx = 0; gx < gw; gx++) {
        const o = (gy * gw + gx) * 4;
        const l = (0.2126*img[o] + 0.7152*img[o+1] + 0.0722*img[o+2]) / 255;
        if (l < 0.01) continue;
        tctx.beginPath();
        tctx.arc(gx*step + step/2, gy*step + step/2, Math.sqrt(l) * step * 0.62, 0, TAU);
        tctx.fill();
      }
    }
    ctx.save(); ctx.globalAlpha = I; ctx.drawImage(tmp, 0, 0); ctx.restore();
  },
  pixelate(I) {
    const f = Math.max(2, Math.round((2 + I * 18) * DPX));
    const w = Math.max(1, (W / f) | 0), h = Math.max(1, (H / f) | 0);
    tctx.setTransform(1,0,0,1,0,0); tctx.globalAlpha = 1; tctx.filter = "none";
    tctx.globalCompositeOperation = "copy";
    tctx.imageSmoothingEnabled = true;
    tctx.drawImage(cv, 0, 0, w, h);
    tctx.globalCompositeOperation = "source-over";
    ctx.save();
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(tmp, 0, 0, w, h, 0, 0, W, H);
    ctx.restore();
  },
  filmDust(I) {
    const n = Math.round(I * 90);
    ctx.save();
    for (let i = 0; i < n; i++) {
      const x = Math.random() * W, y = Math.random() * H;
      ctx.fillStyle = Math.random() > 0.35 ? "rgba(255,255,255,0.55)" : "rgba(0,0,0,0.55)";
      if (Math.random() > 0.82) ctx.fillRect(x, y, DPX, (4 + Math.random() * 22) * DPX);
      else ctx.fillRect(x, y, (1 + Math.random() * 2) * DPX, (1 + Math.random() * 2) * DPX);
    }
    ctx.restore();
  }
};
/* Lens effects before the frame effects before the film effects. bloom used to run
   after vignette, i.e. it sampled and re-lit corners the vignette had just crushed;
   it only got away with it because a blurred black corner is still black. */
const PFX_ORDER = ["bloom","chromatic","glitch","pixelate","halftone","scanLines","vignette","filmGrain","filmDust"];
function postfx() {
  for (const k of PFX_ORDER) {
    const cfg = P.pfx[k];
    if (!cfg || !cfg.enabled) continue;
    const I = clamp((cfg.intensity == null ? 50 : cfg.intensity) / 100, 0, 1);
    if (I <= 0) continue;
    ctx.setTransform(1,0,0,1,0,0);
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over"; ctx.filter = "none";
    PFX[k](I);
