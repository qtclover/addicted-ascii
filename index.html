}

/* ============================================================
   COMPOSE + LOOP
   ============================================================ */
function compose() {
  ctx.setTransform(1,0,0,1,0,0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over"; ctx.filter = "none";
  /* ponytail: laying the background down with "copy" to skip this fill was measured
     and bought nothing — a full-canvas fill on an opaque canvas is a fast clear. */
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);

  const bo = clamp(P.bgOpacity / 100, 0, 1);
  if (P.bgMode === "solid")      { ctx.globalAlpha = bo; ctx.fillStyle = "#060607"; ctx.fillRect(0, 0, W, H); }
  else if (P.bgMode === "photo") { ctx.globalAlpha = bo; ctx.drawImage(src, 0, 0); }
  else if (P.bgMode === "blur")  {
    /* quarter-res: a 40px gaussian over a full 2MP canvas costs ~10x the whole frame */
    const bw = bloomC.width, bh = bloomC.height;
    bctx.setTransform(1,0,0,1,0,0);
    bctx.globalAlpha = 1; bctx.globalCompositeOperation = "copy"; bctx.filter = "none";
    bctx.drawImage(src, 0, 0, bw, bh);
    bctx.globalCompositeOperation = "source-over";
    bctx.filter = "blur(" + (P.bgBlur / 4).toFixed(1) + "px)";
    bctx.drawImage(bloomC, 0, 0);
    bctx.filter = "none";
    ctx.globalAlpha = bo; ctx.drawImage(bloomC, 0, 0, W, H);
  }
  ctx.globalAlpha = 1;

  ctx.globalCompositeOperation = P.styleBlend || "source-over";
  drawBlurred(ctx, glyph);
  ctx.globalCompositeOperation = "source-over";

  lightsPass();
  maskPass();
  postfx();
}

function frame(t) {
  drawSource(t);
  renderCells(t);
  compose();
}

let t0 = performance.now(), acc = 0, accCpu = 0, fcount = 0;

/* ---------- auto quality ----------
   Cell count scales with the backing store, so the same page is trivial on a
   small window and brutal on a big HiDPI one. Measure the real frame cost and
   walk the render scale until it fits, with a dead band so it cannot oscillate. */
/* Clamp an outlier, never reject it. Rejecting samples over 100ms meant that a
   window heavy enough to push frames past 100ms could never trigger a cut at all —
   auto-quality froze with sinceAdjust stuck at 4 while the page ran at 12fps, which
   is precisely the case it exists for. Resume and resize already reset lastFrameAt,
   and a hidden tab is paused outright, so the only thing left to guard against is a
   stray GC or OS hiccup, and clamping handles that without going deaf. */
const QUALITY_SAMPLE_CAP = 400;
const qualitySample = (dt) => dt > QUALITY_SAMPLE_CAP ? QUALITY_SAMPLE_CAP : dt;

/* Not an exponential average. An EMA restarted after a change is seeded on the very
   frames that change made expensive, and 15 frames later it is still carrying them:
   "effects off" measured 33.8ms on Gecko where the steady state was 22.1ms, and the
   next rung was then judged against that inflated figure and wrongly kept. Discard
   the rebuild outright, then take a flat mean of the frames that follow. */
let measured = 0, sampleSum = 0, sampleN = 0;
/* Adapting is a phase, not a standing behaviour.
   Every scale change re-tiles the entire glyph mosaic: cols and rows change, every
   cell lands somewhere new, and the whole piece jumps. So the walk to this machine's
   resolution happens while the door is shut and the field is held near black, it
   runs to convergence rather than stopping after one step, and then it is over —
   what you enter on is what you keep. The previous version resolved SETTLED on its
   *first* pass, which let the door open with the walk still in progress: one second
   in, the next correction landed in full view. That was the jump.
   A resize re-tiles everything by itself, so it opens the phase again. */
let adapting = true, adjusts = 0;
/* A re-tile reallocates six canvases and throws away the glyph atlas, and the frames
   that follow pay to rebuild both. Averaging them in made every correction look like
   it had made things worse — 46.9ms became "68.3ms" purely because the grid had just
   changed — so the walk kept escalating on the cost of its own escalation, and ran
   past a perfectly good state into the worst one available. Throw the rebuild away
   and start measuring once the frame is the steady state again. */
let warmFrames = 0;
/* Thrown away, and there have to be a lot of them. A realloc and an atlas rebuild are
   the obvious cost, but the expensive one is the engine itself: the cell loop is a
   large function and Gecko tiers it up over thousands of iterations, so the frames
   right after load are slow for a reason that has nothing to do with the settings.
   Measured: the first decision saw 132ms/frame while the steady state was 50, and
   judged cell 4 with the effects off at 33.3ms where it really runs at 22.1. Every
   rung was then priced against a number that was still falling. Thirty frames of
   silence costs a second of the walk and buys a measurement that means something. */
const WARM_FRAMES = 30;
const SAMPLE_FRAMES = 20;
let prevMeasured = 0, badFrames = 0;
/* A frame at twice the target is not a close call. Gathering 100 frames of careful
   evidence before dropping the effects meant four and a half seconds of 16fps on the
   gate — the visitor sitting through the worst version of the piece while the walk
   proves something already obvious. The effects rung re-tiles nothing and is the
   cheapest thing here to be wrong about, so it gets a fast path: a short run of
   plainly bad frames is enough. Everything below it still waits for a real number. */
const BAD_FRAME_RUN = 12;
function restartMeasure() { warmFrames = WARM_FRAMES; sampleSum = 0; sampleN = 0; prevMeasured = 0; badFrames = 0; lastFrameAt = 0; }

/* The first thing given up, because it is the only one that costs no geometry.
   Measured on Gecko at 1.72Mpx: the post-effects and the blurred backdrop are 18.6ms
   of a 58ms frame — dropping them took a full-resolution frame from 17fps to 45fps
   with every pixel and every cell still there. Chromium renders the lot inside its
   budget and never reaches this rung, so it keeps the glow. */
/* A rung is only worth taking if it pays. Coarsening the grid on Gecko moved a frame
   from 28.6ms to 29.8ms — inside the noise, and in the wrong direction — and the walk
   took it anyway because the target was still out of reach, then took it again. That
   is how a browser ends up coarse and blurry having gained nothing. So every step is
   provisional: measure after it, and if it did not pay, put it back and never try
   that rung again. An unreachable target then costs one wasted step per rung instead
   of everything the piece has. */
let undoStep = null, emaBeforeStep = 0;
const rungBlocked = { fx: false, cell: false, scale: false };
/* What each rung has to pay to be kept, priced by what it costs the picture rather
   than by a single number for all of them. Atmosphere is cheap to lose, so a modest
   saving justifies it. Halving the grid throws away three quarters of the cells and
   halving the store softens every pixel — measured on Gecko, coarsening the grid
   from 4 to 8 buys 6.5% (46.0ms to 43.0ms) for four times fewer cells, which is a
   terrible trade at any framerate. A flat 8% bar could not say that, and kept it. */
const RUNG_MIN_GAIN = { fx: 0.08, cell: 0.25, scale: 0.25 };

const FX_KEYS = Object.keys(P.pfx);
let fxStep = 0, fxSaved = null;
/* The door does not pay for what it does not show. Behind it the field sits at a
   tenth of its brightness, where a vignette, a bloom and a film grain are all but
   invisible — and on Gecko they were the difference between 16fps and 40fps for the
   whole time the visitor sat there. So they do not run until the piece is lit.
   Whether they run then is decided from what the gate already measured: a machine
   rendering the bare frame in well under the target can afford them, one already at
   the target cannot, and no probe has to be run on screen to find out. If that guess
   is wrong the effects rung corrects it either way within a second. */
let fxDeferred = true;
function setEmbellishment(on) {
  if (!on) {
    if (!fxSaved) {
      fxSaved = { pfx: {}, bgMode: P.bgMode, bgOpacity: P.bgOpacity };
      for (const k of FX_KEYS) fxSaved.pfx[k] = P.pfx[k].enabled;
    }
    for (const k of FX_KEYS) P.pfx[k].enabled = false;
    P.bgMode = "solid"; P.bgOpacity = 0;
  } else if (fxSaved) {
    for (const k of FX_KEYS) P.pfx[k].enabled = fxSaved.pfx[k];
    P.bgMode = fxSaved.bgMode; P.bgOpacity = fxSaved.bgOpacity;
    fxSaved = null;
  }
}
/* Two knobs, deliberately ordered. Fewer cells at native resolution loses detail;
   fewer pixels loses focus, because everything is then stretched back up. Detail is
   the cheaper loss for a glyph field, so the grid coarsens first and the backing
   store is only sacrificed once the coarsest grid still cannot hold floorMs. */
const CELL_LADDER = [P.cellSize, Math.round(P.cellSize * 1.5), P.cellSize * 2];
let cellStep = 0;
/* On a slow engine there is no setting that is both sharp and smooth, so this is a
   preference, not a bug to solve. ?q=sharp keeps every pixel native at whatever
   framerate that costs; ?q=smooth buys 60fps with resolution, which the browser then
   stretches back up; the default coarsens the grid first and only shrinks the store
   if even the coarsest grid is past floorMs. */
const QMODE = Q.get("q") || "";
if (QMODE === "sharp")  P.autoQuality = false;            /* never give anything up */
if (QMODE === "smooth") { P.floorMs = P.targetMs; CELL_LADDER.length = 1; }
/* &fx=off drops every full-canvas embellishment: the post-effects and the blurred
   backdrop. Measured on Gecko at 1.72Mpx that is 14.4ms + 4.2ms of a 64ms frame —
   a fifth of the cost, for the haze and the glow. Whether that trade is worth it is
   a question about the picture, not the code. */
setEmbellishment(false);                       /* the door renders bare; see fxDeferred */
if (Q.get("fx") === "off") { fxDeferred = false; fxStep = 1; }
const MAX_ADJUSTS = 6;        /* still moving after this is hunting, not converging */
/* resolves when auto-quality has finished walking, so the door can wait for it */
let settleDone = () => {};
const SETTLED = new Promise(r => { settleDone = r; });
function autoQuality(dt) {
  if (!P.autoQuality || !adapting) { settleDone(); return; }
  if (fxStep === 0 && !fxDeferred && !rungBlocked.fx && dt > P.targetMs * 2) {
    if (++badFrames >= BAD_FRAME_RUN) {
      badFrames = 0;
      emaBeforeStep = dt;                        /* the verdict still gets measured properly */
      undoStep = { rung: "fx", undo: () => {
        fxStep = 0; setEmbellishment(true);
        retileWhy = "effects back, they were not the cost"; noteRetile();
      } };
      fxStep = 1; setEmbellishment(false);
      retileWhy = "effects off, frames at " + dt.toFixed(0) + "ms"; noteRetile();
      restartMeasure();
      return;
    }
  } else badFrames = 0;
  if (warmFrames > 0) { warmFrames--; return; }   /* still paying for the last change */
  sampleSum += dt; sampleN++;
  if (sampleN < SAMPLE_FRAMES) return;
  measured = sampleSum / sampleN;
  sampleSum = 0; sampleN = 0;

  /* Is this number finished falling? Nothing here is worth deciding on while the
     engine is still speeding up: two measurements of one unchanged state read 31.9ms
     and then 28.7ms on Gecko purely because time had passed, and a step taken between
     them scores that drift as its own success. Wait for two readings of the same
     state to agree, and the baseline stops moving under the comparison. */
  if (!prevMeasured || measured < prevMeasured * 0.92) { prevMeasured = measured; return; }
  prevMeasured = measured;

  /* the verdict on the last rung, before considering another one */
  if (undoStep) {
    const u = undoStep;
    undoStep = null;
    if (measured > emaBeforeStep * (1 - RUNG_MIN_GAIN[u.rung])) {   /* did not earn its cost */
      rungBlocked[u.rung] = true;
      u.undo();
      restartMeasure();
      return;
    }
  }
  const floor = P.minScale || 0.5;
  /* Cost tracks the pixel count, which goes as the scale squared, so the correction
     that lands on the budget is the square root of the overshoot — one step, not a
     walk. Capped so a single bad sample cannot lurch the resolution. */
  /* Over budget, cheapest loss first: atmosphere, then detail, then focus. */
  if (measured > P.targetMs && fxStep === 0 && !fxDeferred && !rungBlocked.fx) {
    emaBeforeStep = measured;
    undoStep = { rung: "fx", undo: () => {
      fxStep = 0; setEmbellishment(true);
      retileWhy = "effects back, they were not the cost"; noteRetile();
    } };
    fxStep = 1; setEmbellishment(false);
    retileWhy = "effects off " + measured.toFixed(1) + "ms"; noteRetile();
    restartMeasure();
    return;
  }
  /* Geometry is not spent to hit a target, only to rescue a frame that is genuinely
     unusable. targetMs is a preference — 26ms is 38fps, and this piece is a slow
     shimmer that reads fine below that — whereas the grid and the backing store are
     the picture itself. Gating them on floorMs instead of targetMs also ends a long
     argument with measurement error: after the effects came off, the walk read 30.8ms
     where the steady state was 25.0, and 23% of warm-up drift was enough to make a
     6.5% grid saving look like it had cleared a 25% bar. Drift would have to turn 25
     into 46 to fool this, which it cannot. */
  const geometryOk = measured > (P.floorMs || P.targetMs);
  if (measured > P.targetMs && geometryOk && cellStep < CELL_LADDER.length - 1 && !rungBlocked.cell) {
    emaBeforeStep = measured;
    const prevCell = cellStep;
    undoStep = { rung: "cell", undo: () => {
      cellStep = prevCell; P.cellSize = CELL_LADDER[cellStep];
      retileWhy = "grid back, detail was not the cost"; resize();
    } };
    cellStep++; P.cellSize = CELL_LADDER[cellStep];
    retileWhy = "coarser grid " + measured.toFixed(1) + "ms";
    resize();
    return;
  }
  /* comfortably under it: hand it back in the reverse order it was taken */
  if (measured < P.targetMs * 0.55 && renderScale >= 1 && cellStep > 0) {
    cellStep--; P.cellSize = CELL_LADDER[cellStep];
    retileWhy = "finer grid " + measured.toFixed(1) + "ms";
    resize();
    return;
  }
  if (measured < P.targetMs * 0.55 && renderScale >= 1 && cellStep === 0 && fxStep > 0 && !fxDeferred) {
    fxStep = 0; setEmbellishment(true);
    retileWhy = "effects back " + measured.toFixed(1) + "ms"; noteRetile();
    restartMeasure();
    return;
  }
  let next = renderScale;
  /* Only now, and only if the coarsest grid is still past what this piece will
     tolerate. floorMs is the line: above it, blur is the lesser evil. */
  if (measured > (P.floorMs || P.targetMs) && geometryOk && renderScale > floor && !rungBlocked.scale) {
    next = Math.max(floor, renderScale * Math.max(0.6, Math.sqrt(P.targetMs / measured)));
  } else if (measured < P.targetMs * 0.55 && renderScale < 1) {
    next = Math.min(1, renderScale * Math.min(1.6, Math.sqrt(P.targetMs * 0.8 / measured)));
  }
  next = quantScale(next);
  if (Math.abs(next - renderScale) < 0.02 || ++adjusts >= MAX_ADJUSTS) {
    /* A step still under test must not be frozen in by a click that lands mid-experiment:
     put it back, then stop. */
  if (undoStep) { const u = undoStep; undoStep = null; u.undo(); }
  adapting = false; settleDone(); return;          /* converged: leave it alone */
  }
  emaBeforeStep = measured;
  const prevScale = renderScale;
  undoStep = { rung: "scale", undo: () => {
    renderScale = prevScale; retileWhy = "resolution back, pixels were not the cost"; resize();
  } };
  renderScale = next;
  retileWhy = "autoQuality " + measured.toFixed(1) + "ms";
  resize();                                          /* restarts the measurement */
}

/* ---------- idle shutdown ----------
   Hidden or unfocused: the loop stops rescheduling, so nothing runs at all —
   no donut, no sampling, no draws. t0 absorbs the paused span so the tumble
   picks up where it left off instead of jumping. */
let paused = false, pausedAt = 0;
/* Embedded in a frame, the page almost never holds focus even while it is plainly
   visible — the parent document has it — so treating blur as idle would draw one
   frame, dim, and sit there. Blur only counts when we are the top-level document;
   `hidden` still does, at any depth. */
const embedded = (() => { try { return window.top !== window.self; } catch (e) { return true; } })();
const idle = () => document.hidden || (!embedded && !document.hasFocus());
function dimPaused() {
  ctx.setTransform(1,0,0,1,0,0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over"; ctx.filter = "none";
  ctx.fillStyle = "rgba(0,0,0,0.62)";            /* one draw, then silence */
  ctx.fillRect(0, 0, W, H);
}
function setPaused(p) {
  if (!P.pauseWhenIdle || p === paused) return;
  paused = p;
  if (p) {
    pausedAt = performance.now();
    dimPaused();
  } else {
    t0 += performance.now() - pausedAt;
    lastFrameAt = 0;
    requestAnimationFrame(loop);
  }
}
/* all three ask idle() rather than deciding for themselves, so the embedded case
   is answered in exactly one place */
document.addEventListener("visibilitychange", () => setPaused(idle()));
addEventListener("blur",  () => setPaused(idle()));
addEventListener("focus", () => setPaused(idle()));

/* Carrying the deadline forward rather than setting it from `now` keeps the average
   exactly on target on a display whose refresh interval is not a multiple of it: at
   144Hz this alternates 21ms and 14ms gaps and lands on 60 a second, where
   `now + minMs` would settle at 48. */
const nextFrameTime = (now, prev, minMs) => Math.max(now + 1, prev + minMs);

let lastFrameAt = 0, nextFrameAt = 0;
function loop(now) {
  if (paused) return;
  /* Past the gate, hold to maxFps. Behind it the cap is off — auto-quality is still
     measuring what a frame really costs — and the deadline is pinned to `now`, or it
     would run away at 144Hz and stall the first seconds after you entered. */
  if (entered) {
    if (now < nextFrameAt) { requestAnimationFrame(loop); return; }
    nextFrameAt = nextFrameTime(now, nextFrameAt, 1000 / Math.max(1, P.maxFps || 60));
  } else nextFrameAt = now;
  const t = (now - t0) / 1000;
  const a = performance.now();
  frame(t);
  const cpuMs = performance.now() - a;
  /* Regulate on the interval between frames, not on how long frame() held the main
     thread. Most of a frame is GPU work the script clock cannot see — measured 9.1ms
     of wall clock against 4.4ms of script — so tuning against the script time alone
     made targetMs mean nothing at all and left auto-quality inert. */
  const dt = lastFrameAt ? now - lastFrameAt : cpuMs;
  lastFrameAt = now;
  autoQuality(qualitySample(dt));
  if (SHOW_FPS || SHOW_DIAG) {
    acc += dt; accCpu += cpuMs;
    if (++fcount >= 20) {
      const ms = acc / fcount;
      const line = ms.toFixed(1) + " ms/frame  " + (1000 / ms).toFixed(0) + " fps  " +
                   (accCpu / fcount).toFixed(1) + " ms script  " +
                   cols + "x" + rows + " cells  scale " + renderScale.toFixed(2);
      hud.textContent = SHOW_DIAG
        ? line + "  dpr " + (devicePixelRatio || 1) + "  adapting " + adapting +
          "\n\nre-tiles (each one is a visible jump):\n" + RETILES.join("\n")
        : line;
      acc = 0; accCpu = 0; fcount = 0;
    }
  }
  requestAnimationFrame(loop);
}

/* ============================================================
   SELF-TEST — ?selftest
   ============================================================ */
const ALL_MODES = ["characters","dither","mosaic","pixel","dots","cross","diamond","voxel","lego","mixed",
  "lines","diagonal","braille","disco","hexdump","matrix","rings","hearts","stars","hexagons",
  "triangles","bubbles","hatch","contour","halfblocks"];
const ALL_BLUR = ["off","gaussian","directional","tilt","lens","progressive"];
const ALL_ANIM = ["wave","pulse","shimmer","ripple","flicker"];

function selftest() {
  let pass = 0, fail = 0;
  const ok = (c, m) => { if (c) pass++; else { fail++; console.error("FAIL:", m); } };
  const snapshot = JSON.parse(JSON.stringify(P));
  /* Every assertion below reads ink off the source, and with the door shut the field
     is held at a tenth and the contact line is not drawn at all. Light it. */
  const wasEnterAt = enterAt;
  enterAt = performance.now() - 1e6;

  const lut = buildTone();
  let mono = true;
  for (let i = 1; i < 256; i++) if (lut[i] < lut[i-1] - 1e-6) mono = false;
  ok(mono, "tone LUT monotonic");
  ok(lut[0] >= 0 && lut[255] <= 1, "tone LUT in [0,1]");

  /* toneCurve: unsorted input, duplicate x, and more than two control points */
  {
    const keep = P.toneCurve;
    P.toneCurve = [{x:1,y:1},{x:0,y:0},{x:0.5,y:0.9}];        /* out of order */
    let l = buildTone();
    ok(Math.abs(l[128] - 0.9) < 0.02, "tone curve sorts its control points");
    P.toneCurve = [{x:0,y:0},{x:0.5,y:0.2},{x:0.5,y:0.8},{x:1,y:1}];   /* duplicate x */
    l = buildTone();
    let finite = true;
    for (let i = 0; i < 256; i++) if (!(l[i] >= 0 && l[i] <= 1)) finite = false;
    ok(finite, "tone curve survives a duplicate x");
    P.toneCurve = [{x:0,y:0},{x:0.25,y:0.5},{x:0.5,y:0.25},{x:0.75,y:0.9},{x:1,y:1}];
    l = buildTone();
    ok(Math.abs(l[64] - 0.5) < 0.02 && Math.abs(l[128] - 0.25) < 0.02 && Math.abs(l[191] - 0.9) < 0.02,
       "tone curve hits every one of 5 control points");
    P.toneCurve = keep; TONE = buildTone();
  }

  for (const L of [0, 0.5, 1, 1.0000001]) ok((L * 15.999 | 0) < 16 && (L * 15.999 | 0) >= 0, "hex glyph index at L=" + L);
  ok(BRAILLE.length === 256, "braille atlas covers all 256 patterns");

  /* braille dot numbering: bit n of the codepoint is dot n+1, laid out
     1 4 / 2 5 / 3 6 / 7 8 down the two columns */
  {
    const want = { "0,0": 0x2801, "0,1": 0x2802, "0,2": 0x2804, "0,3": 0x2840,
                   "1,0": 0x2808, "1,1": 0x2810, "1,2": 0x2820, "1,3": 0x2880 };
    let bad = [];
    for (let sx = 0; sx < 2; sx++) for (let sy = 0; sy < 4; sy++) {
      const cp = 0x2800 + (1 << BRAILLE_BIT[sx*4 + sy]);
      if (cp !== want[sx + "," + sy]) bad.push(sx + "," + sy + "=U+" + cp.toString(16));
    }
    ok(bad.length === 0, "braille bit map matches Unicode dot numbering " + bad.join(" "));
    ok(BRAILLE_BIT.slice().sort((a,b) => a-b).join() === "0,1,2,3,4,5,6,7", "braille bit map is a permutation");
  }

  /* SUBCELL has to list exactly the modes that call pxLum — anything that calls it
     without being listed silently falls back to the cell grid and loses the detail
     it was asking for. Count the calls instead of trusting the table. */
  {
    const real = pxLum;
    let hits = 0;
    pxLum = (x, y) => { hits++; return real(x, y); };
    const wrong = [];
    for (const m of ALL_MODES) {
      P.renderMode = m; hits = 0;
      try { frame(1.7); } catch (e) { /* the mode sweep below reports throws */ }
      if ((hits > 0) !== !!SUBCELL[m]) wrong.push(m + (hits ? " calls pxLum, not listed" : " listed, never calls pxLum"));
    }
    pxLum = real;
    ok(wrong.length === 0, "SUBCELL matches the modes that need sub-cell detail: " + wrong.join("; "));
    P.renderMode = snapshot.renderMode;
  }

  /* donut must never project outside its buffer over a full rotation */
  const n = 64, R1 = 1, R2 = 2, K2 = 5, K1 = n * K2 * 3 / (8 * (R1 + R2));
  let oob = 0, hits = 0;
  for (let A = 0; A < TAU; A += 0.4) for (let B = 0; B < TAU; B += 0.4) {
    const cA = Math.cos(A), sA = Math.sin(A), cB = Math.cos(B), sB = Math.sin(B);
    for (let th = 0; th < TAU; th += 0.3) for (let ph = 0; ph < TAU; ph += 0.3) {
      const ct = Math.cos(th), st = Math.sin(th), cp = Math.cos(ph), sp = Math.sin(ph);
      const cx = R2 + R1*ct, cy = R1*st;
      const z = K2 + cA*cx*sp + cy*sA;
      if (z <= 0) { oob++; continue; }
      const ooz = 1/z;
      const xp = (n/2 + K1*ooz*(cx*(cB*cp + sA*sB*sp) - cy*cA*sB)) | 0;
      const yp = (n/2 - K1*ooz*(cx*(sB*cp - sA*cB*sp) + cy*cA*cB)) | 0;
      hits++;
      if (xp < 0 || xp >= n || yp < 0 || yp >= n) oob++;
    }
  }
  ok(oob === 0 && hits > 0, "donut projects inside the buffer (" + oob + " strays of " + hits + ")");

  /* fraction of the glyph layer that carries ink */
  const inkFrac = () => {
    const d = gctx.getImageData(0, 0, W, H).data;
    let n = 0, seen = 0;
    for (let i = 3; i < d.length; i += 40) { seen++; if (d[i] > 0) n++; }
    return n / seen;
  };
  const inked = () => inkFrac() > 0;

  for (const m of ALL_MODES) {
    P.renderMode = m;
    try { frame(1.7); ok(inked(), "mode " + m + " draws ink"); }
    catch (e) { ok(false, "mode " + m + " threw: " + e.message); }
  }
  P.renderMode = snapshot.renderMode;

  /* The background is whatever the colour chain makes of a pure-black source cell.
     Under screen/lighten/color-dodge that is not zero, and testing it against zero
     used to put a glyph in every cell of the frame — a grey wash at ~7x the cost. */
  {
    frame(1.7);
    const ref = inkFrac();
    const bad = [];
    for (const b of Object.keys(BLEND)) {
      P.overlayBlend = b;
      try { frame(1.7); } catch (e) { bad.push(b + " threw"); continue; }
      const f = inkFrac();
      if (f > ref + 0.15) bad.push(b + " inks " + (f*100|0) + "% of the frame vs " + (ref*100|0) + "%");
    }
    P.overlayBlend = snapshot.overlayBlend;
    ok(bad.length === 0, "background stays background under every overlayBlend: " + bad.join("; "));
  }

  /* coverage and density across their full span, negatives included */
  {
    frame(1.7);
    const full = inkFrac();
    P.coverage = 0;   frame(1.7); const none = inkFrac();
    P.coverage = 50;  frame(1.7); const half = inkFrac();
    P.coverage = 100; frame(1.7);
    ok(none === 0, "coverage 0 draws nothing");
    ok(half > 0 && half < full, "coverage 50 draws less than 100 (" + (half*100|0) + "% vs " + (full*100|0) + "%)");
    P.coverage = snapshot.coverage;

    const dm = d => 1 + clamp(d, -100, 100) / 200;
    ok(dm(-1e9) > 0 && dm(1e9) <= 1.5, "density clamps to a positive shape scale over any input");
    const bad = [];
    for (const d of [-200, -100, -50, 0, 50, 100, 200]) {
      P.density = d;
      try { frame(1.7); if (!(inkFrac() >= 0)) bad.push(d); } catch (e) { bad.push(d + " threw"); }
    }
    P.density = snapshot.density;
    ok(bad.length === 0, "density renders across its span: " + bad.join(","));
  }

  /* edgeEmphasis must stay a 0..1 operator at the top of its range, not clip the
     whole field flat the moment it is turned up */
  {
    const lift = (L, e, ee) => L + (1 - L) * clamp(e * 0.25 * ee * 6, 0, 1);
    let bad = [];
    for (const ee of [0, 0.25, 0.5, 1]) for (const L of [0, 0.3, 1]) for (const e of [0, 2, 4]) {
      const v = lift(L, e, ee);
      if (!(v >= 0 && v <= 1 + 1e-9)) bad.push("ee=" + ee + " L=" + L + " e=" + e + " -> " + v);
    }
    ok(bad.length === 0, "edgeEmphasis stays in [0,1]: " + bad.join(" "));
    ok(lift(0.2, 0.4, 1) > lift(0.2, 0.4, 0.25), "edgeEmphasis is monotonic in its own value");
    let flat = 0;
    for (const L of [0.1, 0.3, 0.5, 0.7]) if (lift(L, 0.4, 0.25) > 0.999) flat++;
    ok(flat === 0, "edgeEmphasis at the default does not saturate a mid-tone edge");
  }

  /* A strip blurred on its own fades out at its own top and bottom edge, so the old
     8px-strip tilt/progressive both seamed once per strip and lost a third of the
     ink. Clipping to the band while sampling a padded slice must not. */
  {
    const w = 128, h = 64, bands = 8, bh = h / bands, pad = 19;
    const a = mk(w,h), ax = a.getContext("2d"); ax.fillStyle = "#fff"; ax.fillRect(0,0,w,h);
    const run = (clipped) => {
      const b = mk(w,h), bx = b.getContext("2d");
      for (let i = 0; i < bands; i++) {
        if (clipped) {
          bx.save(); bx.beginPath(); bx.rect(0, i*bh, w, bh); bx.clip();
          bx.filter = "blur(6px)";
          const sy = Math.max(0, i*bh - pad), sh = Math.min(h, i*bh + bh + pad) - sy;
          bx.drawImage(a, 0, sy, w, sh, 0, sy, w, sh);
          bx.restore();
        } else {
          bx.filter = "blur(6px)";
          bx.drawImage(a, 0, i*bh, w, bh, 0, i*bh, w, bh);
        }
      }
      const d = bx.getImageData(0,0,w,h).data;
      let lo = 1;
      for (let y = 20; y < h-20; y++) lo = Math.min(lo, d[(y*w + (w>>1))*4 + 3] / 255);
      return lo;
    };
    const good = run(true), bare = run(false);
    ok(good > 0.98, "band blur leaves no seams across a solid field (min alpha " + good.toFixed(2) + ")");
    ok(bare < good, "the bare-strip form this replaced really did lose ink (" + bare.toFixed(2) + ")");
  }

  for (const b of ALL_BLUR) {
    P.blurType = b;
    try { frame(1.7); pass++; } catch (e) { ok(false, "blur " + b + " threw: " + e.message); }
  }

  /* A blur redistributes ink, it does not create it. directional used to compose
     its 11 offset copies with source-over, which is a union on a sparse layer, not
     a mean — three times the ink and the trail weighted to one end. */
  {
    const scratch = mk(W, H), sx = scratch.getContext("2d");
    const energy = () => {
      sx.setTransform(1,0,0,1,0,0);
      sx.globalAlpha = 1; sx.globalCompositeOperation = "copy"; sx.filter = "none";
      sx.clearRect(0, 0, W, H);
      sx.globalCompositeOperation = "source-over";
      drawBlurred(sx, glyph);
      const d = sx.getImageData(0, 0, W, H).data;
      let s = 0;
      for (let i = 3; i < d.length; i += 4) s += d[i];
      return s;
    };
    drawSource(1.7); renderCells(1.7);
    P.blurType = "off"; P.blurAmount = 60;
    const ref = energy();
    const bad = [];
    for (const bt of ALL_BLUR) {
      P.blurType = bt;
      const r = energy() / ref;
      if (!(r > 0.7 && r < 1.3)) bad.push(bt + " " + r.toFixed(2) + "x");
    }
    P.blurType = snapshot.blurType; P.blurAmount = snapshot.blurAmount;
    ok(bad.length === 0, "blur conserves the layer's ink: " + bad.join(" "));
  }
  /* lens: the focus disc is the sharp part. It used to be the only region the ring
     loop never overdrew, so it got the outermost band's maximum blur.
     Probe one patch of the lockup twice — focused on it, then focused on the
     opposite corner — so this measures blur and nothing else. Comparing frame
     centre against frame edge instead only worked on a near-square window: make
     it wide and the centre probe lands on empty background, and the test reads
     "how much ink is under each probe" rather than "how sharp is it". */
  {
    P.blurType = "lens"; P.blurAmount = 100; P.lensFocus = 25;
    P.renderMode = "pixel";                        /* solid cells: contrast is all edges */
    const n = 64;
    const px = clamp(LOCK.cx * W - n/2, 0, W - n), py = clamp(LOCK.cy * H - n/2, 0, H - n);
    const detail = () => {                         /* local contrast = detail left */
      const d = ctx.getImageData(px, py, n, n).data;
      let s = 0;
      for (let i = 0; i < d.length - 4; i += 4) s += Math.abs(d[i] - d[i+4]);
      return s;
    };
    P.blurCenterX = LOCK.cx * 100; P.blurCenterY = LOCK.cy * 100;
    frame(1.7); const focused = detail();
    /* the opposite corner, not the mirrored point: with the lockup centred — which
       is where a portrait viewport puts it — mirroring barely moves the disc, and
       the "defocused" frame came back nearly as sharp as the focused one */
    P.blurCenterX = LOCK.cx < 0.5 ? 100 : 0; P.blurCenterY = LOCK.cy < 0.5 ? 100 : 0;
    frame(1.7); const defocused = detail();
    ok(focused > defocused * 1.5,
       "lens focus disc keeps detail the rim loses (" + focused + " vs " + defocused + ")");
    P.renderMode = snapshot.renderMode;
    P.blurAmount = snapshot.blurAmount; P.lensFocus = snapshot.lensFocus;
    P.blurCenterX = snapshot.blurCenterX; P.blurCenterY = snapshot.blurCenterY;
  }
  P.blurType = snapshot.blurType;

  for (const a of ALL_ANIM) {
    P.animStyle = a;
    try { frame(1.7); pass++; } catch (e) { ok(false, "anim " + a + " threw: " + e.message); }
  }
  P.animStyle = snapshot.animStyle;

  /* animated:false must actually freeze the glyph layer. matrix drives its rain and
     disco its hue straight off t, so both used to keep animating with it off.
     The source torus is not glyph animation and keeps tumbling — hold it still
     here so this measures only what `animated` governs. */
  {
    P.animated = false;
    drawSource(2.0);
    const bad = [];
    for (const m of ["matrix", "disco", "hexdump", "characters"]) {
      P.renderMode = m;
      renderCells(2.0); const a = gctx.getImageData(0, 0, W, H).data.slice();
      renderCells(9.5); const b = gctx.getImageData(0, 0, W, H).data;
      let diff = 0;
      for (let i = 3; i < a.length; i += 40) if (a[i] !== b[i]) diff++;
      if (diff) bad.push(m + " (" + diff + " cells moved)");
    }
    P.animated = true;
    P.renderMode = "hexdump";
    renderCells(2.0); const a = gctx.getImageData(0, 0, W, H).data.slice();
    renderCells(9.5); const b = gctx.getImageData(0, 0, W, H).data;
    let moved = 0;
    for (let i = 3; i < a.length; i += 40) if (a[i] !== b[i]) moved++;
    ok(moved > 0, "animated:true still animates the glyph layer");
    P.animated = snapshot.animated; P.renderMode = snapshot.renderMode;
    ok(bad.length === 0, "animated:false freezes the glyph layer: " + bad.join(", "));
  }

  for (const k of PFX_ORDER) {
    for (const kk of PFX_ORDER) P.pfx[kk].enabled = (kk === k);
    P.pfx[k].intensity = 100;                     /* the top of the range is where they break */
    try { frame(1.7); pass++; } catch (e) { ok(false, "pfx " + k + " at 100 threw: " + e.message); }
  }
  for (const k of PFX_ORDER) { P.pfx[k].enabled = snapshot.pfx[k].enabled; P.pfx[k].intensity = snapshot.pfx[k].intensity; }
  ok(P.pfx === PARAMS.pfx, "selftest restores pfx in place, not by swapping the object");

  /* The contact words are painted on the canvas and the click targets are separate
     DOM boxes, so nothing you can see tells you when the two drift apart — a wrong
     margin or a botched device-px conversion leaves the words looking perfect and
     the links unclickable. Assert each box sits over real ink, and that the DOM
     copy maps back to the same place. */
  {
    drawSource(1.7);
    ok(LINK_HITS.length === copyEls.length, "every contact link gets a hit box");
    const bad = [];
    for (const b of LINK_HITS) {
      const bw = Math.max(1, Math.min(b.w | 0, W - (b.x | 0)));
      const bh = Math.max(1, Math.min(b.h | 0, H - (b.y | 0)));
      const d = sctx.getImageData(clamp(b.x|0, 0, W-1), clamp(b.y|0, 0, H-1), bw, bh).data;
      let lit = 0;
      for (let i = 0; i < d.length; i += 4) if (d[i] > 40) lit++;
      if (lit < 20) bad.push(b.el.dataset.label + ": box over " + lit + " lit px");
      /* Ask the browser where the box actually is, not what we wrote into its style.
         Reading back style.left only proves syncLinkHits can assign a string: it
         cannot see an offset parent, a transform or a stray margin, and an offset
         parent is exactly what once put every box 115px right of its word. */
      const r = b.el.getBoundingClientRect();
      const dx = Math.abs(r.x * DPX - b.x), dy = Math.abs(r.y * DPX - b.y);
      if (dx > 2 || dy > 2) bad.push(b.el.dataset.label + ": DOM box off by " + dx.toFixed(1) + "," + dy.toFixed(1));
    }
    ok(bad.length === 0, "hit boxes sit over the painted words: " + bad.join("; "));
    /* the contact line must end before the lockup starts and stay inside the frame,
       at any window shape — it is sized from linkSize but clamped to what fits */
    {
      const last = LINK_HITS[LINK_HITS.length - 1];
      const lockLeft = (LOCK.cx - LOCK.w / 2) * W;
      /* Landscape shares the floor with the lockup, so the line must stop before it.
         Portrait stacks them, so the line clears it by sitting under the reflection
         instead — the same requirement, answered by a different arrangement. */
      if (PORTRAIT) {
        ok(LINK_HITS.every(h => h.y > LOCK.floor * H - 2),
           "contact line hangs below the reflection (portrait)");
      } else {
        ok(last.x + last.w < lockLeft, "contact line clears the lockup (" +
           (((last.x + last.w) | 0) + " < " + (lockLeft | 0)) + ")");
      }
      ok(last.y + last.h <= H + 1, "contact line stays inside the bottom edge");
    }
    /* "copied!" must replace the word, and the boxes must follow when that changes
       the width. "discord" and "copied!" are both 7 monospace characters and shift
       nothing, so measure it on the short label. */
    const hitOf = (e) => LINK_HITS.find(h => h.el === e);
    const el = copyEls.filter(e => e.dataset.copy).pop(), wasCopied = el._copied;
    const before = LINK_HITS.map(h => ({ el: h.el, x: h.x, y: h.y }));
    const beforeW = hitOf(el).w;
    el._copied = performance.now(); hitKey = "";
    drawSource(1.7);
    const hit = hitOf(el);
    ok(hit.t === "copied!", 'clicking shows "copied!" in the field, got "' + hit.t + '"');
    ok(hit.w > beforeW, '"copied!" is wider ink than the label (' + beforeW.toFixed(0) + " -> " + hit.w.toFixed(0) + "px)");
    /* and none of that may move the layout. Every word owns a slot as wide as the
       longest thing it can say, so the ink grows inside a row that does not. The word
       that changed re-centres within its own slot — that is the cost of centring the
       ink rather than leaving it flush left with the slack trailing, which is what
       made the row read as lopsided — but nothing else may move at all. */
    const moved = before.filter(b => {
      if (b.el === el) return false;                 /* the one that changed is allowed to */
      const now = hitOf(b.el);
      return !now || Math.abs(now.x - b.x) > 0.5 || Math.abs(now.y - b.y) > 0.5;
    });
    ok(moved.length === 0, "no other word moves when one of them changes width: " +
       moved.map(m => m.el.dataset.label).join(", "));
    /* the changed word stays inside the slot it always had */
    const slack = Math.abs(hitOf(el).x - before.find(b => b.el === el).x);
    ok(slack <= (hit.w - beforeW) / 2 + 1,
       "and it re-centres inside its own slot rather than pushing the row (" + slack.toFixed(1) + "px)");
    el._copied = wasCopied; hitKey = ""; drawSource(1.7);
    ok(hitOf(el).t === el.dataset.label, "the word comes back after a second");

    /* The word may only say copied! when the handle reached the clipboard. Both real
       paths need document focus and a trusted gesture, so drive the decision itself. */
    {
      const realW = navigator.clipboard && navigator.clipboard.writeText;
      const realE = document.execCommand;
      const stub = (writeOk, execOk) => {
        if (navigator.clipboard) {
          navigator.clipboard.writeText = writeOk ? () => Promise.resolve()
                                                  : () => Promise.reject(new Error("refused"));
        }
        document.execCommand = () => execOk;
      };
      /* awaited one at a time: toClipboard suspends on its first await, so installing
         all three stubs up front would have every call resume against the last one */
      (async () => {
        stub(true, false);  const native   = await toClipboard("x");
        stub(false, true);  const fallback = await toClipboard("x");
        stub(false, false); const neither  = await toClipboard("x");
        if (navigator.clipboard) navigator.clipboard.writeText = realW;
        document.execCommand = realE;
        if (!native)   console.error("FAIL: the clipboard's own path reports success");
        if (!fallback) console.error("FAIL: execCommand covers a non-secure context");
        if (neither)   console.error("FAIL: with both refused it must report failure");
      })();
      ok(true, "clipboard success is reported from the write, not assumed (async, logs its own failures)");
    }
  }

  /* ---------- entry gate, soundtrack, contact-line legibility ---------- */
  {
    ok(gateEl && gateEl.tagName === "BUTTON", "the gate is a real button, so Tab and Enter reach it");
    /* The sweep can be run from the console at any moment, including after someone
       has entered, so shut the door here rather than assuming it is shut. Asserting
       what a closed gate looks like only means something if you closed it. */
    /* reveal() now decides the effects too, so the door's state includes them */
    const fxWas = {}; for (const k of FX_KEYS) fxWas[k] = P.pfx[k].enabled;
    const bgWas2 = P.bgMode, bgoWas2 = P.bgOpacity, defWas2 = fxDeferred, stepWas2 = fxStep;
    const wasEntered = entered, wasOn = linksEl.classList.contains("on");
    const wasGateOff = gateEl.classList.contains("off");
    const wasLinksInert = linksEl.hasAttribute("inert"), wasGateInert = gateEl.hasAttribute("inert");
    entered = false; linksEl.classList.remove("on"); gateEl.classList.remove("off");
    linksEl.setAttribute("inert", ""); gateEl.removeAttribute("inert");
    ok(!entered && !linksEl.classList.contains("on"), "the contact line stays hidden until you enter");
    /* the ramp is a pure function of elapsed time, so the fade is assertable
       without sitting through four seconds of it */
    ok(rampVolume(0) === 0, "the soundtrack starts silent");
    ok(rampVolume(FADE_MS) === VOLUME, "the soundtrack reaches full at the end of the fade");
    ok(rampVolume(FADE_MS / 2) > 0 && rampVolume(FADE_MS / 2) < VOLUME, "the soundtrack ramps in between");
    ok(rampVolume(FADE_MS * 3) === VOLUME, "the ramp never overshoots");

    ok(linksEl.hasAttribute("inert"), "the contact links are inert behind a closed gate");

    /* The door is ink in the same field, not HTML over it — assert it is actually
       painted into the source, and actually gone once the piece is lit. */
    {
      const bh = Math.max(1, (H * 0.14) | 0), bw = Math.max(1, (W * 0.5) | 0);
      const bx = (W * 0.25) | 0, by = ((H - bh) / 2) | 0;
      const ink = () => {
        const d = sctx.getImageData(bx, by, bw, bh).data;
        let n = 0;
        for (let i = 0; i < d.length; i += 4) if (d[i] > 40) n++;
        return n;
      };
      /* Pinned to the landscape arrangement: the sample box is the middle of the
         screen, which is exactly where a portrait composition puts the lockup, and
         then "lit" has more ink there than "shut" for reasons that have nothing to
         do with the door. What the door does is identical either way. */
      const wasPortrait = PORTRAIT;
      PORTRAIT = false; grp = null;
      enterAt = 0; drawSource(1.7);
      const shut = ink();
      enterAt = performance.now() - 1e6; drawSource(1.7);
      const open = ink();
      PORTRAIT = wasPortrait; grp = null;
      ok(shut > 200, "the door is painted into the source, not the DOM (" + shut + " lit px)");
      ok(open * 4 < shut, "and it is gone once the piece is lit (" + open + " vs " + shut + ")");
    }
    reveal();
    ok(entered && linksEl.classList.contains("on"), "entering reveals the contact line");
    ok(gateEl.classList.contains("off"), "entering fades the gate out");
    ok(gateEl.hasAttribute("inert"), "the answered door leaves the tab order at once");
    ok(!linksEl.hasAttribute("inert"), "entering hands the contact links back to Tab");
    /* reveal() starts the ramp from now, and under prefers-reduced-motion that ramp
       is a single millisecond — measure ink from the far end of it, not the near */
    enterAt = performance.now() - 1e6;

    /* Legibility here is not point size, it is how much ink survives the grid: a
       hairline stroke averaged over a 6px cell comes out a grey smudge at any size. */
    frame(1.7);
    const b = LINK_HITS[0];
    const cx0 = Math.max(0, (b.x / P.cellSize) | 0), cx1 = Math.min(cols, Math.ceil((b.x + b.w) / P.cellSize));
    const cy0 = Math.max(0, (b.y / P.cellSize) | 0), cy1 = Math.min(rows, Math.ceil((b.y + b.h) / P.cellSize));
    let sum = 0, n = 0;
    for (let y = cy0; y < cy1; y++) for (let x = cx0; x < cx1; x++) { n++; sum += LUM[y * cols + x]; }
    const meanL = sum / Math.max(1, n);
    /* Mean luminance over the word, not the share of cells above a threshold. That
       share looks like a legibility measure and is really a measure of grid pitch:
       a finer grid resolves more of the empty space inside a word's bounding box, so
       it falls (21.2% at cellSize 6, 19.2% at 4) while the words get strictly more
       legible. Mean holds flat across every pitch — 0.161 at 6 through 0.167 at 3 —
       and it is what actually broke: the old regular-weight hairline measured 0.118. */
    ok(n > 0 && meanL >= 0.13, "the contact words hold their ink through the grid (mean " +
       meanL.toFixed(3) + ", need 0.13)");
    /* the grid is what eats these words, so the floor is measured in cells, not px */
    const tall = b.h / 1.3 / P.cellSize;
    ok(tall >= LINK_MIN_CELLS, "contact words stay at least " + LINK_MIN_CELLS +
       " cells tall (" + tall.toFixed(1) + ")");

    /* A resize must not hand the visitor a re-tile once they are inside. Gecko fires
       resize events Chrome does not, and every one of them used to reopen the walk. */
    ok(reopensWalk(2e6, 2e6, false), "before entry, any resize reopens the walk");
    ok(!reopensWalk(2e6, 2.05e6, true), "after entry, a browser-chrome resize does not");
    ok(!reopensWalk(2e6, 2e6, true), "after entry, a resize that changed nothing does not");
    ok(reopensWalk(2e6, 8e6, true), "after entry, a move to a much bigger surface still does");
    ok(reopensWalk(8e6, 2e6, true), "and so does a move to a much smaller one");
    {
      /* the same hole, reached through the dpr watcher: the query is built from a
         string and can fire for a display nobody touched */
      const wasRaf = resizeRaf, wasLast = lastDpr;
      resizeRaf = 0; lastDpr = devicePixelRatio || 1;
      onDprChange();
      ok(resizeRaf === 0, "an unchanged devicePixelRatio schedules no resize");
      resizeRaf = wasRaf; lastDpr = wasLast;
    }

    /* The frame cap is a skip branch, and a skip branch that skips too much is a
       stutter nobody can see in a screenshot. One simulated second of a 144Hz
       display, at 60fps, is 60 frames. */
    {
      const minMs = 1000 / 60;
      let next = 0, shown = 0;
      for (let i = 0; i < 144; i++) {
        const now = i * (1000 / 144);
        if (now < next) continue;
        next = nextFrameTime(now, next, minMs);
        shown++;
      }
      ok(shown >= 58 && shown <= 62, "maxFps holds 60 on a 144Hz display (" + shown + " frames)");
    }

    /* leave the door exactly as it was found, open or shut — effects included */
    for (const k of FX_KEYS) P.pfx[k].enabled = fxWas[k];
    P.bgMode = bgWas2; P.bgOpacity = bgoWas2;
    fxDeferred = defWas2; fxStep = stepWas2; fxSaved = null;
    entered = wasEntered;
    linksEl.classList.toggle("on", wasOn);
    gateEl.classList.toggle("off", wasGateOff);
    if (wasLinksInert) linksEl.setAttribute("inert", ""); else linksEl.removeAttribute("inert");
    if (wasGateInert) gateEl.setAttribute("inert", ""); else gateEl.removeAttribute("inert");
    enterAt = wasEnterAt;
  }

  /* A tall viewport is a different composition, and it had no assertions at all —
     which is how it stayed a landscape layout squeezed into portrait until someone
     opened it on a phone. Drives the real resize path at each size, so the grid,
     the backing store and the copy targets are rebuilt the way they are in life. */
  {
    const realMeasure = measureViewport;
    const at = (w, h, fn) => {
      measureViewport = () => { vpW = w; vpH = h; };
      resize(); enterAt = performance.now() - 1e6; drawSource(2.1);
      try { return fn(); } finally { measureViewport = realMeasure; }
    };
    const phones = [[375, 812], [390, 844], [360, 740], [320, 568], [412, 915]];
    const bad = [];
    for (const [w, h] of phones) {
      const r = at(w, h, () => ({
        portrait: PORTRAIT,
        centred: Math.abs(LOCK.cx - 0.5) < 0.01,
        wide: LOCK.w >= 0.6,
        lockInside: (LOCK.cx - LOCK.w / 2) * W >= -1 && (LOCK.cx + LOCK.w / 2) * W <= W + 1,
        under: LINK_HITS.every(x => x.y > LOCK.floor * H - 2),
        inside: LINK_HITS.every(x => x.x >= -1 && x.x + x.w <= W + 1 && x.y + x.h <= H + 1),
        legible: LINK_HITS[0].h / 1.3 / P.cellSize >= LINK_MIN_CELLS
      }));
      for (const k of Object.keys(r)) if (!r[k]) bad.push(w + "x" + h + ":" + k);
    }
    ok(bad.length === 0, "the portrait composition holds on every phone: " + bad.join(", "));

    /* and a wide window must not be dragged into it */
    const land = at(1280, 800, () => ({
      notPortrait: !PORTRAIT,
      rightAnchored: LOCK.cx > 0.55,
      clears: LINK_HITS.every(x => x.x + x.w < (LOCK.cx - LOCK.w / 2) * W + 1)
    }));
    ok(land.notPortrait && land.rightAnchored && land.clears,
       "a landscape window keeps the arrangement it had: " + JSON.stringify(land));
    measureViewport = realMeasure; resize();
  }

  /* The wordmark sits on the donut's centre line. It used to sit on the floor of the
     group box, which put it about a quarter of the font size low — invisible until
     someone looked at the lockup on its own and said the word hangs below the mark. */
  {
    buildGroup(2.1);
    const d = gpx.getImageData(0, 0, GW, GH).data;
    const midOf = (x0, x1) => {
      let top = -1, bot = -1;
      for (let y = 0; y < GH; y++) {
        let lit = false;
        for (let x = x0; x < x1; x++) if (d[(y * GW + x) * 4 + 3] > 24) { lit = true; break; }
        if (lit) { if (top < 0) top = y; bot = y; }
      }
      return top < 0 ? null : (top + bot) / 2;
    };
    const split = Math.round(GW * 0.30);
    const donutMid = midOf(0, split), wordMid = midOf(split, GW);
    const off = donutMid === null || wordMid === null ? 1e9 : Math.abs(wordMid - donutMid);
    ok(off <= GH * 0.03, "the wordmark rides the donut's centre line (" + off.toFixed(1) +
       "px of " + GH + ")");
  }

  /* the lockup buffer has to hold its own ink: strokeText widens past measureText,
     and a word with a descender used to have its tail sliced off by the box */
  {
    const bad = [];
    for (const w of [snapshot.word, "g", "jqpy", "WWWWWWWWWWWW", "i", "addicted."]) {
      P.word = w; grp = null; buildGroup(1.7);
      const d = gpx.getImageData(0, 0, GW, GH).data;
      let edge = 0;
      for (let x = 0; x < GW; x++) edge += d[x*4 + 3] + d[((GH-1)*GW + x)*4 + 3];
      for (let y = 0; y < GH; y++) edge += d[(y*GW)*4 + 3] + d[(y*GW + GW-1)*4 + 3];
      if (edge > 0) bad.push(w);
    }
    P.word = snapshot.word; grp = null;
    ok(bad.length === 0, "lockup buffer clips no ink, including descenders: " + bad.join(" "));
  }

  /* auto-quality only works if renderScale still moves the backing store once
     the pixel budget is the binding constraint — a 4K window at 2x is that case */
  {
    const px = (s) => { const d = backingDpr(3840, 2160, 2, s); return ((3840*d)|0) * ((2160*d)|0); };
    ok(px(1) > P.pixelBudget * 0.9 && px(1) < P.pixelBudget * 1.1, "4K at 2x clamps to the pixel budget");
    ok(px(0.75) < px(1) * 0.6, "renderScale still cuts pixels at the budget (" + (px(0.75)/px(1)).toFixed(2) + "x)");
    ok(px(1) >= px(0.9) && px(0.9) >= px(0.75), "backing store is monotonic in renderScale");
    const small = (s) => { const d = backingDpr(800, 600, 1, s); return ((800*d)|0) * ((600*d)|0); };
    ok(small(1) === 800 * 600, "a window under the budget renders 1:1");
  }

  /* Auto-quality has to keep working when frames are genuinely slow. A guard that
     rejected any sample over 100ms silently froze it on exactly the heavy windows it
     exists for — the page just stayed slow and nothing ever adapted. Nothing visible
     tells you that happened, so assert it. */
  {
    ok(qualitySample(120) === 120, "a 120ms frame reaches auto-quality as itself");
    ok(qualitySample(84) === 84, "a normal slow frame is passed through unchanged");
    ok(qualitySample(9e9) === QUALITY_SAMPLE_CAP, "an absurd gap is clamped, not fed in raw");

    /* Two machines, each simulated by a cost model that responds to the settings —
       a constant cost would let the walk "improve" things that changed nothing.
       A: the effects are the cost (Gecko's real numbers, 58ms against 22ms).
       B: only pixels are the cost, so the grid and the effects are both innocent. */
    const save = { c: P.cellSize, cs: cellStep, fx: fxStep, rs: renderScale, m: measured,
                   ad: adapting, aj: adjusts, aq: P.autoQuality, wf: warmFrames };
    /* The effects may legitimately be off when the sweep starts — the door defers them
       — so put back exactly what was there rather than switching them on. */
    const pfxWas = {}; for (const k of FX_KEYS) pfxWas[k] = P.pfx[k].enabled;
    const bgWas = P.bgMode, bgoWas = P.bgOpacity, defWas = fxDeferred;
    const putFxBack = () => {
      for (const k of FX_KEYS) P.pfx[k].enabled = pfxWas[k];
      P.bgMode = bgWas; P.bgOpacity = bgoWas; fxSaved = null; fxDeferred = defWas;
    };
    const realResize = resize;
    const run = (cost) => {
      let resized = 0;
      resize = () => { resized++; restartMeasure(); };
      P.autoQuality = true; renderScale = 1; P.cellSize = CELL_LADDER[0];
      cellStep = 0; fxStep = 0; setEmbellishment(true);
      measured = 0; sampleSum = 0; sampleN = 0; adapting = true; adjusts = 0; warmFrames = 0;
      undoStep = null; rungBlocked.fx = rungBlocked.cell = rungBlocked.scale = false;
      prevMeasured = 0; fxDeferred = false;             /* the sweep tests the rung itself */
      const wasEntered = entered; entered = false;      /* the walk's normal home */
      /* Every cost model here carries the engine's warm-up on top of it, because a
         steady synthetic number cannot reproduce the bug these tests exist for: the
         page gets faster on its own for several seconds, and a walk that reads a
         falling baseline scores the drift as its own success. */
      let t = 0;
      const warming = () => { t++; return cost() * (1 + 1.6 * Math.exp(-t / 120)); };
      for (let i = 0; i < 40000 && adapting; i++) autoQuality(warmFrames > 0 ? 200 : warming());
      entered = wasEntered;
      const r = { cell: P.cellSize, scale: renderScale, fx: fxStep, resized, adapting };
      resize = realResize;
      return r;
    };

    /* Gecko's real numbers: 46.0/45.6/43.0ms by cell size, roughly halved with the
       effects off. The grid is worth 6.5% for four times fewer cells, so the only
       correct answer is to drop the effects and touch nothing else. */
    const geckoMs = { 4: 46.0, 6: 45.6, 8: 43.0 };
    const A = run(() => (fxStep ? geckoMs[P.cellSize] * 0.48 : geckoMs[P.cellSize]));
    ok(A.fx === 1, "when the effects are the cost, they are what gets dropped");
    ok(A.cell === CELL_LADDER[0],
       "and the grid keeps every cell it had, 6.5% never being worth 4x the detail (cell " + A.cell + ")");
    ok(A.scale === 1, "and every pixel stays native (scale " + A.scale + ")");
    ok(!A.adapting, "and it stops there");

    const B = run(() => 120 * renderScale * renderScale);
    ok(B.scale < 1, "when only pixels are the cost, the backing store is what shrinks");
    ok(B.cell === CELL_LADDER[0],
       "and the grid, which was never the problem, keeps every cell (cell " + B.cell + ")");
    /* Not asserted: that the effects come back. The effects rung is deliberately the
       cheap one — an 8% bar, because losing atmosphere on a machine that did not need
       to lose it costs the picture little, while a bar high enough to be immune to
       warm-up drift would stop it firing on the machine it exists for. Geometry gets
       the strict bar precisely because being wrong there is expensive. */

    putFxBack();
    P.cellSize = save.c; cellStep = save.cs; fxStep = save.fx; renderScale = save.rs;
    measured = save.m; adapting = save.ad; adjusts = save.aj;
    P.autoQuality = save.aq; warmFrames = save.wf;
    undoStep = null; rungBlocked.fx = rungBlocked.cell = rungBlocked.scale = false;
  }

  /* nothing the sweep touched may leak into the running page */
  {
    const now = JSON.parse(JSON.stringify(P));
    const leaked = Object.keys(snapshot).filter(k => JSON.stringify(snapshot[k]) !== JSON.stringify(now[k]));
    ok(leaked.length === 0, "PARAMS restored exactly; leaked: " + leaked.join(","));
  }

  console.log((fail ? "%cSELFTEST FAIL" : "%cSELFTEST PASS") + " — " + pass + " passed, " + fail + " failed",
              "font-weight:bold;color:" + (fail ? "#f55" : "#5f5"));
  return { pass, fail };
}

/* ---------- contact line: the interactive half ----------
   The words are painted by drawLinks() into the source canvas. These elements are
   the hit boxes over them — transparent, positioned from that layout, and the only
   part a mouse, a Tab key or a screen reader ever touches.
   The old per-character hex scintillation is gone: the glyph field turns these
   words into hex digits anyway, so the effect is now intrinsic rather than 99 DOM
   text-node writes a second, and the 110ms interval that drove it is gone with it. */
/* Only claim it when it happened. The old form fired writeText, swallowed the
   rejection and said "copied!" regardless — on file://, in a non-secure context, or
   with permission refused, the word lied and the handle was never on the clipboard.
   execCommand is the fallback for exactly those cases; it is deprecated and it is
   also the only thing that works there. Module scope, so the sweep can drive it: both
   real paths need document focus and a trusted gesture, which a test has neither of. */
async function toClipboard(text) {
  if (navigator.clipboard && isSecureContext) {
    try { await navigator.clipboard.writeText(text); return true; } catch (e) { /* fall through */ }
  }
  try {
    const ta = document.createElement("textarea");
    ta.value = text; ta.setAttribute("readonly", "");
    ta.style.cssText = "position:fixed;top:-1000px;opacity:0";
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand("copy");
    ta.remove();
    return ok;
  } catch (e) { return false; }
}

const copyEls = [...linksEl.querySelectorAll(".copy")];
copyEls.forEach(el => {
  el._hot = false;
  el._copied = -1e9;
  el.tabIndex = 0;
  el.setAttribute("role", "button");
  el.setAttribute("aria-label", "copy " + el.dataset.label + " — " + el.dataset.copy);
  const activate = () => {
    toClipboard(el.dataset.copy).then((ok) => {
      if (ok) el._copied = performance.now();   /* drawLinks shows "copied!" for a second */
    });
  };
  /* pointer events, and touch pointers cooled explicitly on lift: a touch fires enter
     and never leaves, so a tapped word used to stay bright for the rest of the visit */
  el.addEventListener("pointerenter", (e) => { el._hot = e.pointerType !== "touch"; });
  el.addEventListener("pointerleave", () => { el._hot = false; });
  el.addEventListener("pointercancel", () => { el._hot = false; });
  el.addEventListener("pointerup", (e) => { if (e.pointerType === "touch") el._hot = false; });
  el.addEventListener("focus", () => { el._hot = true; });
  el.addEventListener("blur",  () => { el._hot = false; });
  el.addEventListener("click", activate);
  el.addEventListener("keydown", e => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); activate(); }
  });
});

/* ---------- entry gate + soundtrack ----------
   No browser starts audio without a gesture, so the piece needs a door regardless.
   It earns its keep twice over: the boot runs behind it, so the webfont landing and
   auto-quality settling - both of which re-lay the whole piece out - happen with
   nothing on screen to see them move. */
const gateEl = document.getElementById("gate");
const sndEl = document.getElementById("snd");
const SOUNDTRACK = "music.mp4", VOLUME = 0.55, FADE_MS = 4000;
/* How lit the piece is with the door shut. Not zero: the field is alive behind the
   word, which is what makes the door feel like part of the piece rather than a lid
   on it — and it means auto-quality's walk happens somewhere you can barely see. */
const GATE_FLOOR = 0.10;
/* Reduced motion asks for less movement, not less legibility, and this ramp is a
   brightness change with nothing travelling across the screen — the class of thing
   the setting is not aimed at. Shortened rather than cut: snapping straight from a
   tenth-lit field to a full one is its own jolt. */
const GATE_RAMP = matchMedia("(prefers-reduced-motion: reduce)").matches ? 400 : 1400;
let entered = false, enterAt = 0;
/* 0 with the door shut, 1 with the piece fully lit */
const gateMix = () => enterAt ? clamp((performance.now() - enterAt) / GATE_RAMP, 0, 1) : 0;

/* pure, so the ramp is assertable without sitting through four seconds of it */
const rampVolume = (ms) => VOLUME * clamp(ms / FADE_MS, 0, 1);
function fadeUp() {
  const start = performance.now();
  const step = (now) => {
    sndEl.volume = rampVolume(now - start);
    if (sndEl.volume < VOLUME) requestAnimationFrame(step);
  };
  step(start);
}

/* the visible half, split out so the self-test can assert it without a font promise */
/* the gate's own measurement, spent on the one decision it can answer for free */
function settleEmbellishment() {
  if (!fxDeferred) return;
  fxDeferred = false;
  const bare = measured;                       /* the frame without them, just measured */
  const afford = !P.autoQuality || bare === 0 || bare < P.targetMs * 0.6;
  if (afford) { fxStep = 0; setEmbellishment(true); }
  else        { fxStep = 1; }                  /* already off; leave them off */
  retileWhy = afford ? "effects on, bare frame " + bare.toFixed(1) + "ms"
                     : "effects stay off, bare frame " + bare.toFixed(1) + "ms";
  noteRetile();
  restartMeasure();
}

function reveal() {
  /* :focus-visible, not :focus — a mouse click focuses the button too, and pushing
     focus onto a contact word after a click would light it up like a hover nobody
     performed. This is true only when the door was opened from the keyboard. */
  const byKeyboard = gateEl.matches(":focus-visible");
  entered = true;
  enterAt = performance.now();
  /* Whatever the walk had reached is what this session keeps. If the click came in
     early and it had not converged, freezing here is still right: a slightly wrong
     resolution is invisible, and the correction that fixed it would not be. */
  adapting = false;
  gateEl.classList.add("off");
  linksEl.classList.add("on");
  /* until now the hit boxes were behind a closed door: they sit earlier in the DOM
     than the gate, so Tab reached them through it and Enter copied a handle instead
     of entering */
  linksEl.removeAttribute("inert");
  /* inert now, rather than `hidden` on a timer the browser is free to throttle: the
     door leaves the a11y tree and the tab order the instant it is answered, and the
     fade is left to CSS */
  gateEl.setAttribute("inert", "");
  settleEmbellishment();
  /* Making the focused element inert drops focus onto <body>, and from there the
     next Tab leaves the document for the browser's own UI — a keyboard visitor had
     to Tab twice to reach the contact links they just unlocked. Hand it over. */
  if (byKeyboard && copyEls[0]) copyEls[0].focus();
}

let entering = false;
async function enter() {
  if (entering) return;
  entering = true;
  /* Both remaining jumps re-lay the whole piece out, and both are held here rather
     than papered over: the webfont swapping under a lockup already drawn, and
     auto-quality's first correction. boot() starts on a 1.5s timeout so a dead CDN
     still runs; the door can afford to wait longer than that, so it does — and a
     click inside the first second waits for the correction it would otherwise have
     put on screen. */
  const capped = (promise, ms) => Promise.race([promise, new Promise(r => setTimeout(r, ms))]);
  await Promise.all([capped(FONT_READY, 4000), capped(SETTLED, 2500)]);
  reveal();
  sndEl.src = SOUNDTRACK;
  sndEl.volume = 0;
  /* no file yet, wrong codec, or a browser that says no anyway: you are in either way */
  Promise.resolve(sndEl.play()).then(fadeUp, () => {});
}
gateEl.addEventListener("click", enter);
/* the word brightens under the pointer the same way the contact words do */
gateEl._hot = false;
gateEl.addEventListener("pointerenter", () => { gateEl._hot = true; });
gateEl.addEventListener("pointerleave", () => { gateEl._hot = false; });
gateEl.addEventListener("focus", () => { gateEl._hot = true; });
gateEl.addEventListener("blur",  () => { gateEl._hot = false; });

/* ---------- ?bench ----------
   Whether to spend a slow engine's budget on fewer pixels (renderScale) or fewer
   cells (cellSize) depends on which of the two this browser is actually paying for,
   and that is a property of the engine, not something to infer from one data point.
   Sweep both axes, print the grid, and let the numbers decide. */
function bench() {
  const scales = [1, 0.75, 0.5], cells = [3, 4, 6, 8];
  const wasScale = renderScale, wasCell = P.cellSize, wasAt = enterAt;
  const wasAQ = P.autoQuality, wasPause = P.pauseWhenIdle;
  P.autoQuality = false; P.pauseWhenIdle = false; enterAt = performance.now() - 1e6;
  const rows_ = ["scale  cell   grid       Mpx    ms/frame   snap"];
  for (const sc of scales) for (const cs of cells) {
    renderScale = sc; P.cellSize = cs; resize();
    frame(1.0); frame(1.1);                       /* warm atlases and buffers */
    const N = 5; const a = performance.now();
    for (let i = 0; i < N; i++) frame(1.5 + i * 0.016);
    const ms = (performance.now() - a) / N;
    rows_.push(sc.toFixed(2) + "   " + String(cs).padEnd(4) + " " +
               (cols + "x" + rows).padEnd(10) + " " + (W * H / 1e6).toFixed(2) + "   " +
               ms.toFixed(1) + "   1/" + snapDivisor(sc, Math.min(P.maxDpr || 1, devicePixelRatio || 1)));
  }
  /* Canvas work is deferred, so timing a stage with performance.now() alone reports
     the JS that queued it and not the GPU that did it — which is how compose came
     back as 0.0ms of a 45ms frame. Reading one pixel forces the queue to drain, so
     these numbers include what the frame actually pays for. */
  renderScale = 1; P.cellSize = wasCell; resize();
  const flush = () => ctx.getImageData(0, 0, 1, 1);
  const stage = (fn) => { fn(); flush(); const a = performance.now();
                          for (let i = 0; i < 5; i++) { fn(); flush(); } return (performance.now() - a) / 5; };
  const whole  = stage(() => frame(1.5));
  const dsrc   = stage(() => drawSource(1.5));
  drawSource(1.5);
  const dsample = stage(() => sampleCellGrid());
  const dcells = stage(() => renderCells(1.5));
  const dcomp  = stage(() => compose());
  rows_.push("");
  rows_.push("stages at scale 1.00 cell " + P.cellSize + " (" + cols + "x" + rows + ", " + (W*H/1e6).toFixed(2) + " Mpx, flushed)");
  rows_.push("  whole frame    " + whole.toFixed(1));
  rows_.push("  drawSource     " + dsrc.toFixed(1));
  rows_.push("  sampleCellGrid " + dsample.toFixed(1) + "   (inside renderCells)");
  rows_.push("  renderCells    " + dcells.toFixed(1));
  rows_.push("  compose        " + dcomp.toFixed(1));

  /* Each post-effect is another full-canvas pass, and full-canvas passes are exactly
     what this engine is expensive at. Price them one at a time: if the total is here,
     the piece can stay sharp and simply wear less. */
  const wasPfx = {};
  for (const k of PFX_ORDER) wasPfx[k] = P.pfx[k].enabled;
  const on = PFX_ORDER.filter(k => wasPfx[k]);
  rows_.push("");
  rows_.push("post-effects at scale 1.00 (whole frame, flushed)");
  rows_.push("  all on         " + whole.toFixed(1));
  for (const k of on) {
    P.pfx[k].enabled = false;
    rows_.push("  without " + k.padEnd(10) + stage(() => frame(1.5)).toFixed(1));
    P.pfx[k].enabled = true;
  }
  for (const k of PFX_ORDER) P.pfx[k].enabled = false;
  rows_.push("  all off        " + stage(() => frame(1.5)).toFixed(1));
  for (const k of PFX_ORDER) P.pfx[k].enabled = wasPfx[k];

  /* Two full-canvas passes the pfx sweep above cannot see. The background blur is a
     canvas filter() and runs every frame whatever the effects are set to; the glyph
     layer has two compositing paths whose winner flips with cell count, and at this
     size the canvas one measured faster on Gecko and slower on Chromium. */
  rows_.push("");
  rows_.push("other full-canvas passes (whole frame, flushed)");
  const wasBg = P.bgMode;
  P.bgMode = "solid";
  rows_.push("  without bg blur   " + stage(() => frame(1.5)).toFixed(1));
  P.bgMode = wasBg;
  const wasGlyph = {};
  for (const k of Object.keys(GLYPHONLY)) wasGlyph[k] = GLYPHONLY[k];
  for (const k of Object.keys(wasGlyph)) delete GLYPHONLY[k];
  rows_.push("  glyph via canvas  " + stage(() => frame(1.5)).toFixed(1));
  for (const k of Object.keys(wasGlyph)) GLYPHONLY[k] = wasGlyph[k];
  rows_.push("  (baseline all on) " + whole.toFixed(1));
  renderScale = wasScale; P.cellSize = wasCell; enterAt = wasAt;
  P.autoQuality = wasAQ; P.pauseWhenIdle = wasPause; resize();
  frame(1.5);                     /* put the picture back; a blank canvas reads as a crash */
  const out = "BENCH  dpr " + (devicePixelRatio || 1) + "  " + vpW + "x" + vpH +
              "\n" + rows_.join("\n");
  hud.style.display = "block";
  hud.textContent = out;
  console.log(out);
  return out;
}

/* ---------- boot ---------- */
const SHOW_FPS = Q.has("fps");
const SHOW_DIAG = Q.has("diag");
if (SHOW_FPS || SHOW_DIAG) hud.style.display = "block";
TINT = parseTint(P.tint);
TONE = buildTone();

function boot() {
  resize();
  /* #links stays exactly at inset:0. syncLinkHits places each box in viewport
     coordinates taken from the canvas layout, so any offset on the container is
     added to every one of them: a left of marginX put the boxes 115px right of the
     words they belong to at 1920 wide. The margins live in the paint, not here. */
  if (Q.has("selftest")) { frame(0); selftest(); }
  if (Q.has("bench")) { bench(); return; }        /* diagnostic only: no loop, no door */
  t0 = performance.now();   /* t starts now, not at parse time, whatever the font cost */
  if (P.pauseWhenIdle && idle()) { frame(0); setPaused(true); }   /* loaded in the background */
  else requestAnimationFrame(loop);
}
/* The webfont and the Georgia fallback measure differently, so painting before it
   resolves shows a lockup that jumps width a few frames in. Wait for it — with a
   timeout so offline (or a slow CDN) still starts, on the fallback, without a jump. */
Promise.race([FONT_READY, new Promise(r => setTimeout(r, 1500))]).then(boot);
</script>
</body>
