<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>addicted — almost</title>
<meta name="description" content="Two hands in hex glyphs, reaching for each other and never touching.">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  /* touch-action: a finger dragged across the piece is input, not a scroll */
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .vig { position: fixed; inset: 0; pointer-events: none;
         background: radial-gradient(ellipse at 50% 50%, transparent 42%, rgba(0,0,0,.6) 100%); }
</style>
</head>
<body>
<canvas id="c" role="img"
  aria-label="Two hands drawn in hex characters reach toward each other from opposite sides, after Michelangelo's Creation of Adam. Their fingertips close in and spark, but never touch."></canvas>
<div class="vig"></div>
<script>
"use strict";
/* ============================================================
   "almost" — the Creation of Adam gap, in the same hex-glyph
   language as index.html. The hands are drawn as vector bones
   into a one-pixel-per-cell source, and each cell becomes a hex
   digit whose brightness is the source's. Move the pointer (or
   hold a finger) near the middle to bring them closer.
   ?selftest -> console check that the hands never overlap
   ============================================================ */

const Q = new URLSearchParams(location.search);
const TAU = Math.PI * 2;
const HEX = "0123456789abcdef";
const LEVELS = 16;                 /* brightness rows in the glyph atlas, plus row 0 for the backdrop */
const INK = "236,240,246";         /* glyph colour: the main piece's cold white */
const GLOW = "160,205,255";        /* the spark's real light, the main piece's tint lifted */
const lerp = (a, b, k) => a + (b - a) * k;
const smooth = (a, b, v) => { v = Math.min(1, Math.max(0, (v - a) / (b - a))); return v * v * (3 - 2 * v); };

/* same deterministic cell noise as index.html — Math.random() would strobe */
function hash(x, y, z) {
  let n = (Math.imul(x|0, 374761393) + Math.imul(y|0, 668265263) + Math.imul(z|0, 1274126177)) | 0;
  n = Math.imul(n ^ (n >>> 13), 1274126177);
  return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
}
const mk = (w, h) => { const c = document.createElement("canvas"); c.width = Math.max(1, w|0); c.height = Math.max(1, h|0); return c; };

/* ---------- the hands ----------
   Units are one palm length. Local frame: wrist at the origin, fingers point +x,
   y down, seen side-on with the index on top. Each finger is a chain of bones:
   `a` is the first bone's angle, `c` the bend added at each later joint, `L` the
   bone lengths, `w` the width at the knuckle and at the tip. Listed far to near,
   which is the draw order; the thumb is nearest and goes on last, over the palm. */
const HANDS = {
  /* Adam: the wrist droops, the fingers hang, only the index lifts a little —
     and lifts more as the other hand arrives */
  adam: {
    back: Math.PI - 0.5, aim: 0.10,
    fingers: [
      { at: [0.90,  0.19], a: 0.66, c: [0.55, 0.45], L: [0.42, 0.28, 0.23], w: [0.21, 0.17], shade: 0.48 },
      { at: [0.95,  0.06], a: 0.52, c: [0.55, 0.45], L: [0.52, 0.34, 0.27], w: [0.23, 0.18], shade: 0.60 },
      { at: [0.98, -0.09], a: 0.38, c: [0.48, 0.38], L: [0.57, 0.37, 0.29], w: [0.24, 0.19], shade: 0.72 },
      { at: [0.96, -0.23], a: 0.05, c: [0.14, 0.12], L: [0.54, 0.34, 0.27], w: [0.24, 0.19], shade: 0.95, index: true, lift: 0.12 },
      { at: [0.36,  0.17], a: 0.78, c: [0.10],       L: [0.44, 0.36],       w: [0.27, 0.21], shade: 0.84, thumb: true }
    ]
  },
  /* God: the arm level, the index locked straight, the rest folding behind it */
  god: {
    back: Math.PI + 0.04, aim: -0.07,
    fingers: [
      { at: [0.88,  0.20], a: 0.66, c: [0.80, 0.60], L: [0.38, 0.25, 0.21], w: [0.20, 0.16], shade: 0.46 },
      { at: [0.94,  0.08], a: 0.52, c: [0.75, 0.60], L: [0.48, 0.31, 0.25], w: [0.22, 0.17], shade: 0.58 },
      { at: [0.97, -0.07], a: 0.36, c: [0.60, 0.50], L: [0.52, 0.34, 0.27], w: [0.23, 0.18], shade: 0.70 },
      { at: [0.96, -0.23], a: -0.03, c: [0.03, 0.02], L: [0.54, 0.35, 0.28], w: [0.24, 0.19], shade: 0.97, index: true, lift: 0 },
      { at: [0.38,  0.16], a: 0.50, c: [-0.22],      L: [0.42, 0.36],       w: [0.27, 0.21], shade: 0.84, thumb: true }
    ]
  }
};
const OUT = 0.05;     /* dark rim around every part, in palm lengths: what keeps overlapping
                         fingers apart once the grid has averaged them */
const ARM_FADE = 2.4; /* the arm is gone into the dark this many palm lengths from the wrist */

/* forward kinematics: the points of one finger, its widths, and the tip's heading */
function bones(f, t, close, i) {
  const breathe = f.index ? 0 : 0.07 * Math.sin(t * 0.6 + i * 1.3);
  let a = f.a - (f.index ? f.lift * close : 0), x = f.at[0], y = f.at[1];
  const pts = [[x, y]];
  for (let k = 0; k < f.L.length; k++) {
    if (k) a += f.c[k - 1] * (1 + breathe);
    x += Math.cos(a) * f.L[k]; y += Math.sin(a) * f.L[k];
    pts.push([x, y]);
  }
  const n = pts.length - 1;
  const ws = pts.map((_, k) => lerp(f.w[0], f.w[1], k / n));
  return { pts, ws, heading: a };
}

/* where the index fingertip is in the hand's own frame — the point we place */
function pose(h, t, close) {
  const F = h.fingers.map((f, i) => bones(f, t, close, i));
  const ix = h.fingers.findIndex(f => f.index), b = F[ix];
  const end = b.pts[b.pts.length - 1], r = b.ws[b.ws.length - 1] / 2;
  const tip = [end[0] + Math.cos(b.heading) * r, end[1] + Math.sin(b.heading) * r];
  return { F, tip, heading: b.heading };
}

/* a tapered capsule: the shape of a bone, a forearm, a sleeve */
function capsule(g, x0, y0, x1, y1, r0, r1) {
  const dx = x1 - x0, dy = y1 - y0, d = Math.hypot(dx, dy) || 1e-6;
  const nx = -dy / d, ny = dx / d, a = Math.atan2(dy, dx), H = Math.PI / 2;
  g.beginPath();
  g.moveTo(x0 + nx * r0, y0 + ny * r0);
  g.lineTo(x1 + nx * r1, y1 + ny * r1);
  g.arc(x1, y1, r1, a + H, a - H, true);
  g.lineTo(x0 - nx * r0, y0 - ny * r0);
  g.arc(x0, y0, r0, a - H, a + H, true);
  g.closePath();
  g.fill();
}
const grey = v => { v = Math.round(Math.min(255, Math.max(0, v))); return "rgb(" + v + "," + v + "," + v + ")"; };
const body = s => grey(34 + s * 150);
const lit  = s => grey(70 + s * 160);

/* One finger, in three passes: a black rim (so the finger in front cuts the one
   behind), the body, and a narrower lighter bone offset upward — a lit cylinder,
   which is all the grid can carry of a finger's roundness. */
function finger(g, b, s, under) {
  const { pts, ws } = b;
  g.fillStyle = "#000";
  for (let k = 0; k < pts.length - 1; k++)
    capsule(g, pts[k][0], pts[k][1], pts[k+1][0], pts[k+1][1], ws[k] / 2 + OUT, ws[k+1] / 2 + OUT);
  if (under) under();
  g.fillStyle = body(s);
  for (let k = 0; k < pts.length - 1; k++)
    capsule(g, pts[k][0], pts[k][1], pts[k+1][0], pts[k+1][1], ws[k] / 2, ws[k+1] / 2);
  g.fillStyle = lit(s);
  for (let k = 0; k < pts.length - 1; k++)
    capsule(g, pts[k][0], pts[k][1] - ws[k] * 0.17, pts[k+1][0], pts[k+1][1] - ws[k+1] * 0.17, ws[k] * 0.22, ws[k+1] * 0.22);
}

/* The back of the hand: narrow at the wrist, broad and rounded across the knuckles.
   No rim of its own — it is drawn over the finger roots, and a rim there would
   draw a seam where the fingers leave it. */
function palm(g) {
  g.beginPath();
  g.moveTo(-0.08, -0.25);
  g.quadraticCurveTo(0.45, -0.42, 0.96, -0.35);
  g.quadraticCurveTo(1.12, -0.05, 0.94, 0.28);
  g.quadraticCurveTo(0.45, 0.38, -0.08, 0.26);
  g.closePath();
  const gr = g.createRadialGradient(0.58, -0.14, 0, 0.58, -0.14, 0.85);
  gr.addColorStop(0, lit(0.85)); gr.addColorStop(1, body(0.70));
  g.fillStyle = gr; g.fill();
}

function arm(g, h) {
  const bx = Math.cos(h.back), by = Math.sin(h.back), mid = 2.4, far = 9;
  const fade = (c0, c1) => {
    const gr = g.createLinearGradient(0, 0, bx * ARM_FADE, by * ARM_FADE);
    gr.addColorStop(0, c0); gr.addColorStop(0.3, c1); gr.addColorStop(1, "#000");
    return gr;
  };
  const tube = (w0, w1, w2, dy) => {
    capsule(g, 0, dy, bx * mid, by * mid + dy, w0, w1);
    capsule(g, bx * mid, by * mid + dy, bx * far, by * far + dy, w1, w2);
  };
  g.fillStyle = fade(body(0.72), body(0.6));
  tube(0.26, 0.40, 0.44, 0);
  g.fillStyle = fade(lit(0.6), lit(0.3));
  tube(0.06, 0.09, 0.10, -0.08);
}

/* The whole hand, placed so its index fingertip lands exactly on `at`. That is what
   makes the gap a number we control rather than an accident of two drawings. */
function hand(g, h, P, at, rot, s, flip) {
  g.save();
  g.translate(at[0], at[1]);
  g.rotate(rot);
  g.scale(flip * s, s);
  g.translate(-P.tip[0], -P.tip[1]);
  arm(g, h);
  const order = h.fingers.map((f, i) => i).filter(i => !h.fingers[i].thumb);
  for (const i of order) finger(g, P.F[i], h.fingers[i].shade);
  palm(g);   /* over the knuckles: hides the rims where the fingers leave the palm */
  const th = h.fingers.findIndex(f => f.thumb), tf = h.fingers[th];
  /* the ball of the thumb, so it grows out of the hand instead of being stuck on */
  finger(g, P.F[th], tf.shade, () => {
    /* after the thumb's rim, so the rim separates it from the palm only past the pad */
    g.fillStyle = body(0.74);
    g.beginPath(); g.ellipse(tf.at[0] - 0.06, tf.at[1] - 0.05, 0.28, 0.17, tf.a * 0.5, 0, TAU); g.fill();
  });
  g.restore();
}

/* ---------- surfaces ---------- */
const cv = document.getElementById("c");
const ctx = cv.getContext("2d", { alpha: false });
let src = mk(1, 1), sx = src.getContext("2d", { willReadFrequently: true });
let W = 0, H = 0, dpr = 1, cw = 6, ch = 10, cols = 0, rows = 0;
let atlas = null, bgLayer = null, bgSlot = -1;

/* Glyph pitch in CSS px. Coarse enough that a phone still has ~90 columns to draw a
   finger with, fine enough that a desktop reads as texture rather than as type. */
function layoutGrid() {
  const r = cv.getBoundingClientRect();
  W = Math.max(1, Math.round(r.width) || innerWidth);
  H = Math.max(1, Math.round(r.height) || innerHeight);
  dpr = Math.min(2, window.devicePixelRatio || 1);
  const f = Math.min(11, Math.max(7, Math.min(W, H * 1.6) / 150));
  /* whole device pixels per cell, or every glyph lands between pixels and blurs */
  cw = Math.max(3, Math.round(f * 0.6 * dpr));
  ch = Math.max(5, Math.round(f * dpr));
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  cols = Math.ceil(cv.width / cw); rows = Math.ceil(cv.height / ch);
  src = mk(cols, rows); sx = src.getContext("2d", { willReadFrequently: true });
  buildAtlas();
  bgLayer = mk(cv.width, cv.height); bgSlot = -1;
}

/* every glyph at every brightness, rendered once; a frame is then just blits.
   Tiles are opaque black, so a lit glyph replaces the backdrop glyph under it. */
function buildAtlas() {
  atlas = mk(cw * 16, ch * (LEVELS + 1));
  const a = atlas.getContext("2d");
  a.fillStyle = "#000"; a.fillRect(0, 0, atlas.width, atlas.height);
  a.textAlign = "center"; a.textBaseline = "middle";
  for (let r = 0; r <= LEVELS; r++) {
    const alpha = r === 0 ? 0.045 : 0.10 + 0.90 * Math.pow(r / LEVELS, 1.1);
    a.font = (r > 10 ? "700 " : "500 ") + Math.round(ch * 0.8) + 'px ui-monospace, "SF Mono", Menlo, Consolas, monospace';
    a.fillStyle = "rgba(" + INK + "," + alpha.toFixed(3) + ")";
    for (let gi = 0; gi < 16; gi++) a.fillText(HEX[gi], gi * cw + cw / 2, r * ch + ch / 2 + ch * 0.04);
  }
}

/* ---------- composition ----------
   Landscape: the hands meet on a near-level line across the middle, as in the
   ceiling. Portrait: the same meeting turned onto the diagonal — Adam from the
   lower left, God from the upper right — because a level line on a phone leaves
   each hand about six cells tall. */
function scene() {
  const portrait = W < H * 0.8;
  const phi = portrait ? -Math.atan2(H, W) * 0.62 : -0.07;
  const half = Math.hypot(W, H) / 2;
  const s = Math.min(half / 5.2, portrait ? W * 0.25 : H * 0.19);
  /* never closer than two and a half cells, taken on the tall side so it holds on the
     diagonal too: the gap has to survive the grid */
  const minGap = Math.max(s * 0.11, 2.5 * Math.max(cw, ch) / dpr);
  return { cx: W / 2, cy: H / 2, phi, s, minGap, maxGap: s * 0.95 };
}

function place(t, close, still) {
  const S = scene();
  const gap = lerp(S.maxGap, S.minGap, close);
  const ux = Math.cos(S.phi), uy = Math.sin(S.phi);
  const A = pose(HANDS.adam, t, close), G = pose(HANDS.god, t, close);
  const swayA = still ? 0 : 0.025 * Math.sin(t * 0.5);
  const swayG = still ? 0 : 0.020 * Math.sin(t * 0.43 + 1);
  return {
    S, gap,
    adam: { P: A, at: [S.cx - ux * gap / 2, S.cy - uy * gap / 2], rot: S.phi - A.heading + HANDS.adam.aim + swayA },
    god:  { P: G, at: [S.cx + ux * gap / 2, S.cy + uy * gap / 2], rot: S.phi + G.heading + HANDS.god.aim + swayG }
  };
}

function drawSource(t, close, still, only) {
  const g = sx;
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.fillStyle = "#000"; g.fillRect(0, 0, cols, rows);
  /* CSS px -> cells: the source is one pixel per glyph, so drawing at this scale
     is the area average the glyph needs, with no downsampling pass */
  g.setTransform(dpr / cw, 0, 0, dpr / ch, 0, 0);
  const L = place(t, close, still);
  if (only !== "god")  hand(g, HANDS.adam, L.adam.P, L.adam.at, L.adam.rot, L.S.s, 1);
  if (only !== "adam") hand(g, HANDS.god,  L.god.P,  L.god.at,  L.god.rot,  L.S.s, -1);
  if (!only) spark(g, L, t, close, still);
  return L;
}

/* The charge in the gap. Through the grid it is a knot of dim glyphs; the real
   light is laid over the glyphs afterwards, in glow(). */
function spark(g, L, t, close, still) {
  const k = smooth(0.55, 1, close);
  if (k <= 0) return;
  const { cx, cy, s } = L.S;
  const r = L.gap * 0.5 + s * 0.32;
  const flick = still ? 1 : 0.82 + 0.18 * Math.sin(t * 9.0) * Math.sin(t * 3.7);
  const gr = g.createRadialGradient(cx, cy, 0, cx, cy, r);
  gr.addColorStop(0, "rgba(255,255,255," + (0.55 * k * flick).toFixed(3) + ")");
  gr.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = gr;
  g.fillRect(cx - r, cy - r, r * 2, r * 2);
  /* filaments: points strung across the gap, jumping a few times a second */
  const a = L.adam.at, b = L.god.at, z = still ? 0 : Math.floor(t * 11);
  const nx = -(b[1] - a[1]) / (L.gap || 1), ny = (b[0] - a[0]) / (L.gap || 1);
  g.fillStyle = "rgba(255,255,255," + (0.9 * k).toFixed(3) + ")";
  for (let i = 1; i < 6; i++) {
    const u = i / 6, off = (hash(i, z, 3) - 0.5) * s * 0.10;
    const px = lerp(a[0], b[0], u) + nx * off, py = lerp(a[1], b[1], u) + ny * off;
    g.beginPath(); g.arc(px, py, s * 0.022, 0, TAU); g.fill();
  }
}

function glow(L, close) {
  const k = smooth(0.55, 1, close);
  if (k <= 0) return;
  const x = L.S.cx * dpr, y = L.S.cy * dpr, r = (L.gap * 0.5 + L.S.s * 0.9) * dpr;
  const gr = ctx.createRadialGradient(x, y, 0, x, y, r);
  gr.addColorStop(0, "rgba(" + GLOW + "," + (0.16 * k).toFixed(3) + ")");
  gr.addColorStop(1, "rgba(" + GLOW + ",0)");
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  ctx.fillStyle = gr; ctx.fillRect(x - r, y - r, r * 2, r * 2);
  ctx.restore();
}

/* The backdrop field: a sparse scatter of the faintest row, reshuffled a little
   under a second at a time. Built into its own layer when it changes and blitted
   otherwise — it is most of the cells and almost none of the picture. */
function backdrop(slot) {
  if (slot === bgSlot) return;
  bgSlot = slot;
  const b = bgLayer.getContext("2d");
  b.fillStyle = "#000"; b.fillRect(0, 0, bgLayer.width, bgLayer.height);
  for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
    if (hash(i, j, 0) > 0.30) continue;
    const z = Math.floor(slot + hash(i, j, 5) * 4);
    const gi = (hash(i, j, z) * 16) | 0;
    b.drawImage(atlas, gi * cw, 0, cw, ch, i * cw, j * ch, cw, ch);
  }
}

function render(t, close, still) {
  const L = drawSource(t, close, still);
  const px = sx.getImageData(0, 0, cols, rows).data;
  backdrop(still ? 0 : Math.floor(t / 0.8));
  ctx.drawImage(bgLayer, 0, 0);
  for (let j = 0, o = 0; j < rows; j++) for (let i = 0; i < cols; i++, o += 4) {
    const v = px[o];
    if (v < 14) continue;
    const lv = 1 + Math.min(LEVELS - 1, (Math.pow(v / 255, 0.85) * LEVELS) | 0);
    /* each cell re-rolls its digit on its own clock, so the shimmer never pulses in step */
    const z = still ? 0 : Math.floor(t * 2.2 + hash(i, j, 7) * 8);
    const gi = (hash(i, j, z) * 16) | 0;
    ctx.drawImage(atlas, gi * cw, lv * ch, cw, ch, i * cw, j * ch, cw, ch);
  }
  glow(L, close);
  return L;
}

/* ---------- motion ----------
   On its own the pair breathes in and out on a sixteen-second swell. A pointer
   (or a held finger) near the gap pulls them to their closest — and no closer. */
const RM = matchMedia("(prefers-reduced-motion: reduce)");
const ptr = { x: 0, y: 0, on: false };
let close = 0.35, last = 0, t0 = performance.now(), raf = 0;

function target(t) {
  const idle = 0.85 * (0.5 - 0.5 * Math.cos(t * TAU / 16));
  if (!ptr.on) return idle;
  const S = scene();
  const d = Math.hypot(ptr.x - S.cx, ptr.y - S.cy);
  return Math.max(idle, 1 - smooth(S.s * 0.4, S.s * 3.2, d));
}

function frame(now) {
  raf = 0;
  const t = (now - t0) / 1000, dt = Math.min(0.1, (now - last) / 1000 || 0);
  last = now;
  close += (target(t) - close) * (1 - Math.exp(-dt * 2.2));
  render(t, close, false);
  if (!RM.matches) raf = requestAnimationFrame(frame);
}

/* Reduced motion: one still frame, the hands near their closest, no shimmer. */
function still() { render(0, 0.8, true); }
function start() {
  if (raf) cancelAnimationFrame(raf), raf = 0;
  if (RM.matches) still(); else { last = performance.now(); raf = requestAnimationFrame(frame); }
}

let rz = 0;
function onResize() { clearTimeout(rz); rz = setTimeout(() => { layoutGrid(); if (RM.matches) still(); }, 60); }
addEventListener("resize", onResize);
RM.addEventListener("change", start);
const setPtr = e => { ptr.x = e.clientX; ptr.y = e.clientY; ptr.on = true; };
cv.addEventListener("pointermove", setPtr);
cv.addEventListener("pointerdown", setPtr);
cv.addEventListener("pointerleave", () => { ptr.on = false; });
cv.addEventListener("pointercancel", () => { ptr.on = false; });
cv.addEventListener("pointerup", e => { if (e.pointerType !== "mouse") ptr.on = false; });

/* ---------- ?selftest ----------
   The one promise the piece makes: the hands never touch. Rasterise each hand on
   its own at every closeness and check that no cell is inked by both, and that
   at least two dark cells always separate them along the line between the tips. */
function selftest() {
  const res = [];
  const ok = (c, m) => { res.push(c); console[c ? "log" : "error"]((c ? "PASS " : "FAIL ") + m); };
  let worst = Infinity, overlapAt = -1;
  for (let c = 0; c <= 1.0001; c += 0.05) for (const t of [0, 3.1, 7.7, 12.4]) {
    drawSource(t, c, false, "adam");
    const a = sx.getImageData(0, 0, cols, rows).data.slice();
    const L = drawSource(t, c, false, "god");
    const b = sx.getImageData(0, 0, cols, rows).data;
    for (let o = 0; o < a.length; o += 4) if (a[o] >= 14 && b[o] >= 14) { overlapAt = c; break; }
    /* dark run along the axis between the two placed tips */
    const ax = L.adam.at[0] * dpr / cw, ay = L.adam.at[1] * dpr / ch;
    const bx = L.god.at[0] * dpr / cw, by = L.god.at[1] * dpr / ch;
    const n = Math.ceil(Math.hypot(bx - ax, by - ay) * 2) + 1;
    const seen = new Set();
    for (let k = 0; k <= n; k++) {
      const x = Math.floor(lerp(ax, bx, k / n)), y = Math.floor(lerp(ay, by, k / n));
      const o = (y * cols + x) * 4;
      if (a[o] < 14 && b[o] < 14) seen.add(x + "," + y);
    }
    worst = Math.min(worst, seen.size);
  }
  ok(overlapAt < 0, "the hands never share a cell" + (overlapAt < 0 ? "" : " (overlap at closeness " + overlapAt.toFixed(2) + ")"));
  ok(worst >= 2, "at least two dark cells between the fingertips at their closest (min " + worst + ")");
  const L = place(0, 1, false);
  const on = p => p[0] >= 0 && p[0] <= W && p[1] >= 0 && p[1] <= H;
  ok(on(L.adam.at) && on(L.god.at), "both fingertips are on screen");
  console.log((res.every(Boolean) ? "SELFTEST PASS" : "SELFTEST FAIL") + " (" + W + "x" + H + ", " + cols + "x" + rows + " cells)");
}

layoutGrid();
if (Q.has("selftest")) selftest();
start();
</script>
