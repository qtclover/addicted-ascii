<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>addicted — almost</title>
<meta name="description" content="Adam's and God's hands from the Sistine ceiling, with the word addicted turning in the gap between them.">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" crossorigin>
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/loaders/GLTFLoader.js" crossorigin>
<link rel="preload" href="hands/addicted.glb" as="fetch" type="model/gltf-binary" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:wght@400&display=swap" rel="stylesheet">
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #stage { position: fixed; inset: 0; container-type: size; }

  /* ---------- layout, in CSS so the hands need no script to arrive ----------
     --word  the word's face-on width; the 3D is sized to it
     --hw    Adam's cut-out width (God's is the same scale: 1256/1269 of it)
     --dx/dy where each fingertip sits, off the centre
     --tilt  the arms' angle: level on a wide screen, a diagonal on a tall one */
  .scene {
    position: absolute; inset: 0;
    --word: min(30cqw, 62cqh);
    --gap: max(2.8cqw, 20px);
    --hw: min(42cqw, 105cqh);
    --dx: calc(var(--word) / 2 + var(--gap));
    --dy: 1.2cqh;                  /* on the ceiling God's finger sits a touch above Adam's */
    --tilt: 0deg;
  }
  /* A phone is the reference's native shape, and a level band there is a caption in a
     void. Turned onto a diagonal the arms get the screen's height to come in from:
     Adam from the lower left, God from the upper right, the word large between them.
     The fingertips sit off the word's corners, outside its turning box. */
  @container (max-aspect-ratio: 4/5) {
    .scene {
      --word: 58cqw;
      --hw: 135cqw;
      --dx: 15cqw;
      --dy: 25cqw;
      --tilt: -58deg;
    }
  }
  .hand { position: absolute; height: auto; pointer-events: none; user-select: none; -webkit-user-drag: none;
          rotate: var(--tilt); opacity: 0; transition: opacity 1.2s ease; }
  .hand.in { opacity: 1; }
  /* each cut-out pinned by its index fingertip (pixel positions printed by cutout.py) */
  #adam { width: var(--hw);
          left: calc(50cqw - var(--dx) - var(--hw) * 0.99291);              /* tip x 1260 / 1269 */
          top: calc(50cqh + var(--dy) - var(--hw) * 0.15603);               /* tip y  198 / 1269 */
          transform-origin: 99.291% 41.772%; }
  #god  { width: calc(var(--hw) * 0.98976);
          left: calc(50cqw + var(--dx) - var(--hw) * 0.98976 * 0.006369);   /* tip x    8 / 1256 */
          top: calc(50cqh - var(--dy) - var(--hw) * 0.98976 * 0.258758);    /* tip y  325 / 1256 */
          transform-origin: 0.637% 61.090%; }
  .tip { position: absolute; width: 0; height: 0; }
  #tipA { left: calc(50cqw - var(--dx)); top: calc(50cqh + var(--dy)); }
  #tipG { left: calc(50cqw + var(--dx)); top: calc(50cqh - var(--dy)); }
  #wordbox { position: absolute; left: 50cqw; top: 50cqh; width: var(--word); height: 0; }

  /* the faint light the word throws: sized here, only narrowed per frame as it turns */
  #glow { position: absolute; left: 50cqw; top: 50cqh; width: calc(var(--word) * 1.3); height: calc(var(--word) * .42);
          margin: calc(var(--word) * -.21) 0 0 calc(var(--word) * -.65); pointer-events: none; opacity: 0;
          background: radial-gradient(closest-side, rgba(255, 255, 255, .085), rgba(255, 255, 255, .03) 60%, transparent);
          transition: opacity 1.2s ease; will-change: transform; }
  #word { position: absolute; inset: 0; width: 100%; height: 100%; display: block; opacity: 0; transition: opacity .9s ease; }
  /* the word as type: until the 3D arrives, or instead of it */
  #still { position: absolute; left: 50cqw; top: 50cqh; margin: 0; translate: -50% -54%; white-space: nowrap;
           color: #f2f3f5; font: 400 calc(var(--word) / 3.6)/1 "Instrument Serif", Georgia, serif;
           opacity: 0; transition: opacity .6s ease; pointer-events: none; }
  #word.in, #still.in, #glow.in { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { .hand, #glow, #word, #still { transition: none; } }
</style>
<noscript><style>.hand, #still { opacity: 1; }</style></noscript>
</head>
<body>
<div id="stage">
  <div class="scene" role="img"
       aria-label="Adam's and God's hands from Michelangelo's Creation of Adam reach toward each other across a black field, and between their fingertips the word addicted turns slowly in glossy white.">
    <img class="hand" id="adam" src="hands/adam.webp" width="1269" height="474" alt="" decoding="async">
    <img class="hand" id="god" src="hands/god.webp" width="1256" height="532" alt="" decoding="async">
    <div class="tip" id="tipA"></div><div class="tip" id="tipG"></div><div id="wordbox"></div>
    <div id="glow"></div>
    <canvas id="word"></canvas>
    <p id="still" aria-hidden="true">addicted</p>
  </div>
</div>
<script>
"use strict";
/* ============================================================
   "almost" — Adam and God from the Sistine ceiling, the word
   turning in the gap. The hands are the fresco itself, cut out
   (hands/cutout.py) and placed by CSS; the word is a Blender
   model of the wordmark (hands/word.py) drawn live with three.js,
   loaded so that a slow or missing CDN costs the word its third
   dimension and nothing else.
   ?selftest  console checks
   ============================================================ */
const Q = new URLSearchParams(location.search);
const $ = id => document.getElementById(id);
const TAU = Math.PI * 2;
const SPIN = TAU / 5.4;          /* the reference's pace: edge-on twice every 5.4s */
const START = -0.35, STILL = -0.5;
const FOV = 20, DIST = 12;
const PIXEL_CAP = 8.3e6;         /* device pixels: a 4K screen's worth, so DPR 3 phones render 1:1 */
const RM = matchMedia("(prefers-reduced-motion: reduce)");

/* hands: each fades up the moment it has decoded, whatever the word is doing */
const handsReady = Promise.all(["adam", "god"].map(id => {
  const img = $(id);
  return img.decode().catch(() => {}).then(() => img.classList.add("in"));
}));

/* A word that reads backwards is not a word. Turn through the front half only and wrap
   at the edge-on moment, where the slab is a sliver and the jump is not there to see. */
const front = a => ((a + Math.PI / 2) % Math.PI + Math.PI) % Math.PI - Math.PI / 2;

let three = null;   /* set once the 3D is up */
const showStill = on => { $("still").classList.toggle("in", on); $("glow").classList.add("in"); };
/* slow network: the word as type after a beat, swapped for the 3D if that comes later */
const stillTimer = setTimeout(() => { if (!three) showStill(true); }, 2500);

async function loadWord() {
  /* dynamic, so a CDN that fails rejects here at once rather than silently never running */
  const [THREE, { GLTFLoader }, { MeshoptDecoder }] = await Promise.all([
    import("three"),
    import("three/addons/loaders/GLTFLoader.js"),
    import("three/addons/libs/meshopt_decoder.module.js")
  ]);
  const canvas = $("word");
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true,
                                             powerPreference: "high-performance", preserveDrawingBuffer: Q.has("selftest") });
  renderer.setClearColor(0x000000, 0);
  renderer.toneMapping = THREE.NeutralToneMapping;   /* keeps a white white */

  /* The studio the word reflects: black, with hard softboxes and strips. Its gloss is
     those lights sliding across the faces as it turns; an evenly lit room would only
     make it grey. Built once, prefiltered once. */
  const studio = new THREE.Scene();
  const panel = (w, h, x, y, z, k) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ side: THREE.DoubleSide }));
    m.material.color.setScalar(k);
    m.position.set(x, y, z); m.lookAt(0, 0, 0);
    studio.add(m);
  };
  panel(7, 1.6, 0, 5.5, 1.5, 4.0);      /* overhead softbox: the top edges and bevels */
  panel(0.7, 6, -5.5, 0.5, 2.5, 5.0);   /* tall strip, left: the streak that sweeps the faces */
  panel(0.5, 6, 5.5, 0.5, 1.0, 3.0);    /* thinner strip, right */
  panel(2.2, 1.4, -1.5, 2.2, 6, 1.6);   /* small key, front left */
  panel(4, 0.5, 0, 1.5, -6, 2.0);       /* back strip: an edge light without a colour cast */
  /* Narrow uprights in front, where the flat faces look. A face turning by θ swings its
     reflection by 2θ, so each strip crosses the word as a streak once a pass. */
  panel(0.35, 9, -2.6, 0.5, 9, 7.0);
  panel(0.25, 9, 3.4, 0.5, 8.5, 5.0);
  panel(0.5, 9, -7.5, 0.5, 6, 4.0);
  const pmrem = new THREE.PMREMGenerator(renderer);
  const env = pmrem.fromScene(studio, 0.015).texture;
  pmrem.dispose();

  const scene = new THREE.Scene();
  scene.environment = env;
  scene.add(new THREE.HemisphereLight(0xffffff, 0x202020, 1.9));
  const key = new THREE.DirectionalLight(0xffffff, 1.8); key.position.set(-3, 4, 3); scene.add(key);
  const back = new THREE.DirectionalLight(0xffffff, 0.6); back.position.set(2, 1, -4); scene.add(back);
  const camera = new THREE.PerspectiveCamera(FOV, 1, 0.1, 100);
  camera.position.set(0, 0, DIST);

  const gltf = await new GLTFLoader().setMeshoptDecoder(MeshoptDecoder).loadAsync("hands/addicted.glb");
  const word = gltf.scene;
  word.traverse(o => {
    if (o.isMesh) o.material = new THREE.MeshPhysicalMaterial({
      color: 0xffffff, roughness: 0.1, metalness: 0, clearcoat: 1, clearcoatRoughness: 0.03
    });
  });
  const modelW = new THREE.Box3().setFromObject(word).getSize(new THREE.Vector3()).x;
  scene.add(word);

  /* face-on, the model spans exactly the width the layout left for it */
  const fit = () => {
    const vw = canvas.clientWidth, vh = canvas.clientHeight;
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 3, Math.sqrt(PIXEL_CAP / (vw * vh))));
    renderer.setSize(vw, vh, false);
    camera.aspect = vw / vh;
    camera.updateProjectionMatrix();
    const unitsPerPx = 2 * DIST * Math.tan(FOV * Math.PI / 360) * camera.aspect / vw;
    word.scale.setScalar($("wordbox").getBoundingClientRect().width * unitsPerPx / modelW);
  };
  const glow = $("glow");
  const draw = angle => {
    word.rotation.y = angle;
    glow.style.transform = "scaleX(" + (0.3 + 0.7 * Math.abs(Math.cos(angle))).toFixed(3) + ")";
    renderer.render(scene, camera);
  };
  return { THREE, renderer, camera, word, fit, draw };
}

let raf = 0, t0 = 0;
function frame(now) {
  raf = 0;
  three.draw(front(START + (now - t0) / 1000 * SPIN));
  if (!RM.matches) raf = requestAnimationFrame(frame);
}
function start() {
  if (raf) cancelAnimationFrame(raf), raf = 0;
  if (!three) return;
  if (RM.matches) three.draw(STILL);
  else { t0 = performance.now(); raf = requestAnimationFrame(frame); }
}
addEventListener("resize", () => { if (three) { three.fit(); if (RM.matches) three.draw(STILL); } });
RM.addEventListener("change", start);

loadWord().then(t => {
  three = t;
  clearTimeout(stillTimer);
  three.fit();
  three.draw(RM.matches ? STILL : START);
  $("word").classList.add("in");
  showStill(false);
  start();
  if (Q.has("selftest")) selftest();
}).catch(e => {
  console.error("3D word unavailable, showing it as type:", e);
  clearTimeout(stillTimer);
  showStill(true);
});

/* ---------- ?selftest ----------
   The word turns between the fingertips without reaching either: project its bounds
   through the whole turn and keep each tip outside them. Then the hands and the word
   must actually be on the screen, and the word must never be shown mirrored. */
async function selftest() {
  const { THREE, camera, word, renderer, draw } = three;
  const res = [], ok = (c, m) => { res.push(c); console[c ? "log" : "error"]((c ? "PASS " : "FAIL ") + m); };
  const vw = renderer.domElement.clientWidth, vh = renderer.domElement.clientHeight;
  const pt = id => { const r = $(id).getBoundingClientRect(); return [r.left, r.top]; };
  const A = pt("tipA"), G = pt("tipG");
  const box = new THREE.Box3(), v = new THREE.Vector3();
  let worst = Infinity;
  for (let i = 0; i < 360; i++) {
    word.rotation.y = front(i * TAU / 360); word.updateMatrixWorld(true);
    box.setFromObject(word, true);
    let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
    for (let c = 0; c < 8; c++) {
      v.set(c & 1 ? box.max.x : box.min.x, c & 2 ? box.max.y : box.min.y, c & 4 ? box.max.z : box.min.z).project(camera);
      const x = (v.x + 1) / 2 * vw, y = (1 - v.y) / 2 * vh;
      x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y);
    }
    /* how far outside the box each tip is (negative = inside) */
    for (const [x, y] of [A, G]) worst = Math.min(worst, Math.max(x0 - x, x - x1, y0 - y, y - y1));
  }
  ok(worst > 4, "the turning word never reaches a fingertip (closest " + worst.toFixed(1) + "px outside its bounds)");
  let mirrored = 0;
  for (let i = 0; i < 1000; i++) if (Math.cos(front(i * 0.0371)) < -1e-9) mirrored++;
  ok(mirrored === 0, "the word only ever shows its front");
  await handsReady;
  ok($("adam").naturalWidth === 1269 && $("god").naturalWidth === 1256, "both hands decoded at full size");
  const seen = id => { const r = $(id).getBoundingClientRect(); return r.right > vw * 0.05 && r.left < vw * 0.95 && r.bottom > 0 && r.top < vh; };
  ok(seen("adam") && seen("god"), "both hands are on screen");
  draw(0);
  const gl = renderer.getContext(), px = new Uint8Array(4), dpr = renderer.getPixelRatio();
  const wb = $("wordbox").getBoundingClientRect();
  let ink = 0;
  for (let i = 0; i < 60; i++) {
    gl.readPixels(Math.round((wb.left + wb.width * (0.05 + 0.9 * i / 59)) * dpr), Math.round((vh - wb.top) * dpr), 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
    ink = Math.max(ink, px[3]);
  }
  ok(ink > 200, "the word renders (alpha " + ink + ")");
  ok(Math.abs(dpr - Math.min(devicePixelRatio, 3, Math.sqrt(PIXEL_CAP / (vw * vh)))) < 1e-6, "renders at the device's pixel ratio (" + dpr.toFixed(2) + ")");
  console.log((res.every(Boolean) ? "SELFTEST PASS" : "SELFTEST FAIL") + " (" + vw + "x" + vh + " @" + devicePixelRatio + ")");
  start();
}
</script>
</body>
</html>
