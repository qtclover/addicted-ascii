<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>addicted — almost</title>
<meta name="description" content="Two sculpted hands reach for each other while the word addicted turns between them.">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:wght@400&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  /* shown only when WebGL2 is missing: the word, still, where it would have turned */
  #fallback { position: fixed; inset: 0; display: none; place-items: center; margin: 0;
              color: #e9edf3; font: 400 clamp(48px, 14vw, 160px)/1 "Instrument Serif", Georgia, serif; }
  .no-gl #fallback { display: grid; }
  .no-gl canvas { display: none; }
</style>
</head>
<body>
<canvas id="c" role="img"
  aria-label="Two sculpted hands reach toward each other from opposite sides, after Michelangelo's Creation of Adam, while the word addicted slowly turns in the gap between their fingertips."></canvas>
<p id="fallback" aria-hidden="true">addicted</p>
<script>
"use strict";
/* ============================================================
   "almost" — the Creation of Adam gap, with the wordmark turning
   in it. One fragment shader, no libraries:
     · the hands are signed distance fields — smooth-blended
       tapered capsules, posed here in JS — raymarched once per
       resize into a texture, since they never move;
     · the word is the wordmark's own font drawn to a canvas,
       turned into a 2D distance field, and extruded in the
       shader with rounded edges, so it can spin every frame for
       the cost of a few dozen steps over the middle of the screen.
   ?color=ff6a4d  word colour (hex)      ?selftest  console checks
   ============================================================ */

const Q = new URLSearchParams(location.search);
const TAU = Math.PI * 2;
const hex = (h, d) => /^[0-9a-f]{6}$/i.test(h || "") ? [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16) / 255) : d;

const PARAMS = {
  word: "addicted",
  /* glossy porcelain with the main page's cold tint in it, and that tint for the glow */
  color: hex(Q.get("color"), [0.86, 0.89, 0.94]),
  glow:  [0.24, 0.55, 1.0],
  spin: TAU / 5.4,          /* rad/s: edge-on twice every 5.4s, the reference's pace */
  fov: 30 * Math.PI / 180,
  wordHalf: 1.3,            /* the word's half-width, in world units (a palm is 0.82) */
  depth: 0.14,              /* half the extrusion */
  round: 0.018,             /* edge bevel radius */
  maxDpr: 2,
  handPixels: 2.4e6         /* cap on the one-off hand render: a phone at 3x gets 2.4MP, not 7 */
};
const P = PARAMS;

/* ---------- the hands ----------
   One hand, described once: a LEFT hand, wrist at the origin, fingers along +x,
   palm facing -y, thumb toward +z (the camera). The right hand is its mirror.
   Units are one palm length. Flexion angles curl a finger toward the palm and are
   cumulative per joint; `splay` fans it sideways. */
const BASE = {
  knuckles: { index: [0.92, 0.00, 0.26], middle: [0.96, 0.01, 0.085], ring: [0.92, 0.00, -0.09], pinky: [0.82, -0.03, -0.25] },
  lengths:  { index: [0.43, 0.26, 0.21], middle: [0.48, 0.29, 0.23], ring: [0.44, 0.27, 0.21], pinky: [0.35, 0.21, 0.19] },
  radii:    { index: [0.100, 0.089, 0.080, 0.066], middle: [0.103, 0.092, 0.082, 0.068],
              ring:  [0.096, 0.085, 0.076, 0.064], pinky:  [0.085, 0.075, 0.067, 0.057] }
};
const POSES = {
  /* Adam: the wrist gives, the fingers hang, the index only half-lifts */
  adam: {
    wrist: 0.30, pitch: 0.16, roll: 0.55,
    flex:  { index: [0.12, 0.18, 0.12], middle: [0.42, 0.50, 0.35], ring: [0.52, 0.55, 0.40], pinky: [0.60, 0.55, 0.40] },
    splay: { index: 0.06, middle: 0.01, ring: -0.06, pinky: -0.13 },
    thumb: [[0.55, 0.28, 0.30], [0.30, 0.38, 0.22], [0.15, 0.45, 0.19]],
    tone: [0.80, 0.66, 0.47]
  },
  /* God: arm level, index locked straight, the rest folding under it */
  god: {
    wrist: 0.04, pitch: -0.05, roll: 0.42,
    flex:  { index: [0.00, 0.03, 0.02], middle: [0.55, 0.75, 0.55], ring: [0.72, 0.85, 0.55], pinky: [0.85, 0.85, 0.55] },
    splay: { index: 0.02, middle: -0.02, ring: -0.08, pinky: -0.15 },
    thumb: [[0.80, 0.25, 0.30], [0.35, 0.20, 0.23], [0.10, 0.15, 0.20]],
    tone: [0.84, 0.77, 0.64]
  }
};
const FINGERS = ["pinky", "ring", "middle", "index"];

/* Pose one hand into capsules: [a, ra, b, rb, blend] in its own frame, plus the index tip. */
function skeleton(pose) {
  const segs = [], add = (a, ra, b, rb, k) => segs.push({ a, ra, b, rb, k });
  /* forearm: two parallel tubes melted together, so the wrist is wide and flat */
  const back = [-Math.cos(pose.wrist), -Math.sin(pose.wrist)];
  for (const z of [-0.1, 0.1]) add([0, 0, z], 0.165, [back[0] * 5, back[1] * 5, z * 1.3], 0.27, 0.12);
  add([0.03, 0, -0.17], 0.13, [0.03, 0, 0.17], 0.13, 0.12);                       /* across the wrist */
  add([0.16, -0.06, 0.22], 0.15, [0.42, -0.09, 0.35], 0.11, 0.12);                /* ball of the thumb */
  const K = BASE.knuckles;
  for (const f of FINGERS) add([0.1, 0, K[f][2] * 0.55], 0.13, K[f], 0.11, 0.14); /* metacarpals */
  add(K.index, 0.09, K.pinky, 0.08, 0.08);                                         /* knuckle ridge */
  let tip = null;
  for (const f of FINGERS) {
    let p = K[f], phi = 0;
    const sp = pose.splay[f], L = BASE.lengths[f], R = BASE.radii[f];
    for (let j = 0; j < 3; j++) {
      phi += pose.flex[f][j];
      const d = [Math.cos(phi) * Math.cos(sp), -Math.sin(phi), Math.cos(phi) * Math.sin(sp)];
      const q = [p[0] + d[0] * L[j], p[1] + d[1] * L[j], p[2] + d[2] * L[j]];
      /* the first bone melts into the palm; the outer two stay crisp, or curled
         fingers touching their neighbours would web together */
      add(p, R[j], q, R[j + 1], j === 0 ? 0.05 : 0.012);
      if (f === "index" && j === 2) tip = [q[0] + d[0] * R[3], q[1] + d[1] * R[3], q[2] + d[2] * R[3]];
      p = q;
    }
  }
  /* thumb: yaw (toward the camera), pitch (down), length per bone */
  let p = [0.30, -0.08, 0.30];
  const TR = [0.12, 0.105, 0.092, 0.075];
  pose.thumb.forEach(([yaw, pitch, len], j) => {
    const d = [Math.cos(pitch) * Math.cos(yaw), -Math.sin(pitch), Math.cos(pitch) * Math.sin(yaw)];
    const q = [p[0] + d[0] * len, p[1] + d[1] * len, p[2] + d[2] * len];
    add(p, TR[j], q, TR[j + 1], j === 0 ? 0.08 : 0.015);
    p = q;
  });
  return { segs, tip };
}

/* Place a hand so its index fingertip lands on `at`: tilt the back toward the camera
   (roll), angle the whole arm (pitch), mirror for the right hand, scale. */
function placeHand(pose, at, s, mirror) {
  const { segs, tip } = skeleton(pose);
  const cr = Math.cos(pose.roll), sr = Math.sin(pose.roll), cp = Math.cos(pose.pitch), spp = Math.sin(pose.pitch);
  const xf = v => {
    let x = v[0] - tip[0], y = v[1] - tip[1], z = v[2] - tip[2];
    [y, z] = [y * cr - z * sr, y * sr + z * cr];          /* roll about x: back of hand toward camera */
    [x, y] = [x * cp - y * spp, x * spp + y * cp];         /* pitch about z */
    return [at[0] + (mirror ? -x : x) * s, at[1] + y * s, at[2] + z * s];
  };
  return segs.map(g => ({ a: xf(g.a), ra: g.ra * s, b: xf(g.b), rb: g.rb * s, k: g.k * s }));
}

/* ---------- layout ----------
   World units: the word is two wide (half-width 1). The fingertips stop short of it
   by a margin, so however it turns, nothing it does can reach them. */
let L = null;
function layout(aspect, txt) {
  const gap = 0.34, s = 0.92;
  const tipX = P.wordHalf + gap;
  const adam = placeHand(POSES.adam, [-tipX, -0.02, 0], s, false);
  const god  = placeHand(POSES.god,  [ tipX,  0.02, 0], s, true);
  /* show both hands to the wrist and a little arm; a portrait screen gets the same
     band, a little tighter, rather than a smaller one */
  const halfVis = aspect < 1 ? 3.2 : 4.0;
  const t = Math.tan(P.fov / 2);
  const dist = halfVis / (t * aspect);
  return { adam, god, tipX, gap, s, dist, halfVis, txt };
}

/* ---------- the word, as a distance field ---------- */
async function fontReady() {
  try {
    await Promise.race([document.fonts.load('300px "Instrument Serif"'), new Promise(r => setTimeout(r, 1500))]);
  } catch (e) { /* offline: Georgia stands in */ }
}
/* Felzenszwalb & Huttenlocher's exact squared distance transform, one axis at a time */
function edt(grid, w, h) {
  const n = Math.max(w, h), f = new Float64Array(n), d = new Float64Array(n), v = new Int32Array(n), z = new Float64Array(n + 1);
  const pass = (len, get, set) => {
    for (let q = 0; q < len; q++) f[q] = get(q);
    let k = 0; v[0] = 0; z[0] = -Infinity; z[1] = Infinity;
    for (let q = 1; q < len; q++) {
      let s;
      do { const r = v[k]; s = ((f[q] + q * q) - (f[r] + r * r)) / (2 * q - 2 * r); } while (s <= z[k] && --k >= 0);
      k++; v[k] = q; z[k] = s; z[k + 1] = Infinity;
    }
    k = 0;
    for (let q = 0; q < len; q++) { while (z[k + 1] < q) k++; const r = v[k]; d[q] = (q - r) * (q - r) + f[r]; }
    for (let q = 0; q < len; q++) set(q, d[q]);
  };
  for (let x = 0; x < w; x++) pass(h, y => grid[y * w + x], (y, val) => { grid[y * w + x] = val; });
  for (let y = 0; y < h; y++) pass(w, x => grid[y * w + x], (x, val) => { grid[y * w + x] = val; });
}
function wordField() {
  const fs = 720, face = '"Instrument Serif", Georgia, "Times New Roman", serif';
  const m = document.createElement("canvas").getContext("2d");
  m.font = fs + "px " + face;
  const met = m.measureText(P.word);
  const inkL = met.actualBoundingBoxLeft || 0, inkR = met.actualBoundingBoxRight || met.width;
  const asc = met.actualBoundingBoxAscent || fs * 0.7, desc = met.actualBoundingBoxDescent || fs * 0.05;
  const pad = Math.round(fs * 0.16), stroke = fs * 0.03;
  const w = Math.ceil(inkL + inkR + pad * 2), h = Math.ceil(asc + desc + pad * 2);
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const g = c.getContext("2d");
  g.font = m.font; g.fillStyle = g.strokeStyle = "#fff"; g.lineJoin = "round";
  /* a touch of stroke: the face is a fine display serif, and a hairline extruded is a wire */
  g.lineWidth = stroke;
  g.fillText(P.word, pad + inkL, pad + asc); g.strokeText(P.word, pad + inkL, pad + asc);
  const a = g.getImageData(0, 0, w, h).data, N = w * h;
  const out = new Float64Array(N), inn = new Float64Array(N);
  /* seeded from coverage, not a threshold: an edge pixel half inked starts half a pixel
     from the contour. A binary mask stair-steps, and the steps show on every wall */
  for (let i = 0; i < N; i++) {
    const c = a[i * 4 + 3] / 255;
    out[i] = c >= 1 ? 0 : c <= 0 ? 1e20 : Math.max(0, 0.5 - c) ** 2;
    inn[i] = c >= 1 ? 1e20 : c <= 0 ? 0 : Math.max(0, c - 0.5) ** 2;
  }
  edt(out, w, h); edt(inn, w, h);
  /* signed, in world units: the word's half-width is P.wordHalf */
  const k = 2 * P.wordHalf / w, sd = new Float32Array(N), raw = new Float32Array(N);
  for (let i = 0; i < N; i++) raw[i] = Math.sqrt(out[i]) - Math.sqrt(inn[i]);
  /* A distance transform over pixel centres has contours made of tiny arcs, and
     bilinear filtering kinks the gradient at every texel row; lit at a glance along a
     wall, both read as ribbing. Two 3x3 box passes (a tent, 5 px wide) take the ribs
     out; on a distance field that is a fraction of a texel of rounding at corners. */
  const box = (src, dst, scale) => {
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      let sum = 0, n = 0;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        const xx = x + dx, yy = y + dy;
        if (xx >= 0 && xx < w && yy >= 0 && yy < h) { sum += src[yy * w + xx]; n++; }
      }
      dst[y * w + x] = sum / n * scale;
    }
  };
  const mid = new Float32Array(N);
  box(raw, mid, 1); box(mid, sd, k);
  return { w, h, sd, half: [P.wordHalf, P.wordHalf * h / w] };
}

/* ---------- GL ---------- */
const NSEG = 48;   /* both hands; uniform budget is 2 vec4 per capsule + blends */
const VS = `#version 300 es
void main(){ vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2); gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0); }`;
const FS = `#version 300 es
precision highp float;
out vec4 o;
uniform vec2 uRes;
uniform int uPass;            // 0: hands into the cache. 1: cache + word to the screen
uniform float uDist, uFocal;
uniform vec4 uA[${NSEG}], uB[${NSEG}], uK[${NSEG / 4}];
uniform int uHalf;            // capsules per hand
uniform vec3 uToneL, uToneR;
uniform sampler2D uHands, uWord;
uniform vec3 uWordBox;        // half-width, half-height, half-depth
uniform float uRound, uAngle;
uniform vec3 uColor, uGlow;

float smin(float a, float b, float k){
  if (k <= 0.0) return min(a, b);
  float h = max(k - abs(a - b), 0.0) / k;
  return min(a, b) - h * h * k * 0.25;
}
/* Inigo Quilez's round cone: a capsule whose two ends have different radii */
float roundCone(vec3 p, vec3 a, vec3 b, float r1, float r2){
  vec3 ba = b - a; float l2 = dot(ba, ba); float rr = r1 - r2; float a2 = l2 - rr * rr; float il2 = 1.0 / l2;
  vec3 pa = p - a; float y = dot(pa, ba); float z = y - l2;
  vec3 xv = pa * l2 - ba * y; float x2 = dot(xv, xv); float y2 = y * y * l2; float z2 = z * z * l2;
  float k = sign(rr) * rr * rr * x2;
  if (sign(z) * a2 * z2 > k) return sqrt(x2 + z2) * il2 - r2;
  if (sign(y) * a2 * y2 < k) return sqrt(x2 + y2) * il2 - r1;
  return (sqrt(x2 * a2 * il2) + y * rr) * il2 - r1;
}
float blendOf(int i){ vec4 v = uK[i >> 2]; int j = i & 3; return j == 0 ? v.x : j == 1 ? v.y : j == 2 ? v.z : v.w; }

/* Only the hand on this side of the gap is evaluated; the other is further than the
   centre plane, which bounds it. Halves the work, changes nothing. */
float hands(vec3 p){
  int base = p.x < 0.0 ? 0 : uHalf;
  float d = 1e5;
  for (int i = 0; i < ${NSEG / 2}; i++) {
    if (i >= uHalf) break;
    int k = base + i;
    d = smin(d, roundCone(p, uA[k].xyz, uB[k].xyz, uA[k].w, uB[k].w), blendOf(k));
  }
  return min(d, abs(p.x) + 1.0);
}
vec3 handNormal(vec3 p){
  const vec2 e = vec2(1.0, -1.0) * 0.0015;
  return normalize(e.xyy * hands(p + e.xyy) + e.yyx * hands(p + e.yyx) + e.yxy * hands(p + e.yxy) + e.xxx * hands(p + e.xxx));
}
float softShadow(vec3 p, vec3 l){
  float r = 1.0, t = 0.02;
  for (int i = 0; i < 40; i++) {
    float h = hands(p + l * t);
    r = min(r, 10.0 * h / t);
    t += clamp(h, 0.01, 0.2);
    if (r < 0.002 || t > 3.0) break;
  }
  return clamp(r, 0.0, 1.0);
}
float occlusion(vec3 p, vec3 n){
  float a = 0.0, w = 1.0;
  for (int i = 1; i <= 5; i++) { float h = 0.025 * float(i); a += w * (h - hands(p + n * h)); w *= 0.7; }
  return clamp(1.0 - 3.0 * a, 0.0, 1.0);
}

/* Bilinear by hand. The sampler's own filter blends with 8-bit weights, which is
   nothing to a colour and a staircase to a distance field once normals are taken
   from it: the word's walls came out finely ribbed. Four fetches, full precision. */
float field(vec2 uv){
  ivec2 sz = textureSize(uWord, 0);
  vec2 px = uv * vec2(sz) - 0.5;
  ivec2 i = ivec2(floor(px)), hi = sz - 1;
  vec2 f = px - floor(px);
  float a = texelFetch(uWord, clamp(i, ivec2(0), hi), 0).r;
  float b = texelFetch(uWord, clamp(i + ivec2(1, 0), ivec2(0), hi), 0).r;
  float c = texelFetch(uWord, clamp(i + ivec2(0, 1), ivec2(0), hi), 0).r;
  float d = texelFetch(uWord, clamp(i + ivec2(1, 1), ivec2(0), hi), 0).r;
  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}
float word(vec3 p){
  float c = cos(uAngle), s = sin(uAngle);
  vec3 q = vec3(c * p.x + s * p.z, p.y, -s * p.x + c * p.z);
  vec2 hb = uWordBox.xy;
  vec2 cl = clamp(q.xy, -hb, hb);
  vec2 uv = vec2(cl.x / (2.0 * hb.x) + 0.5, 0.5 - cl.y / (2.0 * hb.y));
  float d2 = field(uv) + length(q.xy - cl);
  vec2 w = vec2(d2 + uRound, abs(q.z) - uWordBox.z + uRound);
  return min(max(w.x, w.y), 0.0) + length(max(w, 0.0)) - uRound;
}
vec3 wordNormal(vec3 p){
  const vec2 e = vec2(1.0, -1.0) * 0.006;   /* several texels wide, so the gradient averages them */
  return normalize(e.xyy * word(p + e.xyy) + e.yyx * word(p + e.yyx) + e.yxy * word(p + e.yxy) + e.xxx * word(p + e.xxx));
}

vec3 rayDir(){ return normalize(vec3((gl_FragCoord.xy - 0.5 * uRes) / uFocal, -1.0)); }

void main(){
  vec3 ro = vec3(0.0, 0.0, uDist), rd = rayDir();
  vec2 uv = gl_FragCoord.xy / uRes;

  if (uPass == 0) {
    vec3 col = vec3(0.0);
    float t = uDist - 4.0, d;
    bool hit = false;
    for (int i = 0; i < 200; i++) {
      d = hands(ro + rd * t);
      if (d < 0.0006 * t) { hit = true; break; }
      t += d * 0.9;
      if (t > uDist + 6.0) break;
    }
    if (hit) {
      vec3 p = ro + rd * t, n = handNormal(p);
      vec3 base = p.x < 0.0 ? uToneL : uToneR;
      vec3 key = normalize(vec3(-0.25, 0.85, 0.45));
      float dif = clamp(dot(n, key), 0.0, 1.0);
      float wrap = clamp((dot(n, key) + 0.35) / 1.35, 0.0, 1.0);   /* light bleeding round the form: skin, not stone */
      float sh = softShadow(p + n * 0.004, key);
      float ao = occlusion(p, n);
      float fill = clamp(0.5 + 0.5 * dot(n, normalize(vec3(0.3, -0.2, 1.0))), 0.0, 1.0);
      float rim = pow(clamp(1.0 + dot(n, rd), 0.0, 1.0), 3.0);
      vec3 h = normalize(key - rd);
      float spe = pow(clamp(dot(n, h), 0.0, 1.0), 28.0) * 0.18;
      col  = base * (1.15 * vec3(1.0, 0.96, 0.88) * mix(wrap * 0.35, dif, 0.75) * sh);
      col += base * vec3(0.55, 0.42, 0.32) * (1.0 - sh) * wrap * 0.18;       /* warm bounce in the shadow side */
      col += base * vec3(0.20, 0.22, 0.27) * fill * ao;
      col += vec3(0.30, 0.36, 0.45) * rim * ao * 0.35;
      col += spe * sh;
      /* the arms go into the dark toward the edges */
      col *= 1.0 - smoothstep(3.3, 5.6, abs(p.x));
    }
    o = vec4(pow(col, vec3(1.0 / 2.2)), 1.0);
    return;
  }

  vec3 col = texture(uHands, uv).rgb;

  /* the word: bounded by a sphere round its centre, widened for the glow */
  float R = length(uWordBox), G = 0.55;
  float b = dot(ro, rd), c = dot(ro, ro) - (R + G) * (R + G), disc = b * b - c;
  if (disc > 0.0) {
    float sq = sqrt(disc), t = -b - sq, t1 = -b + sq, near = 1e5, d;
    bool hit = false;
    for (int i = 0; i < 160; i++) {
      d = word(ro + rd * t);
      near = min(near, d);
      if (d < 0.0003) { hit = true; break; }
      /* a coarse floor on the step lets a grazing ray land a varying depth inside
         the wall, row by row, and the walls come out ribbed */
      t += max(d * 0.85, 0.0003);
      if (t > t1) break;
    }
    if (hit) {
      vec3 p = ro + rd * t, n = wordNormal(p);
      vec3 key = normalize(vec3(-0.35, 0.8, 0.55));
      float dif = clamp(dot(n, key), 0.0, 1.0);
      vec3 h = normalize(key - rd);
      float spe = pow(clamp(dot(n, h), 0.0, 1.0), 90.0);
      float fre = 0.04 + 0.96 * pow(clamp(1.0 + dot(n, rd), 0.0, 1.0), 5.0);
      vec3 r = reflect(rd, n);
      /* a studio, reflected: soft box overhead, dark floor, a cool strip low on the left */
      vec3 env = vec3(0.015) + vec3(1.0) * smoothstep(0.15, 0.85, r.y) * 0.9
               + uGlow * 0.5 * smoothstep(0.75, 1.0, dot(r, normalize(vec3(-0.8, -0.15, 0.4))));
      vec3 lin = uColor * (0.10 + 0.85 * dif) + env * mix(0.12, 0.9, fre) + spe * 1.3;
      lin += uColor * uGlow * 0.12;
      col = pow(lin, vec3(1.0 / 2.2));
    } else {
      col += uGlow * 0.30 * exp(-near * 9.0);
    }
  }
  col *= 1.0 - 0.45 * pow(length(uv - 0.5) * 1.25, 2.6);
  o = vec4(col, 1.0);
}`;

const cv = document.getElementById("c");
const gl = cv.getContext("webgl2", { antialias: false, alpha: false, preserveDrawingBuffer: Q.has("selftest") });
let prog, U = {}, cacheTex = null, fbo = null, wordTex = null, field = null;
let W = 0, H = 0, dpr = 1;

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
function setupGL() {
  prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);
  for (const n of ["uRes", "uPass", "uDist", "uFocal", "uA", "uB", "uK", "uHalf", "uToneL", "uToneR", "uHands", "uWord",
                   "uWordBox", "uRound", "uAngle", "uColor", "uGlow"]) U[n] = gl.getUniformLocation(prog, n);
  gl.bindVertexArray(gl.createVertexArray());
}
function uploadWord(f) {
  wordTex = gl.createTexture();
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, wordTex);
  gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
  /* half floats: 8-bit distances would step the bevel. Read with texelFetch and
     filtered in the shader, so NEAREST is all the sampler needs */
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.R16F, f.w, f.h, 0, gl.RED, gl.FLOAT, f.sd);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.uniform1i(U.uWord, 1);
}

/* Resize: lay the scene out for this aspect, then render the hands once into the cache. */
function resize() {
  const r = cv.getBoundingClientRect();
  const cw = Math.max(1, Math.round(r.width) || innerWidth), ch = Math.max(1, Math.round(r.height) || innerHeight);
  dpr = Math.min(P.maxDpr, window.devicePixelRatio || 1);
  if (cw * ch * dpr * dpr > P.handPixels) dpr = Math.sqrt(P.handPixels / (cw * ch));
  W = Math.round(cw * dpr); H = Math.round(ch * dpr);
  cv.width = W; cv.height = H;
  L = layout(cw / ch, field.half);

  const segs = [...L.adam, ...L.god], half = L.adam.length;
  if (segs.length > NSEG || L.god.length !== half) throw new Error("capsule budget: " + segs.length + " > " + NSEG);
  const A = new Float32Array(NSEG * 4), B = new Float32Array(NSEG * 4), K = new Float32Array(NSEG);
  segs.forEach((g, i) => { A.set([...g.a, g.ra], i * 4); B.set([...g.b, g.rb], i * 4); K[i] = g.k; });

  gl.useProgram(prog);
  gl.uniform2f(U.uRes, W, H);
  gl.uniform1f(U.uDist, L.dist);
  gl.uniform1f(U.uFocal, (H / 2) / Math.tan(P.fov / 2));
  gl.uniform4fv(U.uA, A); gl.uniform4fv(U.uB, B); gl.uniform4fv(U.uK, K);
  gl.uniform1i(U.uHalf, half);
  gl.uniform3fv(U.uToneL, POSES.adam.tone.map(v => v * v));   /* tones are sRGB-ish; light in linear */
  gl.uniform3fv(U.uToneR, POSES.god.tone.map(v => v * v));
  gl.uniform3f(U.uWordBox, field.half[0], field.half[1], P.depth);
  gl.uniform1f(U.uRound, P.round);
  gl.uniform3fv(U.uColor, P.color.map(v => Math.pow(v, 2.2)));
  gl.uniform3fv(U.uGlow, P.glow);

  if (!cacheTex) { cacheTex = gl.createTexture(); fbo = gl.createFramebuffer(); }
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, cacheTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, W, H, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, cacheTex, 0);
  gl.viewport(0, 0, W, H);
  /* the hands pass never reads the cache, but a sampler pointed at the texture being
     drawn into is a feedback loop and the draw is dropped: aim it at the word meanwhile */
  gl.uniform1i(U.uHands, 1);
  gl.uniform1i(U.uPass, 0);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.uniform1i(U.uHands, 0);
}

function draw(angle) {
  gl.viewport(0, 0, W, H);
  gl.uniform1i(U.uPass, 1);
  gl.uniform1f(U.uAngle, angle);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

/* ---------- motion ---------- */
const RM = matchMedia("(prefers-reduced-motion: reduce)");
const STILL = -0.5;          /* reduced motion: one frame, the word at three-quarters */
let raf = 0, t0 = performance.now();
function frame(now) {
  raf = 0;
  draw(-0.35 + (now - t0) / 1000 * P.spin);
  if (!RM.matches) raf = requestAnimationFrame(frame);
}
function start() {
  if (raf) cancelAnimationFrame(raf), raf = 0;
  if (RM.matches) draw(STILL); else raf = requestAnimationFrame(frame);
}
let rz = 0;
addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { resize(); if (RM.matches) draw(STILL); }, 80); });
RM.addEventListener("change", start);

/* ---------- ?selftest ----------
   The piece promises two things: the word turns in the gap without ever reaching a
   finger, and both hands and the word actually reach the screen. */
function selftest() {
  const res = [], ok = (c, m) => { res.push(c); console[c ? "log" : "error"]((c ? "PASS " : "FAIL ") + m); };
  /* the word's furthest reach in x at any angle is its bounding radius in the xz plane */
  const reach = Math.hypot(field.half[0], P.depth);
  let nearest = Infinity;
  for (const g of [...L.adam, ...L.god]) for (const [p, r] of [[g.a, g.ra], [g.b, g.rb]])
    if (Math.abs(p[1]) < field.half[1] + r) nearest = Math.min(nearest, Math.abs(p[0]) - r);
  ok(nearest > reach, "no finger is inside the word's turning circle (" + nearest.toFixed(3) + " > " + reach.toFixed(3) + ")");
  ok(L.adam.length + L.god.length <= NSEG, "capsules fit the uniform budget (" + (L.adam.length + L.god.length) + "/" + NSEG + ")");
  /* read back a frame with the word face-on */
  draw(0);
  const px = new Uint8Array(4), at = (fx, fy) => { gl.readPixels(Math.round(W * fx), Math.round(H * fy), 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px); return px[0] + px[1] + px[2]; };
  const proj = x => 0.5 + x / (2 * L.halfVis);       /* world x on the z=0 plane -> screen fraction */
  let handL = 0, handR = 0, wordInk = 0;
  for (let i = 0; i < 40; i++) {
    const f = i / 39;
    handL = Math.max(handL, at(proj(-L.tipX - 0.5), 0.40 + 0.2 * f));
    handR = Math.max(handR, at(proj(L.tipX + 0.5), 0.40 + 0.2 * f));
    wordInk = Math.max(wordInk, at(0.35 + 0.3 * f, 0.5));
  }
  ok(handL > 60 && handR > 60, "both hands render (" + handL + ", " + handR + ")");
  ok(wordInk > 200, "the word renders (" + wordInk + ")");
  console.log((res.every(Boolean) ? "SELFTEST PASS" : "SELFTEST FAIL") + " (" + W + "x" + H + ")");
}

(async () => {
  if (!gl) { document.documentElement.classList.add("no-gl"); return; }
  try {
    setupGL();
    await fontReady();
    field = wordField();
    uploadWord(field);
    resize();
    if (Q.has("selftest")) selftest();
    start();
  } catch (e) {
    console.error(e);
    document.documentElement.classList.add("no-gl");
  }
})();
</script>
</body>
</html>
