<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>addicted — almost</title>
<meta name="description" content="Adam's and God's hands from the Sistine ceiling, with the word addicted turning in the gap between them.">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preload" href="hands/addicted.glb" as="fetch" type="model/gltf-binary" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:wght@400&display=swap" rel="stylesheet">
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #stage { position: fixed; inset: 0; opacity: 0; transition: opacity 1.4s ease; }
  #stage.on { opacity: 1; }
  .hand { position: absolute; left: 0; top: 0; transform-origin: 0 0; pointer-events: none;
          user-select: none; -webkit-user-drag: none; }
  /* the faint light the word throws, as in the reference: a real gradient, not drawn */
  #glow { position: absolute; left: 0; top: 0; pointer-events: none; border-radius: 50%;
          background: radial-gradient(closest-side, rgba(214, 230, 255, .13), rgba(160, 200, 255, .05) 55%, transparent); }
  #word { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  /* the word as type, where it would have turned: no WebGL, or three.js never arrived */
  #still { position: absolute; left: 0; top: 0; margin: 0; display: none; transform: translate(-50%, -54%);
           color: #eef0f3; font: 400 10px/1 "Instrument Serif", Georgia, serif; white-space: nowrap;
           text-shadow: 0 0 .35em rgba(190, 215, 255, .35); }
  .flat #still { display: block; }
  .flat #word { display: none; }
  @media (prefers-reduced-motion: reduce) { #stage { transition: none; } }
</style>
</head>
<body>
<div id="stage" role="img"
     aria-label="Adam's and God's hands from Michelangelo's Creation of Adam reach toward each other across a black field, and between their fingertips the word addicted turns slowly in white.">
  <img class="hand" id="adam" src="hands/adam.webp" width="1269" height="474" alt="" decoding="async">
  <img class="hand" id="god" src="hands/god.webp" width="1256" height="532" alt="" decoding="async">
  <div id="glow"></div>
  <canvas id="word"></canvas>
  <p id="still" aria-hidden="true">addicted</p>
</div>
<script>
"use strict";
/* ============================================================
   "almost" — Adam and God from the Sistine ceiling, the word
   turning in the gap. The hands are the fresco itself, cut out
   (hands/cutout.py); the word is a Blender model of the
   wordmark (hands/word.py), drawn live with three.js so it is
   sharp at any size. This classic script owns the layout, so the
   hands still arrive if the 3D never does.
   ?selftest  console checks
   ============================================================ */
const STAGE = document.getElementById("stage");
/* each cut-out's size and index fingertip, in its own pixels (printed by cutout.py) */
const HANDS = {
  adam: { el: document.getElementById("adam"), w: 1269, h: 474, tip: [1260, 198] },
  god:  { el: document.getElementById("god"),  w: 1256, h: 532, tip: [8, 325] }
};
const LAYOUT = {};

/* The fresco's two hands keep their true scale to each other; only the gap between
   them is ours, and it is sized to hold the word face-on with air either side.
   Portrait keeps the reference's horizontal band — the arms run off the screen
   edges and the hands stay large enough to read. */
function layout() {
  const vw = STAGE.clientWidth || innerWidth, vh = STAGE.clientHeight || innerHeight;
  const portrait = vw < vh * 0.8;
  const word = portrait ? vw * 0.42 : Math.min(vw * 0.30, vh * 0.62);
  const gap = portrait ? vw * 0.035 : Math.max(vw * 0.028, 20);
  const k = (portrait ? vw * 0.95 : Math.min(vw * 0.42, vh * 1.05)) / HANDS.adam.w;
  const cx = vw / 2, cy = vh / 2;
  const ax = cx - word / 2 - gap, gx = cx + word / 2 + gap;
  const put = (h, x, y) => {
    h.el.style.width = h.w + "px"; h.el.style.height = h.h + "px";
    h.el.style.transform = "translate(" + (x - h.tip[0] * k).toFixed(2) + "px," + (y - h.tip[1] * k).toFixed(2) + "px) scale(" + k.toFixed(5) + ")";
  };
  /* on the ceiling God's finger sits a touch above Adam's */
  put(HANDS.adam, ax, cy + vh * 0.012);
  put(HANDS.god, gx, cy - vh * 0.012);
  Object.assign(LAYOUT, { vw, vh, word, gap, k, cx, cy, adamTip: ax, godTip: gx });
  const still = document.getElementById("still");
  still.style.left = cx + "px"; still.style.top = cy + "px";
  still.style.fontSize = (word / 3.6).toFixed(1) + "px";     /* the face sets ~3.6 ems wide */
  glow(1);
}
/* the glow narrows with the word's projected width as it turns */
function glow(span) {
  const g = document.getElementById("glow"), L = LAYOUT;
  const w = L.word * 1.5, h = L.word * 0.62;
  g.style.width = w + "px"; g.style.height = h + "px";
  g.style.transform = "translate(" + (L.cx - w / 2).toFixed(1) + "px," + (L.cy - h / 2).toFixed(1) + "px) scaleX(" + (0.3 + 0.7 * span).toFixed(3) + ")";
}
layout();
addEventListener("resize", () => { layout(); if (window.onLayout) window.onLayout(); });

/* the hands decode, then the stage fades up — with the 3D if it is ready by then,
   or as soon as it is; and without it if it has not come in a few seconds */
const handsReady = Promise.all(Object.values(HANDS).map(h => h.el.decode().catch(() => {})));
let wordReady = false;
handsReady.then(() => { if (wordReady) STAGE.classList.add("on"); });
window.wordIsReady = () => { wordReady = true; handsReady.then(() => STAGE.classList.add("on")); };
setTimeout(() => {
  if (!wordReady) { document.documentElement.classList.add("flat"); handsReady.then(() => STAGE.classList.add("on")); }
}, 6000);
</script>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { MeshoptDecoder } from "three/addons/libs/meshopt_decoder.module.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const Q = new URLSearchParams(location.search);
const TAU = Math.PI * 2;
const SPIN = TAU / 5.4;          /* edge-on twice every 5.4s, the reference's pace */
const START = -0.35, STILL = -0.5;
const FOV = 20, DIST = 12;
const RM = matchMedia("(prefers-reduced-motion: reduce)");
const L = LAYOUT;

let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("word"), antialias: true, alpha: true,
                                       powerPreference: "high-performance", preserveDrawingBuffer: Q.has("selftest") });
} catch (e) {
  document.documentElement.classList.add("flat"); window.wordIsReady(); throw e;
}
renderer.setClearColor(0x000000, 0);
/* Neutral keeps a white white; ACES would grey it */
renderer.toneMapping = THREE.NeutralToneMapping;

const scene = new THREE.Scene();
/* a lit room to reflect: what makes white porcelain read as glossy rather than flat */
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.6;
const key = new THREE.DirectionalLight(0xffffff, 1.2); key.position.set(-3, 4, 3); scene.add(key);
const rim = new THREE.DirectionalLight(0xa8ccff, 1.4); rim.position.set(3, -1, -3); scene.add(rim);
const camera = new THREE.PerspectiveCamera(FOV, 1, 0.1, 100);
camera.position.set(0, 0, DIST);

let word = null, modelW = 1;
try {
  const gltf = await new GLTFLoader().setMeshoptDecoder(MeshoptDecoder).loadAsync("hands/addicted.glb");
  word = gltf.scene;
  word.traverse(o => {
    if (o.isMesh) o.material = new THREE.MeshPhysicalMaterial({
      color: 0xe6e8ec, roughness: 0.26, metalness: 0, clearcoat: 1, clearcoatRoughness: 0.06
    });
  });
  modelW = new THREE.Box3().setFromObject(word).getSize(new THREE.Vector3()).x;
  scene.add(word);
} catch (e) {
  console.error(e);
  document.documentElement.classList.add("flat"); window.wordIsReady(); throw e;
}

/* size the model so that, face-on, it spans exactly the gap the layout left for it */
function fit() {
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  renderer.setSize(L.vw, L.vh, false);
  camera.aspect = L.vw / L.vh;
  camera.updateProjectionMatrix();
  const unitsPerPx = 2 * DIST * Math.tan(FOV * Math.PI / 360) * camera.aspect / L.vw;
  word.scale.setScalar(L.word * unitsPerPx / modelW);
}
function draw(angle) {
  word.rotation.y = angle;
  glow(Math.abs(Math.cos(angle)));
  renderer.render(scene, camera);
}

let raf = 0, t0 = performance.now();
function frame(now) {
  raf = 0;
  draw(START + (now - t0) / 1000 * SPIN);
  if (!RM.matches) raf = requestAnimationFrame(frame);
}
function start() {
  if (raf) cancelAnimationFrame(raf), raf = 0;
  if (RM.matches) draw(STILL); else raf = requestAnimationFrame(frame);
}
window.onLayout = () => { fit(); if (RM.matches) draw(STILL); };
RM.addEventListener("change", start);

fit();
draw(RM.matches ? STILL : START);
window.wordIsReady();
start();

/* ---------- ?selftest ----------
   The piece promises the word turns in the gap without ever reaching a finger. Project
   the model's bounds to the screen at every angle of a turn and hold them inside the
   two fingertips; then check the hands and the word actually reached the screen. */
if (Q.has("selftest")) {
  const res = [], ok = (c, m) => { res.push(c); console[c ? "log" : "error"]((c ? "PASS " : "FAIL ") + m); };
  let lo = Infinity, hi = -Infinity;
  const box = new THREE.Box3(), v = new THREE.Vector3();
  for (let a = 0; a < TAU; a += TAU / 180) {
    word.rotation.y = a; word.updateMatrixWorld(true);
    box.setFromObject(word, true);
    for (let i = 0; i < 8; i++) {
      v.set(i & 1 ? box.max.x : box.min.x, i & 2 ? box.max.y : box.min.y, i & 4 ? box.max.z : box.min.z).project(camera);
      const x = (v.x + 1) / 2 * L.vw;
      lo = Math.min(lo, x); hi = Math.max(hi, x);
    }
  }
  ok(lo > L.adamTip && hi < L.godTip, "the turning word stays between the fingertips (" + lo.toFixed(0) + ".." + hi.toFixed(0) +
     " inside " + L.adamTip.toFixed(0) + ".." + L.godTip.toFixed(0) + ")");
  await handsReady;
  ok(HANDS.adam.el.naturalWidth === 1269 && HANDS.god.el.naturalWidth === 1256, "both hands decoded at full size");
  const onScreen = h => { const r = h.el.getBoundingClientRect(); return r.right > 0 && r.left < L.vw && r.bottom > 0 && r.top < L.vh; };
  ok(onScreen(HANDS.adam) && onScreen(HANDS.god), "both hands are on screen");
  draw(0);
  const gl = renderer.getContext(), px = new Uint8Array(4);
  let ink = 0;
  const dpr = renderer.getPixelRatio();
  for (let i = 0; i < 60; i++) {
    gl.readPixels(Math.round((L.cx - L.word * 0.45 + L.word * 0.9 * i / 59) * dpr), Math.round(L.cy * dpr), 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
    ink = Math.max(ink, px[3]);
  }
  ok(ink > 200, "the word renders (alpha " + ink + ")");
  console.log((res.every(Boolean) ? "SELFTEST PASS" : "SELFTEST FAIL") + " (" + L.vw + "x" + L.vh + ")");
  start();
}
</script>
</body>
</html>
